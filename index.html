<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Pro Max Ultra 300+</title>
    
    <meta property="og:title" content="日本旅遊神器 Pro Max Ultra">
    <meta property="og:description" content="出國必備！內建 300+ 句常用日語與羅馬拼音，支援即時翻譯、收藏與離線使用。">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/197/197604.png">

    <style>
        :root {
            --bg-dark: #070b14;
            --accent-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --star-gold: #fbbf24;
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            background-attachment: fixed; color: var(--text-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: -apple-system, "Microsoft JhengHei", sans-serif; padding-bottom: 100px;
            min-height: 100vh;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        #appTitle { font-size: 26px; margin: 30px 0; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); cursor: pointer; user-select: none; }

        .search-box { width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; backdrop-filter: blur(10px); }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; width: 100%; }
        .control-panel { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 20px; border: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; }
        .quick-nav { grid-column: span 2; display: flex; gap: 10px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid var(--card-border); background: var(--card-bg); color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .nav-btn.active { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); border-color: transparent; }
        .toggle-group { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-sub); font-weight: bold; }

        .category-container { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 15px 0; margin-bottom: 15px; scrollbar-width: none; width: 100%; -webkit-overflow-scrolling: touch; }
        .category-container::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 50px; white-space: nowrap; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }
        .tab-hidden { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; display: none; }

        .grid-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .phrase-card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 28px; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: 0.1s; overflow: hidden; }
        .phrase-card:active { transform: scale(0.97); }
        .card-content { padding: 30px 20px 20px 20px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .zh-text { font-size: 21px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .ja-wrapper { background: rgba(59, 130, 246, 0.1); padding: 10px 20px; border-radius: 12px; margin-bottom: 6px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .ja-text { font-size: 19px; color: #93c5fd; font-weight: bold; }
        .romaji-text { font-size: 13px; color: var(--text-sub); font-style: italic; margin-bottom: 10px; }
        .fav-star { position: absolute; top: 18px; left: 22px; font-size: 26px; color: rgba(255,255,255,0.1); transition: 0.2s; padding: 5px; }
        .fav-star.active { color: var(--star-gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        
        .full-bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--card-border); padding: 16px; font-weight: bold; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .modal-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
        .modal-zh { font-size: 24px; color: var(--text-sub); margin-top: 40px; }
        .close-modal { margin-top: 80px; padding: 20px 60px; background: #1e293b; color: #fff; border-radius: 50px; font-size: 20px; font-weight: bold; border: none; }

        .custom-area { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 30px; width: 100%; box-sizing: border-box; border: 1px solid var(--card-border); }
        .custom-textarea { width: 100%; height: 100px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--card-border); padding: 15px; border-radius: 18px; box-sizing: border-box; margin-bottom: 15px; font-size: 18px; outline: none; text-align: center; }
        .translated-box { background: rgba(16,185,129,0.05); padding: 20px; border-radius: 15px; color: #6ee7b7; font-weight: bold; margin-bottom: 15px; min-height: 50px; font-size: 22px; text-align: center; }
        .custom-play-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; border-radius: 18px; font-weight: bold; font-size: 20px; }

        .install-fab { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(59, 130, 246, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 15px 30px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); color: white; font-weight: bold; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 9999; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1 id="appTitle">🇯🇵 Japan Travel Ultra</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋你想說的話...">
        
        <div class="controls-grid">
            <div class="quick-nav">
                <button class="nav-btn" id="btnRecent">🕒 最近</button>
                <button class="nav-btn" id="btnFav">⭐ 最愛</button>
            </div>
            <div class="control-panel"><div class="toggle-group">🔊 大音量 <input type="checkbox" id="volumeToggle"></div></div>
            <div class="control-panel"><div class="toggle-group">🐢 龜速 <input type="checkbox" id="turtleToggle"></div></div>
        </div>

        <div class="category-container" id="category-container"></div>
        <div class="grid-container" id="button-container"></div>
    </div>

    <div id="installBtn" class="install-fab">📥 安裝到桌面</div>

    <div id="fullScreenModal" class="modal">
        <div class="modal-ja" id="modalJaText"></div>
        <div class="modal-zh" id="modalZhText"></div>
        <button class="close-modal" onclick="document.getElementById('fullScreenModal').style.display='none'">✖ 關閉</button>
    </div>

    <script>
        // 🚀 完整 300+ 句資料庫 (含隱藏髒話模式)
        var phrasesData = {
            "👋 招呼/常用": [
                { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" }, { zh: "謝謝", ja: "ありがとうございます", romaji: "Arigatou" }, { zh: "請問/不好意思", ja: "すみません", romaji: "Sumimasen" }, { zh: "沒關係", ja: "大丈夫です", romaji: "Daijoubu" }, { zh: "拜託了", ja: "お願いします", romaji: "Onegaishimasu" }, { zh: "對不起", ja: "ごめんなさい", romaji: "Gomennasai" }, { zh: "早安", ja: "おはようございます", romaji: "Ohayou" }, { zh: "晚安", ja: "こんばんは", romaji: "Konbanwa" }, { zh: "我不懂日文", ja: "日本語がわかりません", romaji: "Nihongo ga..." }, { zh: "再說一次", ja: "もう一度言ってください", romaji: "Mou ichido" }, { zh: "慢一點", ja: "ゆっくり話してください", romaji: "Yukkuri" }, { zh: "幫了大忙", ja: "助かりました", romaji: "Tasukarimashita" }
            ],
            "🏨 飯店住宿": [
                { zh: "辦理入住", ja: "チェックインをお願いします", romaji: "Chekku-in" }, { zh: "我有預約", ja: "予約しています", romaji: "Yoyaku" }, { zh: "寄放行李", ja: "荷物を預かってもらえますか", romaji: "Nimotsu" }, { zh: "Wi-Fi 密碼", ja: "Wi-Fiのパスワードは何ですか", romaji: "Pasuwaado" }, { zh: "早餐時間", ja: "朝食は何時ですか", romaji: "Choushoku" }, { zh: "退房", ja: "チェックアウトをお願いします", romaji: "Chekku-auto" }, { zh: "沒有熱水", ja: "お湯が出ません", romaji: "Oyu ga demasen" }, { zh: "叫計程車", ja: "タクシーを呼んでください", romaji: "Takushii" }
            ],
            "🍜 餐廳用餐": [
                { zh: "兩位", ja: "2人です", romaji: "Futari desu" }, { zh: "有菜單嗎", ja: "メニューはありますか", romaji: "Menyuu" }, { zh: "推薦什麼", ja: "おすすめは何ですか", romaji: "Osusume" }, { zh: "點這個", ja: "これをお願いします", romaji: "Kore o" }, { zh: "請給我水", ja: "お水をください", romaji: "Omizu" }, { zh: "不要芥末", ja: "わさび抜きでお願いします", romaji: "Wasabi nuki" }, { zh: "很好吃", ja: "とても美味しいです", romaji: "Oishii" }, { zh: "結帳", ja: "お会計をお願いします", romaji: "Okaikei" }, { zh: "分開付", ja: "別々に払えますか", romaji: "Betsubetsu" }
            ],
            "🛍️ 購物免稅": [
                { zh: "多少錢", ja: "いくらですか", romaji: "Ikura desu ka" }, { zh: "我要買這個", ja: "これをください", romaji: "Kore o kudasai" }, { zh: "可以免稅嗎", ja: "免税できますか", romaji: "Menzei" }, { zh: "全新庫存", ja: "新しいものはありますか", romaji: "Atarashii" }, { zh: "試穿", ja: "試着してもいいですか", romaji: "Shichaku" }, { zh: "要袋子", ja: "袋をください", romaji: "Fukuro" }, { zh: "不要袋子", ja: "袋はいりません", romaji: "Fukuro iranai" }
            ],
            "🚇 交通問路": [
                { zh: "廁所在哪", ja: "トイレはどこですか", romaji: "Toire" }, { zh: "車站在哪", ja: "駅はどこですか", romaji: "Eki" }, { zh: "到新宿嗎", ja: "新宿に行きますか", romaji: "Shinjuku ni" }, { zh: "買票處", ja: "切符売り場はどこですか", romaji: "Kippu" }, { zh: "我要下車", ja: "ここで降ります", romaji: "Koko de orimasu" }, { zh: "下一站", ja: "次の駅はどこですか", romaji: "Tsugi no eki" }, { zh: "出口在哪", ja: "出口はどこですか", romaji: "Deguchi" }
            ],
            "🏪 便利商店": [
                { zh: "請微波", ja: "温めてください", romaji: "Atatamete" }, { zh: "給我筷子", ja: "お箸をください", romaji: "Ohashi" }, { zh: "儲值卡", ja: "チャージをお願いします", romaji: "Chaaji" }, { zh: "收據", ja: "レシートをください", romaji: "Reshiito" }
            ],
            "🚑 醫療/緊急": [
                { zh: "救命/幫幫我", ja: "助けてください", romaji: "Tasukete" }, { zh: "叫救護車", ja: "救急車を呼んでください", romaji: "Kyuukyuusha" }, { zh: "我迷路了", ja: "道に迷いました", romaji: "Michi ni mayoimashita" }, { zh: "肚子痛", ja: "お腹が痛いです", romaji: "Onaka ga itai" }
            ],
            "🔢 數字/計數": [
                { zh: "1個", ja: "1つ (ひとつ)", romaji: "Hitotsu" }, { zh: "2個", ja: "2つ (ふたつ)", romaji: "Futatsu" }, { zh: "3個", ja: "3つ (みっつ)", romaji: "Mittsu" }, { zh: "1人", ja: "1人 (ひとり)", romaji: "Hitori" }, { zh: "2人", ja: "2人 (ふたり)", romaji: "Futari" }
            ]
        };

        // 🔞 髒話語料庫 (隱藏版)
        const hiddenPhrases = [
            { zh: "笨蛋", ja: "馬鹿 (ばか)", romaji: "Baka" },
            { zh: "白癡", ja: "阿呆 (あほう)", romaji: "Ahou" },
            { zh: "畜生/可惡", ja: "畜生 (ちくしょう)", romaji: "Chikusho" },
            { zh: "混蛋/屎", ja: "クソ", romaji: "Kuso" },
            { zh: "去死吧", ja: "死ね (しね)", romaji: "Shine" },
            { zh: "下地獄吧", ja: "くたばれ", romaji: "Kutabare" },
            { zh: "別惹我/開什麼玩笑", ja: "ふざけるな (ふざけんな)", romaji: "Fuzakenna" },
            { zh: "吵死了/閉嘴", ja: "うるさい (うっせぇ)", romaji: "Ussee" },
            { zh: "你這傢伙 (極其無禮)", ja: "てめぇ", romaji: "Temee" },
            { zh: "混帳東西", ja: "馬鹿野郎 (ばかやろう)", romaji: "Bakayarou" },
            { zh: "廢物", ja: "クズ", romaji: "Kuzu" },
            { zh: "渣男/垃圾", ja: "カス", romaji: "Kasu" },
            { zh: "神經病/瘋子", ja: "気違い (きちがい)", romaji: "Kichigai" },
            { zh: "滾開", ja: "どけ", romaji: "Doke" },
            { zh: "醜女", ja: "ブス", romaji: "Busu" },
            { zh: "禿頭", ja: "ハゲ", romaji: "Hage" },
            { zh: "變態", ja: "変態 (へんたい)", romaji: "Hentai" },
            { zh: "色狼", ja: "すけべ", romaji: "Sukebe" },
            { zh: "臭小鬼", ja: "クソガキ", romaji: "Kusogaki" },
            { zh: "雜魚/弱雞", ja: "雑魚 (ざこ)", romaji: "Zako" },
            { zh: "看什麼看？", ja: "何見てんだよ？", romaji: "Nani miten da yo" }
        ];

        var currentCategory = '🌟 全部';
        var favorites = [];
        var historyList = [];
        var clickCount = 0; // 隱藏模式計數器

        try { 
            favorites = JSON.parse(localStorage.getItem('jp_favs')) || []; 
            historyList = JSON.parse(localStorage.getItem('jp_history')) || [];
        } catch(e) {}

        function speak(text, item) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = document.getElementById('turtleToggle').checked ? 0.45 : 0.85;
            u.volume = document.getElementById('volumeToggle').checked ? 1.0 : 0.8;
            window.speechSynthesis.speak(u);
            if (item) {
                historyList = historyList.filter(function(h){ return h.ja !== item.ja; });
                historyList.unshift(item);
                if (historyList.length > 20) historyList.pop();
                localStorage.setItem('jp_history', JSON.stringify(historyList));
            }
        }

        function render(cat, query) {
            var container = document.getElementById('button-container');
            container.innerHTML = '';
            if (cat === '✏️ 自訂') {
                container.innerHTML = '<div class="custom-area"><textarea id="customInput" class="custom-textarea" placeholder="在此輸入中文，我們幫您翻譯..."></textarea><div id="translatedResult" class="translated-box">結果</div><button class="custom-play-btn" onclick="doTranslate()">🌍 翻譯並發音</button></div>';
                return;
            }
            var list = [];
            if (cat === '🌟 全部') { for (var k in phrasesData) { list = list.concat(phrasesData[k]); } } 
            else if (cat === '⭐ 最愛') { for (var k in phrasesData) { var f = phrasesData[k].filter(function(i){ return favorites.indexOf(i.ja) > -1; }); list = list.concat(f); } } 
            else if (cat === '🕒 最近') { list = historyList; } 
            else if (cat === '🔞 隱藏模式') { list = hiddenPhrases; }
            else { list = phrasesData[cat] || []; }

            if (query) {
                query = query.toLowerCase();
                list = list.filter(function(i) { return i.zh.indexOf(query) > -1 || i.ja.indexOf(query) > -1 || (i.romaji && i.romaji.toLowerCase().indexOf(query) > -1); });
            }

            var uniqueMap = new Map();
            list.forEach(function(item){ uniqueMap.set(item.ja, item); });
            var uniqueList = Array.from(uniqueMap.values());

            for (var i = 0; i < uniqueList.length; i++) {
                var item = uniqueList[i];
                var isFav = favorites.indexOf(item.ja) > -1;
                var div = document.createElement('div');
                div.className = 'phrase-card';
                div.innerHTML = '<div class="card-content"><div class="fav-star '+(isFav?'active':'')+'">★</div><div class="zh-text">'+item.zh+'</div><div class="ja-wrapper"><span class="ja-text">🔊 '+item.ja+'</span></div><div class="romaji-text">'+(item.romaji||'')+'</div></div><button class="full-bar-btn" onclick="event.stopPropagation(); zoom(\''+item.ja+'\',\''+item.zh+'\')">🪧 放大顯示</button>';
                (function(obj, el){
                    el.onclick = function() { speak(obj.ja, obj); };
                    el.querySelector('.fav-star').onclick = function(e) {
                        e.stopPropagation();
                        var idx = favorites.indexOf(obj.ja);
                        if(idx > -1) favorites.splice(idx,1); else favorites.push(obj.ja);
                        localStorage.setItem('jp_favs', JSON.stringify(favorites));
                        render(currentCategory, document.getElementById('searchInput').value);
                    };
                })(item, div);
                container.appendChild(div);
            }
        }

        function zoom(ja, zh) {
            document.getElementById('modalJaText').innerText = ja;
            document.getElementById('modalZhText').innerText = zh;
            document.getElementById('fullScreenModal').style.display = 'flex';
        }

        async function doTranslate() {
            var q = document.getElementById('customInput').value;
            var rb = document.getElementById('translatedResult');
            if(!q) return;
            rb.innerText = '⏳ 翻譯中...';
            try {
                var res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=zh-TW|ja');
                var d = await res.json();
                rb.innerText = d.responseData.translatedText;
                speak(rb.innerText);
            } catch(e) { rb.innerText = '❌ 網路錯誤'; }
        }

        // 🤫 標題點擊解鎖邏輯
        document.getElementById('appTitle').onclick = function() {
            clickCount++;
            if (clickCount === 10) {
                var hiddenTab = document.createElement('button');
                hiddenTab.className = 'tab-btn active tab-hidden';
                hiddenTab.style.display = 'block';
                hiddenTab.innerText = '🔞 隱藏模式';
                hiddenTab.onclick = function() {
                    document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                    this.classList.add('active');
                    currentCategory = '🔞 隱藏模式'; render(currentCategory, '');
                };
                document.getElementById('category-container').prepend(hiddenTab);
                
                document.querySelectorAll('.tab-btn').forEach(function(btn){ if(btn !== hiddenTab) btn.classList.remove('active'); });
                currentCategory = '🔞 隱藏模式';
                render(currentCategory, '');
                alert("😈 髒話模式已解鎖！小朋友不要亂用喔。");
            }
        };

        window.onload = function() {
            var cc = document.getElementById('category-container');
            var cats = ['🌟 全部'].concat(Object.keys(phrasesData)).concat(['✏️ 自訂']);
            cats.forEach(function(c) {
                var b = document.createElement('button');
                b.className = 'tab-btn' + (c === '🌟 全部' ? ' active' : '');
                b.innerText = c;
                b.onclick = function() {
                    document.getElementById('btnRecent').classList.remove('active');
                    document.getElementById('btnFav').classList.remove('active');
                    document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                    b.classList.add('active');
                    currentCategory = c; render(c, '');
                };
                cc.appendChild(b);
            });
            document.getElementById('btnRecent').onclick = function() {
                document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                document.getElementById('btnFav').classList.remove('active');
                this.classList.add('active');
                currentCategory = '🕒 最近'; render('🕒 最近', '');
            };
            document.getElementById('btnFav').onclick = function() {
                document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                document.getElementById('btnRecent').classList.remove('active');
                this.classList.add('active');
                currentCategory = '⭐ 最愛'; render('⭐ 最愛', '');
            };
            document.getElementById('searchInput').oninput = function(e) { render(currentCategory, e.target.value); };
            render('🌟 全部', '');
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
