<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊常用句</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ox0114xo/Japan/refs/heads/main/IMG_20260225_194735.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ox0114xo/Japan/refs/heads/main/IMG_20260225_194735.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { 
            --bg-dark: #0f172a; --neon-blue: #00f0ff; --neon-purple: #b026ff; 
            --neon-green: #39ff14; --neon-red: #ff3333; --btn-depth: #0369a1; 
            --text-main: #e2e8f0; --text-muted: #94a3b8; 
        }
        
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%); color: var(--text-main); padding: 15px; max-width: 600px; margin: 0 auto; line-height: 1.6; padding-bottom: 50px; min-height: 100vh; }
        
        /* 標題與 Logo */
        .header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        .logo { width: 70px; height: 70px; border-radius: 18px; box-shadow: 0 0 15px var(--neon-blue); margin-bottom: 12px; border: 2px solid var(--neon-blue); cursor: pointer; }
        h1 { color: #fff; text-shadow: 0 0 10px var(--neon-blue); font-size: 22px; margin: 0; user-select: none; cursor: pointer; letter-spacing: 1px; }

        /* 搜尋 + 翻譯列 */
        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--neon-purple); border-radius: 12px; color: #fff; font-size: 16px; outline: none; }
        .trans-btn { background: var(--neon-purple); border: none; border-radius: 12px; padding: 0 18px; color: white; cursor: pointer; font-size: 20px; transition: 0.3s; }
        .trans-btn:active { transform: scale(0.9); }

        /* 分類按鈕 */
        .cat-scroll { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 8px; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { white-space: nowrap; background: rgba(0,0,0,0.5); color: var(--text-muted); border: 1px solid #334155; padding: 8px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .cat-btn.active { color: var(--neon-blue); border-color: var(--neon-blue); background: rgba(0, 240, 255, 0.1); font-weight: bold; }
        .cat-btn.secret-active { color: var(--neon-red); border-color: var(--neon-red); background: rgba(255, 51, 51, 0.1); }

        /* 機械按鍵列表 */
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(0, 240, 255, 0.3); 
            border-radius: 14px; margin-bottom: 20px; padding: 18px; display: flex; justify-content: space-between; 
            align-items: center; cursor: pointer; box-shadow: 0 6px 0 var(--btn-depth), 0 10px 15px rgba(0,0,0,0.4); 
            transform: translateY(0); transition: 0.1s; 
        }
        li:active { transform: translateY(6px); box-shadow: 0 0 0 var(--btn-depth), 0 2px 4px rgba(0,0,0,0.4); }
        
        .play-icon { font-size: 22px; margin-right: 15px; color: var(--neon-blue); opacity: 0.8; }
        .content { flex: 1; }
        .jp { font-size: 18px; font-weight: bold; color: #fff; display: block; margin-bottom: 3px; }
        .romaji { font-size: 12px; color: var(--neon-blue); font-family: monospace; display: block; margin-bottom: 5px; opacity: 0.8; }
        .zh { font-size: 14px; color: var(--text-muted); display: block; }

        .actions { display: flex; gap: 10px; }
        .btn { background: rgba(0,0,0,0.3); border: 1px solid #334155; border-radius: 8px; color: #64748b; padding: 8px; font-size: 18px; }
        .btn.fav-on { color: #fbbf24; border-color: #fbbf24; }

        /* 全螢幕直式字幕模式 */
        #fs-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #fs-jp { 
            writing-mode: vertical-rl; text-orientation: upright;
            font-size: 14vw; color: var(--neon-green); font-weight: bold; 
            line-height: 1.2; letter-spacing: 0.2em;
            text-shadow: 0 0 20px var(--neon-green);
            max-height: 70vh; margin-bottom: 30px;
        }
        #fs-zh { font-size: 5vw; color: #fff; opacity: 0.7; border-top: 1px solid #333; padding-top: 15px; width: 80%; text-align: center; }
        .fs-close-hint { position: absolute; bottom: 20px; color: #444; font-size: 12px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="fs-overlay" onclick="this.style.display='none'">
        <div id="fs-jp"></div>
        <div id="fs-zh"></div>
        <div class="fs-close-hint">[ CLICK ANYWHERE TO CLOSE ]</div>
    </div>

    <div class="header">
        <img src="https://raw.githubusercontent.com/ox0114xo/Japan/refs/heads/main/IMG_20260225_194735.png" class="logo" onclick="location.reload()" title="回到首頁">
        <h1 id="app-title">日本旅遊常用句</h1>
    </div>

    <div class="search-row">
        <input type="text" id="search" class="search-box" placeholder="搜尋或輸入中文按⚡翻譯..." onkeyup="doSearch()">
        <button class="trans-btn" onclick="goTranslate()" id="trans-icon">⚡</button>
    </div>

    <div class="cat-scroll" id="cats"></div>

    <div id="loading" style="text-align: center; padding: 40px; color: var(--neon-blue); font-family: monospace;">
        📡 資料同步中...
    </div>

    <ul id="list"></ul>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
        let raw = [], curCat = '全部', favs = JSON.parse(localStorage.getItem('jp_f')) || [], unlocked = false, clicks = 0;
        
        // ⚡ 新增：翻譯紀錄儲存空間
        let transHistory = JSON.parse(localStorage.getItem('jp_trans_hist')) || [];

        function play(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); }

        async function goTranslate() {
            const t = document.getElementById('search').value.trim();
            if(!t) return;
            const btn = document.getElementById('trans-icon');
            btn.innerText = '⌛';
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=zh-TW|ja`);
                const d = await r.json();
                const jp = d.responseData.translatedText;
                
                // 儲存至紀錄
                const newItem = { cat: '⚡ 紀錄', zh: t, jp: jp, romaji: '' };
                transHistory.unshift(newItem); // 加到最前面
                if(transHistory.length > 50) transHistory.pop(); // 最多存50筆
                localStorage.setItem('jp_trans_hist', JSON.stringify(transHistory));
                
                play(jp);
                curCat = '⚡ 紀錄';
                drawCats();
                doSearch(); 
            } catch(e) { alert("翻譯失敗，請檢查網路"); }
            btn.innerText = '⚡';
        }

        document.getElementById('app-title').onclick = () => {
            if(unlocked) return;
            if(++clicks >= 10) { unlocked = true; alert("⚠️ 髒話模式已解鎖"); curCat = '🤬 隱藏情緒'; drawCats(); doSearch(); }
        };

        async function init() {
            try {
                const r = await fetch(CSV_URL);
                const csv = await r.text();
                const rows = csv.split('\n').slice(1);
                raw = rows.map(line => {
                    const c = line.split(',');
                    return { cat: c[0], zh: c[1], jp: c[2], romaji: c[3] };
                }).filter(i => i.jp);
                document.getElementById('loading').style.display = 'none';
                drawCats();
                doSearch();
            } catch(e) { document.getElementById('loading').innerText = "連線失敗"; }
        }

        function drawCats() {
            const s = new Set(['全部', '⭐收藏', '⚡ 紀錄']);
            raw.forEach(i => {
                if(i.cat === '🤬 隱藏情緒') { if(unlocked) s.add(i.cat); }
                else { s.add(i.cat); }
            });
            const div = document.getElementById('cats');
            div.innerHTML = '';
            s.forEach(c => {
                const b = document.createElement('button');
                b.className = `cat-btn ${c===curCat ? (c.includes('🤬')?'secret-active':'active') : ''}`;
                b.innerText = c;
                if(c==='⭐收藏' && c!==curCat) b.style.color = '#fbbf24';
                if(c==='⚡ 紀錄' && c!==curCat) b.style.color = 'var(--neon-purple)';
                b.onclick = () => { curCat = c; drawCats(); doSearch(); };
                div.appendChild(b);
            });
        }

        function doSearch() {
            const q = document.getElementById('search').value.toLowerCase();
            
            // 決定要從哪個資料源篩選
            let source = (curCat === '⚡ 紀錄') ? transHistory : raw;

            const filtered = source.filter(i => {
                if(i.cat === '🤬 隱藏情緒' && !unlocked) return false;
                if(curCat === '全部' && i.cat === '🤬 隱藏情緒') return false;
                
                const mC = (curCat === '全部') ? true : 
                           (curCat === '⭐收藏') ? favs.includes(i.jp) : 
                           (curCat === '⚡ 紀錄') ? true : (i.cat === curCat);
                
                const mQ = i.zh.includes(q) || i.jp.includes(q);
                return mC && mQ;
            });
            drawList(filtered);
        }

        function drawList(data) {
            const el = document.getElementById('list');
            el.innerHTML = '';
            data.forEach(i => {
                const isF = favs.includes(i.jp);
                const item = document.createElement('li');
                item.onclick = () => play(i.jp);
                item.innerHTML = `
                    <div class="play-icon" style="${i.cat.includes('🤬')?'color:var(--neon-red)':''}">🔊</div>
                    <div class="content">
                        <span class="jp">${i.jp}</span>
                        <span class="romaji">${i.romaji || ''}</span>
                        <span class="zh">${i.zh}</span>
                    </div>
                    <div class="actions">
                        <button class="btn ${isF?'fav-on':''}" onclick="event.stopPropagation(); setFav('${i.jp}')">★</button>
                        <button class="btn" onclick="event.stopPropagation(); goFS('${i.jp}','${i.zh}')">⛶</button>
                    </div>
                `;
                el.appendChild(item);
            });
        }

        function setFav(j) {
            const idx = favs.indexOf(j);
            if(idx > -1) favs.splice(idx, 1); else favs.push(j);
            localStorage.setItem('jp_f', JSON.stringify(favs));
            doSearch();
        }

        function goFS(j, z) {
            document.getElementById('fs-jp').innerText = j;
            document.getElementById('fs-zh').innerText = z;
            document.getElementById('fs-overlay').style.display = 'flex';
            play(j);
        }

        if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        init();
    </script>
</body>
</html>
