<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日文語音系統 v2.2 (除錯版)</title>
    <style>
        :root { --bg-dark: #0f172a; --neon-blue: #00f0ff; --neon-purple: #b026ff; --neon-green: #39ff14; --btn-depth: #0369a1; --text-main: #e2e8f0; --text-muted: #94a3b8; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 15px; max-width: 600px; margin: 0 auto; line-height: 1.6; padding-bottom: 90px; min-height: 100vh; }
        h1 { text-align: center; color: #fff; text-shadow: 0 0 10px var(--neon-blue); font-size: 26px; margin: 10px 0 20px 0; letter-spacing: 2px;}
        .search-box { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--neon-purple); border-radius: 8px; font-size: 16px; color: #fff; box-sizing: border-box; }
        .category-scroll { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 8px; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { white-space: nowrap; background: rgba(0,0,0,0.5); color: var(--text-muted); border: 1px solid #334155; padding: 10px 20px; border-radius: 30px; font-size: 14px; cursor: pointer; }
        .cat-btn.active { background: rgba(0, 240, 255, 0.1); color: var(--neon-blue); border-color: var(--neon-blue); font-weight: bold; }
        .slider-container { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 25px; }
        .speed-slider { flex: 1; -webkit-appearance: none; background: #334155; height: 4px; border-radius: 2px; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 12px; margin-bottom: 20px; padding: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 0 var(--btn-depth), 0 10px 15px rgba(0,0,0,0.5); transform: translateY(0); transition: 0.1s; position: relative; }
        li:active { transform: translateY(6px); box-shadow: 0 0 0 var(--btn-depth), 0 2px 4px rgba(0,0,0,0.5); border-color: var(--neon-blue); }
        .play-indicator { font-size: 24px; margin-right: 15px; color: var(--neon-blue); opacity: 0.8; }
        .text-content { flex: 1; margin-right: 10px; z-index: 1; }
        .jp-text { font-size: 18px; font-weight: bold; color: #fff; display: block; margin-bottom: 4px; }
        .romaji-text { font-size: 12px; color: var(--neon-blue); font-family: monospace; display: block; margin-bottom: 6px; }
        .zh-text { font-size: 14px; color: var(--text-muted); display: block; }
        .loader-container { display: flex; justify-content: center; align-items: center; padding: 40px; flex-direction: column; gap: 15px; }
        .tech-spinner { width: 40px; height: 40px; border: 3px solid transparent; border-top-color: var(--neon-blue); border-bottom-color: var(--neon-purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #error-box { display: none; background: rgba(255,0,0,0.1); border: 2px solid #ef4444; padding: 20px; border-radius: 12px; margin-top: 20px; word-break: break-all; }
        #error-box h3 { color: #ef4444; margin-top: 0; }
        #error-box p { color: #fff; font-size: 14px; }
    </style>
</head>
<body>

    <h1 id="app-title">NEO_JP_VOICE 🇯🇵</h1>
    <input type="text" id="search-input" class="search-box" placeholder="搜尋中文、日文或羅馬音..." onkeyup="filterData()">
    <div class="category-scroll" id="category-container"></div>

    <div class="slider-container">
        <span style="font-size: 14px; color: var(--text-muted);">⚙️ 系統語速</span>
        <input type="range" id="speed-slider" class="speed-slider" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateSpeedVal()">
        <span id="speed-val" style="font-family: monospace; color: var(--neon-blue); width: 35px; text-align: right;">1.0x</span>
    </div>

    <div id="error-box"></div>

    <div id="loading" class="loader-container">
        <div class="tech-spinner"></div>
        <span style="color: var(--neon-blue); font-family: monospace;">強制連線資料庫中...</span>
    </div>

    <ul id="sentence-list"></ul>

    <script>
        // 1. 強制解除所有 Service Worker (解決快取卡死的問題)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        
        // 2. 清除本機舊資料庫
        localStorage.clear();

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
        let globalData = [];
        let currentCategory = '全部';

        function updateSpeedVal() {
            document.getElementById('speed-val').innerText = Number(document.getElementById('speed-slider').value).toFixed(1) + 'x';
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return alert("引擎不支援");
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = parseFloat(document.getElementById('speed-slider').value);
            window.speechSynthesis.speak(utterance);
        }

        // 顯示錯誤面板的專用函數
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `
                <h3>❌ 發生致命錯誤</h3>
                <p>原因：${message}</p>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 15px;">請將此畫面截圖回報。</p>
            `;
        }

        async function loadCSV() {
            try {
                // 發送請求
                const res = await fetch(CSV_URL);
                if (!res.ok) throw new Error(`Google伺服器拒絕連線 (狀態碼: ${res.status})`);

                const csvText = await res.text();
                
                // 檢查是否沒有發布成功，導致抓到 Google 的登入網頁
                if (csvText.includes('<html') || csvText.includes('<!DOCTYPE')) {
                    throw new Error("取得的資料是網頁原始碼，而非試算表。請確認 Google 試算表的『發布到網路』是否設定為『所有人皆可存取』。");
                }

                if (!csvText || csvText.length < 10) {
                    throw new Error("取得的試算表內容為空。");
                }

                // 開始解析資料
                processData(csvText);

            } catch(e) {
                showError(e.message || e.toString());
            }
        }

        function processData(csvText) {
            try {
                const rows = csvText.split('\n');
                const categoriesSet = new Set(['全部']);
                globalData = [];

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if(!row) continue;
                    
                    // 修正可能有雙引號的問題
                    const cols = row.split(',');
                    if (cols.length >= 3) {
                        globalData.push({ 
                            cat: cols[0] || '未分類', 
                            zh: cols[1], 
                            jp: cols[2], 
                            romaji: cols[3] || '' 
                        });
                        categoriesSet.add(cols[0] || '未分類');
                    }
                }
                
                if(globalData.length === 0) throw new Error("成功連線，但找不到任何資料行。請檢查試算表欄位是否為 A(分類)、B(中文)、C(日文)、D(羅馬音)。");

                renderCategories(Array.from(categoriesSet));
                filterData();
                document.getElementById('loading').style.display = 'none';

            } catch(e) {
                showError("資料解析失敗: " + e.message);
            }
        }

        function renderCategories(cats) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === currentCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterData();
                };
                container.appendChild(btn);
            });
        }

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filteredData = globalData.filter(item => {
                let matchCat = (currentCategory === '全部') ? true : (item.cat === currentCategory);
                const matchQuery = (item.zh && item.zh.toLowerCase().includes(query)) || 
                                   (item.jp && item.jp.toLowerCase().includes(query)) || 
                                   (item.romaji && item.romaji.toLowerCase().includes(query));
                return matchCat && matchQuery;
            });
            renderList(filteredData);
        }

        function renderList(dataToRender) {
            const list = document.getElementById('sentence-list');
            list.innerHTML = '';
            if(dataToRender.length === 0) {
                list.innerHTML = '<li style="justify-content:center; color:var(--text-muted); box-shadow:none; cursor:default;">無符合之資料</li>';
                return;
            }

            dataToRender.forEach(item => {
                const li = document.createElement('li');
                li.onclick = () => speak(item.jp);
                
                li.innerHTML = `
                    <div class="play-indicator">🔊</div>
                    <div class="text-content">
                        <span class="jp-text">${item.jp || ''}</span>
                        ${item.romaji ? `<span class="romaji-text">${item.romaji}</span>` : ''}
                        <span class="zh-text">${item.zh || ''}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // 啟動程式
        loadCSV();
    </script>
</body>
</html>
