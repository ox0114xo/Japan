<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 · 復活版</title>
    <!-- PWA 基本設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日語神器">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">
    <style>
        /* *************** */
        /* 基礎配色與重置  */
        /* *************** */
        :root {
            --bg: #0b1120;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent: #3b82f6;
            --accent-glow: #2563eb;
            --green: #10b981;
            --gold: #fbbf24;
            --red: #ef4444;
            --text: #f1f5f9;
            --sub: #94a3b8;
            --header-font: 'Segoe UI', 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1a2639, var(--bg));
            color: var(--text);
            font-family: var(--header-font);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 100px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 16px;
        }

        /* 標題 (可點擊解鎖) */
        h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 24px 0 20px;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(135deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(59,130,246,0.3);
        }

        /* *************** */
        /* 表單元素 */
        /* *************** */
        .search-box {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .search-box:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        /* 控制列 (最近/最愛/音量/龜速) */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .quick-nav {
            grid-column: span 2;
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 14px;
            font-weight: 600;
            color: var(--sub);
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }

        .toggle-panel {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            color: var(--sub);
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .toggle-panel input {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
        }

        /* 分類標籤 (橫向捲動) */
        .cat-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 8px 0 20px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .cat-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-item {
            background: rgba(30,41,59,0.6);
            border: 1px solid var(--card-border);
            color: var(--sub);
            padding: 12px 22px;
            border-radius: 50px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.15s;
        }

        .cat-item.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 卡片容器 */
        #list-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 語句卡片 */
        .card {
            background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            transition: 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-content {
            padding: 28px 20px 20px;
            text-align: center;
            cursor: pointer;
        }

        .zh {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #fff;
        }

        .ja-box {
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 30px;
            padding: 10px 20px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .ja {
            font-size: 20px;
            font-weight: 600;
            color: #a5c9ff;
        }

        .ro {
            font-size: 14px;
            color: var(--sub);
            letter-spacing: 0.5px;
        }

        /* 收藏星星 */
        .star {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 28px;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: 0.2s;
            z-index: 5;
        }

        .star.active {
            color: var(--gold);
            text-shadow: 0 0 15px #fbbf24;
        }

        /* 放大按鈕 */
        .zoom-btn {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: none;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--sub);
            font-weight: 600;
            padding: 18px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* 自訂翻譯區塊 */
        .custom-block {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .custom-textarea {
            width: 100%;
            height: 100px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            resize: none;
        }

        .trans-result {
            background: rgba(16,185,129,0.1);
            border-radius: 30px;
            padding: 20px;
            color: var(--green);
            font-weight: bold;
            font-size: 20px;
            margin: 16px 0;
            word-break: break-all;
        }

        .play-custom {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 40px;
            padding: 20px;
            color: white;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
        }

        /* 安裝浮動按鈕 (PWA) */
        #installBtn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59,130,246,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 16px 32px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 10000;
            white-space: nowrap;
            cursor: pointer;
        }

        /* 全螢幕放大 Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 20000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .modal-ja {
            font-size: 14vw;
            font-weight: 900;
            color: white;
            text-align: center;
            line-height: 1.2;
        }

        .modal-zh {
            font-size: 26px;
            color: var(--sub);
            margin-top: 30px;
            font-weight: 600;
        }

        .modal-close {
            margin-top: 60px;
            padding: 18px 50px;
            background: #1e293b;
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #334155;
        }

        /* 內嵌瀏覽器阻擋畫面 */
        #blocker {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        #blocker h2 {
            font-size: 32px;
            margin: 20px 0 10px;
        }

        #blocker p {
            color: var(--sub);
            max-width: 300px;
        }

        /* 除錯用 */
        #debug-console {
            background: #2d1a1a;
            color: #ffa5a5;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            display: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- 內嵌瀏覽器阻擋層 -->
    <div id="blocker">
        <div style="font-size:60px;">🚫</div>
        <h2>請切換瀏覽器</h2>
        <p>偵測到您正在使用 LINE / Facebook 內建瀏覽器，可能無法正常發音。</p>
        <p style="margin-top:20px;">請點擊右上角 <b>「⋯」</b> 選擇「以系統瀏覽器開啟」</p>
    </div>

    <!-- 放大 Modal -->
    <div id="modalZoom" class="modal">
        <div class="modal-ja" id="zoomJa"></div>
        <div class="modal-zh" id="zoomZh"></div>
        <button class="modal-close" onclick="document.getElementById('modalZoom').style.display='none'">關閉</button>
    </div>

    <!-- 安裝提示 (手動) -->
    <div id="modalInstall" class="modal" style="justify-content:center;">
        <div style="background: #1e293b; padding: 30px; border-radius: 40px; max-width: 320px; border:1px solid #334155;">
            <h2 style="color:var(--green); margin-top:0;">📲 安裝到桌面</h2>
            <p style="color:var(--sub);">🍎 iPhone：點擊下方「分享」>「加入主畫面」<br><br>🤖 Android：點擊右上角「⋮」>「加到主畫面」</p>
            <button class="modal-close" style="background:var(--green); border:none;" onclick="this.parentElement.parentElement.style.display='none'">我知道了</button>
        </div>
    </div>

    <!-- 主內容 -->
    <div class="container">
        <h1 id="mainTitle">🇯🇵 日本旅遊神器 · 復活版</h1>

        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋中文/日文...">

        <div class="control-grid">
            <div class="quick-nav">
                <button class="nav-btn" id="btnHistory">🕒 歷史</button>
                <button class="nav-btn" id="btnFav">⭐ 最愛</button>
            </div>
            <div class="toggle-panel">
                <span>🔊 大音量</span>
                <input type="checkbox" id="volCheck" checked>
            </div>
            <div class="toggle-panel">
                <span>🐢 龜速</span>
                <input type="checkbox" id="slowCheck">
            </div>
        </div>

        <!-- 分類標籤會用 JS 動態填入 -->
        <div class="cat-scroll" id="catContainer"></div>

        <!-- 卡片列表區 -->
        <div id="list-area">
            <div style="text-align:center; color:var(--sub); padding:40px;">⏳ 載入資料中...</div>
        </div>
    </div>

    <!-- 安裝按鈕 (PWA) -->
    <div id="installBtn">📥 安裝到手機桌面</div>

    <!-- 除錯區 (預設隱藏) -->
    <div id="debug-console"></div>

    <script>
        (function() {
            // ==================== 嚴謹模式 + 除錯輔助 ====================
            "use strict";

            // 將內部錯誤顯示到畫面上 (方便除錯)
            function debugLog(...args) {
                console.log('[神器]', ...args);
                const dbg = document.getElementById('debug-console');
                if (dbg) {
                    dbg.style.display = 'block';
                    dbg.innerText += args.join(' ') + '\n';
                }
            }

            debugLog('腳本開始執行');

            // ==================== 1. 瀏覽器環境偵測 (LINE/FB/IG) ====================
            try {
                const ua = navigator.userAgent || navigator.vendor || window.opera;
                if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Instagram') > -1) {
                    // 避免重複跳轉
                    if (location.search.indexOf('force=1') === -1) {
                        // 顯示阻擋畫面，但不自動跳轉 (讓使用者自行選擇)
                        const blocker = document.getElementById('blocker');
                        if (blocker) blocker.style.display = 'flex';
                        debugLog('偵測到內嵌瀏覽器，顯示阻擋層');
                    }
                }
            } catch (e) {
                debugLog('瀏覽器偵測錯誤', e);
            }

            // ==================== 2. 全域變數 ====================
            const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';

            // 主要資料庫 (將從試算表載入)
            let DB = [];               // 一般句子 { c, z, j, r }
            let HDN = [];              // 隱藏句子 (🔞 分類)
            let categories = ['🌟 全部']; // 分類列表 (初始化就有「全部」)

            // 最愛與歷史 (從 localStorage 讀取)
            let favorites = [];
            let history = [];
            try {
                const f = localStorage.getItem('jp_fav');
                const h = localStorage.getItem('jp_hist');
                if (f) favorites = JSON.parse(f);
                if (h) history = JSON.parse(h);
            } catch (e) {}

            // 當前狀態
            let currentCategory = '🌟 全部';
            let clickCount = 0;          // 用於解鎖隱藏模式
            const HIDDEN_CAT_NAME = '🔞 隱藏'; // 隱藏分類名稱

            // ==================== 3. 輔助函數 ====================
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // 發音 (安全)
            function speakJapanese(text, sourceItem) {
                if (!text) return;
                if (!window.speechSynthesis) {
                    alert('您的瀏覽器不支援語音');
                    return;
                }
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'ja-JP';
                    utter.rate = document.getElementById('slowCheck')?.checked ? 0.45 : 0.85;
                    utter.volume = document.getElementById('volCheck')?.checked ? 1.0 : 0.7;
                    utter.onerror = () => debugLog('語音播放失敗');
                    window.speechSynthesis.speak(utter);

                    // 加入歷史紀錄 (如果有傳入來源句子)
                    if (sourceItem) {
                        history = history.filter(item => item.j !== sourceItem.j);
                        history.unshift(sourceItem);
                        if (history.length > 30) history.pop();
                        localStorage.setItem('jp_hist', JSON.stringify(history));
                    }
                } catch (err) {
                    debugLog('speak 錯誤', err);
                }
            }

            // ==================== 4. 核心渲染 ====================
            function render(cat, query = '') {
                debugLog('開始渲染', cat, query);
                const container = document.getElementById('list-area');
                if (!container) return;

                // 處理「✏️ 自訂」分類
                if (cat === '✏️ 自訂') {
                    container.innerHTML = `
                        <div class="custom-block">
                            <textarea id="customInput" class="custom-textarea" placeholder="輸入中文..."></textarea>
                            <div id="customResult" class="trans-result">✨ 翻譯結果</div>
                            <button class="play-custom" onclick="window.translateAndSpeak()">🌍 翻譯並發音</button>
                        </div>
                    `;
                    return;
                }

                // 決定資料來源
                let sourceList = [];
                if (cat === '🌟 全部') {
                    sourceList = DB;
                } else if (cat === '⭐ 最愛') {
                    sourceList = DB.filter(item => favorites.includes(item.j));
                } else if (cat === '🕒 歷史') {
                    sourceList = history;
                } else if (cat === HIDDEN_CAT_NAME) {
                    sourceList = HDN;
                } else {
                    sourceList = DB.filter(item => item.c === cat);
                }

                // 搜尋過濾
                if (query) {
                    const q = query.toLowerCase();
                    sourceList = sourceList.filter(item =>
                        item.z.includes(q) ||
                        item.j.includes(q) ||
                        (item.r && item.r.toLowerCase().includes(q))
                    );
                }

                // 簡單去重 (以日文為準)
                const seen = new Set();
                const uniqueList = [];
                for (let item of sourceList) {
                    if (!seen.has(item.j)) {
                        seen.add(item.j);
                        uniqueList.push(item);
                    }
                }

                if (uniqueList.length === 0) {
                    container.innerHTML = '<div style="color:var(--sub); text-align:center; padding:50px;">😢 沒有句子</div>';
                    return;
                }

                // 逐一建立卡片
                let html = '';
                for (let item of uniqueList) {
                    const isFav = favorites.includes(item.j);
                    const favClass = isFav ? 'active' : '';
                    const jaEsc = escapeHtml(item.j);
                    const zhEsc = escapeHtml(item.z);
                    const rEsc = escapeHtml(item.r || '');
