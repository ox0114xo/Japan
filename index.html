<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 · 穩定版</title>
    <!-- PWA 設定 (略同前，此處保留最簡) -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* 樣式基本同上，此處保留關鍵部分，為節省篇幅可複製前一個版本的完整樣式 */
        :root { --bg: #0b1120; --card-bg: #1e293b; --accent: #3b82f6; --green: #10b981; --gold: #fbbf24; --red: #ef4444; --text: #f1f5f9; --sub: #94a3b8; }
        body { background: radial-gradient(circle at 50% 0%, #1a2639, var(--bg)); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; padding: 16px; }
        h1 { font-size: 28px; text-align: center; cursor: pointer; margin: 24px 0; }
        .search-box { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid #334155; border-radius: 40px; color: white; margin-bottom: 20px; text-align: center; }
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .quick-nav { grid-column: span 2; display: flex; gap: 12px; }
        .nav-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 40px; padding: 14px; color: var(--sub); font-weight: bold; cursor: pointer; }
        .nav-btn.active { background: var(--accent); color: white; }
        .toggle-panel { background: rgba(0,0,0,0.2); border: 1px solid #334155; border-radius: 40px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--sub); }
        .cat-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 8px 0 20px; }
        .cat-item { background: rgba(30,41,59,0.6); border: 1px solid #334155; padding: 12px 22px; border-radius: 50px; color: var(--sub); font-weight: 600; white-space: nowrap; cursor: pointer; }
        .cat-item.active { background: var(--accent); color: white; border-color: var(--accent); }
        #list-area { display: flex; flex-direction: column; gap: 20px; }
        .card { background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.9)); border-radius: 32px; overflow: hidden; position: relative; }
        .card-content { padding: 28px 20px 20px; text-align: center; cursor: pointer; }
        .zh { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
        .ja-box { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.2); border-radius: 30px; padding: 10px 20px; display: inline-block; }
        .ja { font-size: 20px; color: #a5c9ff; }
        .ro { font-size: 14px; color: var(--sub); }
        .star { position: absolute; top: 16px; left: 20px; font-size: 28px; color: rgba(255,255,255,0.15); cursor: pointer; }
        .star.active { color: var(--gold); }
        .zoom-btn { width: 100%; background: rgba(0,0,0,0.3); border: none; border-top: 1px solid rgba(255,255,255,0.05); color: var(--sub); padding: 18px; cursor: pointer; }
        .error-box { background: #3b1e1e; border: 1px solid var(--red); border-radius: 20px; padding: 20px; margin: 20px 0; color: #ffb3b3; text-align: center; }
        .retry-btn { background: var(--accent); border: none; color: white; padding: 12px 30px; border-radius: 40px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #installBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(59,130,246,0.9); padding: 16px 32px; border-radius: 60px; color: white; display: none; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 20000; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .modal-ja { font-size: 14vw; color: white; }
        .modal-zh { font-size: 26px; color: var(--sub); margin-top: 30px; }
        .modal-close { margin-top: 60px; padding: 18px 50px; background: #1e293b; border-radius: 50px; color: white; cursor: pointer; }
        #blocker { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 999999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>

    <!-- 內嵌瀏覽器阻擋層 (與前同) -->
    <div id="blocker"><h2>請切換瀏覽器</h2><p>偵測到 LINE/Facebook 內建瀏覽器，可能無法發音。</p></div>

    <!-- 放大 Modal -->
    <div id="modalZoom" class="modal"><div class="modal-ja" id="zoomJa"></div><div class="modal-zh" id="zoomZh"></div><button class="modal-close" onclick="this.parentElement.style.display='none'">關閉</button></div>

    <!-- 主內容 -->
    <div class="container">
        <h1 id="mainTitle">🇯🇵 日本旅遊神器 · 穩定版</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋中文/日文...">

        <div class="control-grid">
            <div class="quick-nav">
                <button class="nav-btn" id="btnHistory">🕒 歷史</button>
                <button class="nav-btn" id="btnFav">⭐ 最愛</button>
            </div>
            <div class="toggle-panel"><span>🔊 大音量</span><input type="checkbox" id="volCheck" checked></div>
            <div class="toggle-panel"><span>🐢 龜速</span><input type="checkbox" id="slowCheck"></div>
        </div>

        <div class="cat-scroll" id="catContainer"></div>

        <!-- 列表區域，一開始顯示載入中，若錯誤會顯示錯誤訊息 -->
        <div id="list-area">
            <div style="text-align:center; color:var(--sub); padding:40px;">⏳ 載入資料中...</div>
        </div>

        <!-- 這裡會動態插入錯誤訊息 -->
        <div id="errorContainer"></div>
    </div>

    <div id="installBtn">📥 安裝到手機桌面</div>

    <script>
        (function() {
            "use strict";

            // 基本配置
            const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
            const HIDDEN_CAT = '🔞 隱藏';

            // 狀態變數
            let DB = [];               // 一般句子
            let HDN = [];               // 隱藏句子
            let categories = ['🌟 全部'];
            let favorites = [];
            let history = [];
            let currentCategory = '🌟 全部';
            let clickCount = 0;

            // 從 localStorage 讀取收藏與歷史
            try {
                favorites = JSON.parse(localStorage.getItem('jp_fav')) || [];
                history = JSON.parse(localStorage.getItem('jp_hist')) || [];
            } catch (e) {}

            // ---------- 內建備用資料 (當試算表載入失敗時使用) ----------
            const FALLBACK_DATA = [
                { c: '👋 招呼', z: '你好', j: 'こんにちは', r: 'Konnichiwa' },
                { c: '👋 招呼', z: '謝謝', j: 'ありがとう', r: 'Arigatou' },
                { c: '🍜 用餐', z: '兩位', j: '二人です', r: 'Futari desu' },
                { c: '🍜 用餐', z: '乾杯', j: '乾杯', r: 'Kanpai' },
                { c: '🛍️ 購物', z: '多少錢', j: 'いくらですか', r: 'Ikura desu ka' },
                { c: '🚇 交通', z: '廁所在哪', j: 'トイレはどこですか', r: 'Toire wa doko' }
            ];

            // ---------- 輔助函數 ----------
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe.replace(/[&<>"']/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return '&#039;';
                });
            }

            function speakJapanese(text, item) {
                if (!text || !window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'ja-JP';
                    utter.rate = document.getElementById('slowCheck')?.checked ? 0.45 : 0.85;
                    utter.volume = document.getElementById('volCheck')?.checked ? 1.0 : 0.7;
                    window.speechSynthesis.speak(utter);
                    if (item) {
                        history = history.filter(h => h.j !== item.j);
                        history.unshift(item);
                        if (history.length > 30) history.pop();
                        localStorage.setItem('jp_hist', JSON.stringify(history));
                    }
                } catch (err) {}
            }

            // 渲染卡片列表
            function render(cat, query = '') {
                const container = document.getElementById('list-area');
                if (!container) return;

                // 自訂分類
                if (cat === '✏️ 自訂') {
                    container.innerHTML = `
                        <div style="background:rgba(0,0,0,0.3); padding:25px; border-radius:40px;">
                            <textarea id="customInput" style="width:100%; height:100px; background:#1e293b; color:white; border:1px solid #334155; border-radius:20px; padding:15px; margin-bottom:15px;" placeholder="輸入中文..."></textarea>
                            <div id="customResult" style="background:rgba(16,185,129,0.1); border-radius:30px; padding:20px; color:#10b981; margin:15px 0;">✨ 翻譯結果</div>
                            <button class="retry-btn" style="width:100%;" onclick="window.translateAndSpeak()">🌍 翻譯並發音</button>
                        </div>
                    `;
                    return;
                }

                // 收集資料
                let list = [];
                if (cat === '🌟 全部') list = DB;
                else if (cat === '⭐ 最愛') list = DB.filter(item => favorites.includes(item.j));
                else if (cat === '🕒 歷史') list = history;
                else if (cat === HIDDEN_CAT) list = HDN;
                else list = DB.filter(item => item.c === cat);

                // 搜尋過濾
                if (query) {
                    const q = query.toLowerCase();
                    list = list.filter(item => item.z.includes(q) || item.j.includes(q) || (item.r && item.r.toLowerCase().includes(q)));
                }

                // 去重
                const seen = new Set();
                const unique = [];
                for (let item of list) {
                    if (!seen.has(item.j)) { seen.add(item.j); unique.push(item); }
                }

                if (unique.length === 0) {
                    container.innerHTML = '<div style="color:var(--sub); padding:50px; text-align:center;">😢 沒有句子</div>';
                    return;
                }

                let html = '';
                for (let item of unique) {
                    const isFav = favorites.includes(item.j);
                    html += `
                        <div class="card" data-ja="${escapeHtml(item.j)}" data-zh="${escapeHtml(item.z)}" data-ro="${escapeHtml(item.r || '')}">
                            <div class="star ${isFav ? 'active' : ''}" data-action="fav">★</div>
                            <div class="card-content" data-action="speak">
                                <div class="zh">${escapeHtml(item.z)}</div>
                                <div class="ja-box"><span class="ja">🔊 ${escapeHtml(item.j)}</span></div>
                                <div class="ro">${escapeHtml(item.r || '')}</div>
                            </div>
                            <button class="zoom-btn" data-action="zoom">🪧 放大顯示</button>
                        </div>
                    `;
                }
                container.innerHTML = html;

                // 綁定事件
                document.querySelectorAll('.card').forEach(card => {
                    const ja = card.dataset.ja;
                    const zh = card.dataset.zh;
                    const ro = card.dataset.ro;
                    const item = { j: ja, z: zh, r: ro };

                    card.querySelector('[data-action="speak"]').addEventListener('click', (e) => {
                        e.stopPropagation();
                        speakJapanese(ja, item);
                    });
                    card.querySelector('[data-action="fav"]').addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = favorites.indexOf(ja);
                        if (idx > -1) favorites.splice(idx, 1);
                        else favorites.push(ja);
                        localStorage.setItem('jp_fav', JSON.stringify(favorites));
                        render(currentCategory, document.getElementById('searchInput').value);
                    });
                    card.querySelector('[data-action="zoom"]').addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.getElementById('zoomJa').innerText = ja;
                        document.getElementById('zoomZh').innerText = zh;
                        document.getElementById('modalZoom').style.display = 'flex';
                    });
                });
            }

            // 建立分類按鈕
            function buildCategoryButtons() {
                const catContainer = document.getElementById('catContainer');
                if (!catContainer) return;
                catContainer.innerHTML = '';
                categories.forEach(cat => {
                    const btn = document.createElement('span');
                    btn.className = 'cat-item' + (cat === currentCategory ? ' active' : '');
                    btn.innerText = cat;
                    btn.onclick = () => {
                        document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById('btnHistory').classList.remove('active');
                        document.getElementById('btnFav').classList.remove('active');
                        currentCategory = cat;
                        render(currentCategory, document.getElementById('searchInput').value);
                    };
                    catContainer.appendChild(btn);
                });
            }

            // 載入試算表 (含逾時與錯誤處理)
            async function loadSheetData() {
                const listArea = document.getElementById('list-area');
                const errorContainer = document.getElementById('errorContainer');
                // 建立 AbortController 實現逾時
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 秒逾時

                try {
                    const response = await fetch(SHEET_URL, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const csv = await response.text();
                    const lines = csv.split('\n');

                    // 解析 CSV (簡單版)
                    DB = [];
                    HDN = [];
                    const catSet = new Set();

                    for (let i = 1; i < lines.length; i++) { // 跳過標題列
                        let line = lines[i].replace(/\r$/, '').trim();
                        if (!line) continue;
                        const cols = line.split(',');
                        if (cols.length < 3) continue;
                        const c = cols[0]?.trim();
                        const z = cols[1]?.trim();
                        const j = cols[2]?.trim();
                        const r = cols[3]?.trim() || '';
                        if (!c || !z || !j) continue;
                        const item = { c, z, j, r };
                        if (c === HIDDEN_CAT) {
                            HDN.push(item);
                        } else {
                            DB.push(item);
                            catSet.add(c);
                        }
                    }

                    categories = ['🌟 全部', ...Array.from(catSet), '✏️ 自訂'];
                    buildCategoryButtons();
                    currentCategory = '🌟 全部';
                    render(currentCategory, '');

                    // 清除錯誤訊息 (如果有)
                    errorContainer.innerHTML = '';
                } catch (err) {
                    clearTimeout(timeoutId);
                    console.error('載入試算表失敗', err);
                    // 顯示錯誤並提供使用備用資料的選項
                    errorContainer.innerHTML = `
                        <div class="error-box">
                            <div>❌ 無法從 Google 試算表載入資料</div>
                            <div style="font-size:13px; margin:10px 0;">${err.message || '未知錯誤'}</div>
                            <button class="retry-btn" id="useFallbackBtn">使用本機備用資料</button>
                            <button class="retry-btn" style="background:#475569;" id="retryBtn">重試</button>
                        </div>
                    `;
                    document.getElementById('useFallbackBtn')?.addEventListener('click', () => {
                        useFallbackData();
                        errorContainer.innerHTML = ''; // 清除錯誤框
                    });
                    document.getElementById('retryBtn')?.addEventListener('click', () => {
                        errorContainer.innerHTML = '';
                        loadSheetData();
                    });
                }
            }

            // 使用內建備用資料
            function useFallbackData() {
                DB = [];
                HDN = [];
                const catSet = new Set();
                FALLBACK_DATA.forEach(item => {
                    DB.push(item);
                    catSet.add(item.c);
                });
                categories = ['🌟 全部', ...Array.from(catSet), '✏️ 自訂'];
                buildCategoryButtons();
                currentCategory = '🌟 全部';
                render(currentCategory, '');
            }

            // ---------- 事件綁定 ----------
            document.getElementById('mainTitle').addEventListener('click', () => {
                clickCount++;
                if (clickCount === 10) {
                    if (!categories.includes(HIDDEN_CAT) && HDN.length > 0) {
                        const idx = categories.indexOf('✏️ 自訂');
                        categories.splice(idx, 0, HIDDEN_CAT);
                        buildCategoryButtons();
                        currentCategory = HIDDEN_CAT;
                        document.querySelectorAll('.cat-item').forEach(b => {
                            if (b.innerText === HIDDEN_CAT) b.classList.add('active');
                            else b.classList.remove('active');
                        });
                        document.getElementById('btnHistory').classList.remove('active');
                        document.getElementById('btnFav').classList.remove('active');
                        render(currentCategory, '');
                        alert('😈 隱藏模式解鎖！');
                    } else if (HDN.length === 0) {
                        alert('試算表中沒有「🔞 隱藏」分類');
                    }
                    clickCount = 0;
                }
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                render(currentCategory, e.target.value);
            });

            document.getElementById('btnHistory').addEventListener('click', function() {
                document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
                document.getElementById('btnFav').classList.remove('active');
                this.classList.add('active');
                currentCategory = '🕒 歷史';
                render(currentCategory, document.getElementById('searchInput').value);
            });

            document.getElementById('btnFav').addEventListener('click', function() {
                document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('a
