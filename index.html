<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Ultra</title>
    <style>
        /* 🎨 色彩與背景 */
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --success: #10b981;
        }

        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            background-attachment: fixed; color: #fff; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: sans-serif; padding-bottom: 50px;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        h1 { font-size: 24px; margin: 20px 0; }

        /* 搜尋與控制 */
        .search-box { 
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); 
            background: var(--glass); color: #fff; margin-bottom: 10px; font-size: 16px; box-sizing: border-box;
        }
        .controls { 
            background: var(--glass); padding: 15px; border-radius: 15px; 
            display: flex; justify-content: space-around; margin-bottom: 20px;
        }
        .toggle-group { display: flex; align-items: center; gap: 5px; font-size: 14px; }

        /* 分類按鈕 */
        .category-container { 
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 15px; margin-bottom: 10px;
            scrollbar-width: none; width: 100%;
        }
        .tab-btn { 
            background: var(--glass); color: #ccc; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: var(--primary); color: #fff; }

        /* 卡片設計 - 完美置中 */
        .grid-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .phrase-card { 
            background: var(--glass); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .zh-text { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .ja-text { font-size: 18px; color: #93c5fd; margin-bottom: 5px; }
        .romaji-text { font-size: 14px; color: #94a3b8; font-style: italic; margin-bottom: 15px; }

        .fav-star { position: absolute; top: 15px; left: 15px; font-size: 24px; color: rgba(255,255,255,0.2); }
        .fav-star.active { color: #fbbf24; }

        .action-area { display: flex; gap: 10px; width: 100%; }
        .action-btn { 
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: #fff; font-weight: bold; cursor: pointer;
        }

        /* 自訂翻譯 */
        .custom-area { background: var(--glass); padding: 20px; border-radius: 20px; width: 100%; box-sizing: border-box; }
        .custom-textarea { width: 100%; height: 80px; background: rgba(0,0,0,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .translated-box { background: rgba(16,185,129,0.1); padding: 15px; border-radius: 10px; color: #6ee7b7; font-weight: bold; margin-bottom: 10px; min-height: 40px; }
        .custom-play-btn { width: 100%; padding: 15px; background: var(--success); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }

        /* Modal & Toast */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .modal-ja { font-size: 40px; font-weight: bold; color: #fff; text-align: center; }
        .close-modal { margin-top: 30px; padding: 10px 30px; background: #333; color: #fff; border-radius: 20px; border: none; }
        .toast { position: fixed; bottom: 20px; background: var(--success); color: #fff; padding: 10px 20px; border-radius: 20px; display: none; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1>🇯🇵 日本旅遊神器 Ultra</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋你想說的話...">
        
        <div class="controls">
            <div class="toggle-group">男聲 <input type="checkbox" id="voiceGenderToggle"></div>
            <div class="toggle-group">大音量 <input type="checkbox" id="volumeToggle"></div>
            <div class="toggle-group">🐢 龜速 <input type="checkbox" id="turtleToggle"></div>
        </div>

        <div class="category-container" id="category-container"></div>
        <div class="grid-container" id="button-container"></div>
    </div>

    <div id="fullScreenModal" class="modal">
        <div class="modal-ja" id="modalJaText"></div>
        <button class="close-modal" onclick="document.getElementById('fullScreenModal').style.display='none'">關閉</button>
    </div>

    <div id="toast" class="toast">✅ 已複製！</div>

    <script>
        // 🚀 核心資料 (精簡版)
        var phrasesData = {
            "👋 招呼": [
                { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" },
                { zh: "謝謝", ja: "ありがとうございます", romaji: "Arigatou" },
                { zh: "請問/不好意思", ja: "すみません", romaji: "Sumimasen" }
            ],
            "🍜 餐廳": [
                { zh: "請給我菜單", ja: "メニューをお願いします", romaji: "Menyuu" },
                { zh: "我要結帳", ja: "お会計をお願いします", romaji: "Okaikei" },
                { zh: "很好吃", ja: "美味しいです", romaji: "Oishii" }
            ],
            "🛍️ 購物": [
                { zh: "多少錢？", ja: "いくらですか", romaji: "Ikura desu ka" },
                { zh: "我要買這個", ja: "これをください", romaji: "Kore o kudasai" },
                { zh: "可以刷卡嗎？", ja: "カードは使えますか", romaji: "Kaado" }
            ]
        };

        var currentCategory = '🌟 全部';
        var favorites = [];
        try { favorites = JSON.parse(localStorage.getItem('jp_favs')) || []; } catch(e) {}

        // 發音
        function speak(text) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = document.getElementById('turtleToggle').checked ? 0.5 : 0.9;
            u.volume = document.getElementById('volumeToggle').checked ? 1.0 : 0.7;
            window.speechSynthesis.speak(u);
        }

        // 渲染卡片
        function render(cat, query) {
            var container = document.getElementById('button-container');
            container.innerHTML = '';
            
            if (cat === '✏️ 自訂') {
                container.innerHTML = '<div class="custom-area"><textarea id="customInput" class="custom-textarea" placeholder="輸入中文..."></textarea><div id="translatedResult" class="translated-box">結果</div><button class="custom-play-btn" onclick="doTranslate()">翻譯並發音</button></div>';
                return;
            }

            var list = [];
            for (var k in phrasesData) {
                if (cat === '🌟 全部' || cat === k) {
                    list = list.concat(phrasesData[k]);
                }
            }

            if (query) {
                list = list.filter(function(i) { return i.zh.indexOf(query) > -1 || i.ja.indexOf(query) > -1; });
            }

            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                var isFav = favorites.indexOf(item.ja) > -1;
                var div = document.createElement('div');
                div.className = 'phrase-card';
                div.innerHTML = '<div class="fav-star '+(isFav?'active':'')+'">★</div>' +
                    '<div class="zh-text">'+item.zh+'</div>' +
                    '<div class="ja-text">🔊 '+item.ja+'</div>' +
                    '<div class="romaji-text">'+item.romaji+'</div>' +
                    '<div class="action-area"><button class="action-btn" onclick="copy(\''+item.ja+'\')">複製</button><button class="action-btn" onclick="zoom(\''+item.ja+'\')">放大</button></div>';
                
                (function(txt){
                    div.onclick = function(e) {
                        if (e.target.tagName !== 'BUTTON') speak(txt);
                    };
                })(item.ja);
                
                container.appendChild(div);
            }
        }

        function copy(t) {
            navigator.clipboard.writeText(t);
            var ts = document.getElementById('toast');
            ts.style.display = 'block';
            setTimeout(function(){ ts.style.display='none'; }, 2000);
        }

        function zoom(t) {
            document.getElementById('modalJaText').innerText = t;
            document.getElementById('fullScreenModal').style.display = 'flex';
        }

        async function doTranslate() {
            var q = document.getElementById('customInput').value;
            var rb = document.getElementById('translatedResult');
            rb.innerText = '翻譯中...';
            try {
                var res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=zh-TW|ja');
                var d = await res.json();
                var ja = d.responseData.translatedText;
                rb.innerText = ja;
                speak(ja);
            } catch(e) { rb.innerText = '錯誤'; }
        }

        // 初始化
        window.onload = function() {
            var cc = document.getElementById('category-container');
            var cats = ['🌟 全部', '👋 招呼', '🍜 餐廳', '🛍️ 購物', '✏️ 自訂'];
            
            cats.forEach(function(c) {
                var b = document.createElement('button');
                b.className = 'tab-btn' + (c === '🌟 全部' ? ' active' : '');
                b.innerText = c;
                b.onclick = function() {
                    document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                    b.classList.add('active');
                    currentCategory = c;
                    render(c, '');
                };
                cc.appendChild(b);
            });

            document.getElementById('searchInput').oninput = function(e) {
                render(currentCategory, e.target.value);
            };

            render('🌟 全部', '');
        };
    </script>
</body>
</html>
