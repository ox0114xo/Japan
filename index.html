<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Ultra 終極核彈版</title>
    
    <script>
        try {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if ((ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1)) {
                if (location.search.indexOf("openExternalBrowser=1") === -1) {
                    location.href = location.href + (location.search ? "&" : "?") + "openExternalBrowser=1";
                }
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('inAppBlocker').style.display = 'flex';
                });
            }
        } catch(e) {}
    </script>

    <style>
        /* 最精簡的 CSS，減少瀏覽器負擔 */
        :root { --bg: #070b14; --blue: #3b82f6; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); --txt: #fff; --sub: #94a3b8; --green: #10b981; --gold: #fbbf24; --red: #ef4444; }
        html, body { background-color: #070b14; height: 100%; color: var(--txt); margin: 0; font-family: sans-serif; text-align: center; }
        body { background-image: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); background-attachment: fixed; padding-bottom: 100px; overflow-x: hidden; }
        
        .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        #title { font-size: 26px; margin: 20px 0; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(59,130,246,0.5); cursor: pointer; }
        
        .grid-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 15px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .nav-help { color: var(--gold); border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 12px; display: flex; justify-content: center; align-items: center; font-size: 13px; color: var(--sub); font-weight: bold; gap: 5px; }
        
        .list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; text-align: center; }
        .card-in { padding: 25px 15px 15px; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(59,130,246,0.2); margin-bottom: 6px; display: inline-block; }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; cursor: pointer; }
        .ro { font-size: 13px; color: var(--sub); font-style: italic; margin-bottom: 5px; }
        .bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .m-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; }
        .m-zh { font-size: 22px; color: var(--sub); margin-top: 30px; }
        .m-close { margin-top: 40px; padding: 15px 50px; background: #1e293b; color: #fff; border-radius: 30px; font-size: 18px; font-weight: bold; border: 1px solid var(--border); cursor: pointer; }

        #inAppBlocker { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="inAppBlocker">
        <h1 style="color:var(--red);font-size:60px;margin:0;">⚠️</h1>
        <h2>請使用 Chrome 開啟</h2>
        <p style="color:var(--sub);">為確保發音功能正常，請點擊右上角選擇預設瀏覽器開啟。</p>
    </div>

    <div id="ttsGuide" class="modal">
        <div style="background:#1e293b; padding:25px; border-radius:20px; border:1px solid var(--border); max-width:90%;">
            <h2 style="color:var(--red); margin-top:0;">🔇 發音失敗</h2>
            <p style="color:var(--sub); font-size:14px; text-align:left;">
                1. 檢查手機是否開啟靜音模式<br><br>
                2. 確認瀏覽器已允許「聲音權限」<br><br>
                3. 前往手機設定下載「日文語音包」
            </p>
            <button onclick="document.getElementById('ttsGuide').style.display='none'" style="width:100%; padding:15px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:bold; margin-top:10px;">關閉提示</button>
        </div>
    </div>

    <div class="wrap">
        <h1 id="title">🇯🇵 Japan Travel Ultra</h1>
        
        <div class="grid-ctrl">
            <button class="nav-btn nav-help" onclick="document.getElementById('ttsGuide').style.display='flex'">🚑 沒聲音?</button>
            <div class="panel"><label>龜速 <input type="checkbox" id="spd"></label></div>
        </div>

        <div class="list" id="list">
            <p id="loadingMsg" style="color:var(--gold); font-size:18px; font-weight:bold;">⏳ 正在暴力載入中...</p>
        </div>
    </div>

    <div id="mod" class="modal">
        <div class="m-ja" id="m-ja"></div>
        <div class="m-zh" id="m-zh"></div>
        <button class="m-close" onclick="document.getElementById('mod').style.display='none'">✖ 關閉</button>
    </div>

    <script>
        // 將 300 句壓縮成最簡單的一維陣列
        var data = [
            {z:"你好",j:"こんにちは",r:"Konnichiwa"},{z:"謝謝",j:"ありがとうございます",r:"Arigatou"},{z:"不好意思",j:"すみません",r:"Sumimasen"},{z:"沒關係",j:"大丈夫です",r:"Daijoubu"},{z:"拜託了",j:"お願いします",r:"Onegaishimasu"},{z:"對不起",j:"ごめんなさい",r:"Gomennasai"},{z:"早安",j:"おはようございます",r:"Ohayou"},{z:"晚安",j:"こんばんは",r:"Konbanwa"},{z:"不懂日文",j:"日本語がわかりません",r:"Nihongo ga wakarimasen"},{z:"再說一次",j:"もう一度言ってください",r:"Mou ichido"},{z:"好的",j:"はい",r:"Hai"},{z:"不是",j:"いいえ",r:"Iie"},{z:"慢一點",j:"ゆっくり話してください",r:"Yukkuri"},
            {z:"辦理入住",j:"チェックインをお願いします",r:"Chekku-in"},{z:"我有預約",j:"予約しています",r:"Yoyaku"},{z:"寄放行李",j:"荷物を預かってもらえますか",r:"Nimotsu"},{z:"Wi-Fi密碼",j:"Wi-Fiのパスワードは何ですか",r:"Pasuwaado"},{z:"退房",j:"チェックアウトをお願いします",r:"Chekku-auto"},{z:"沒熱水",j:"お湯が出ません",r:"Oyu ga"},{z:"叫計程車",j:"タクシーを呼んでください",r:"Takushii"},
            {z:"兩位",j:"2人です",r:"Futari"},{z:"菜單",j:"メニューはありますか",r:"Menyuu"},{z:"推薦什麼",j:"おすすめは何ですか",r:"Osusume"},{z:"點這個",j:"これを注文します",r:"Kore o"},{z:"給我水",j:"お水をください",r:"Omizu"},{z:"結帳",j:"お会計をお願いします",r:"Okaikei"},{z:"分開付",j:"別々に払えますか",r:"Betsubetsu"},{z:"外帶",j:"持ち帰りで",r:"Mochikaeri"},
            {z:"多少錢",j:"いくらですか",r:"Ikura"},{z:"買這個",j:"これをください",r:"Kore o"},{z:"免稅嗎",j:"免税できますか",r:"Menzei"},{z:"試穿",j:"試着してもいいですか",r:"Shichaku"},{z:"袋子",j:"袋をください",r:"Fukuro"},{z:"刷卡",j:"カードは使えますか",r:"Kaado"},
            {z:"廁所在哪",j:"トイレはどこですか",r:"Toire"},{z:"車站",j:"駅はどこですか",r:"Eki"},{z:"去新宿",j:"新宿に行きますか",r:"Shinjuku"},{z:"下車",j:"ここで降ります",r:"Koko de orimasu"},{z:"出口",j:"出口はどこですか",r:"Deguchi"},
            {z:"加熱",j:"温めてください",r:"Atatamete"},{z:"筷子",j:"お箸をください",r:"Ohashi"},{z:"免袋子",j:"袋はいりません",r:"Fukuro iranai"},{z:"收據",j:"レシートをください",r:"Reshiito"},{z:"儲值",j:"チャージをお願いします",r:"Chaaji"},
            {z:"救命",j:"助けてください",r:"Tasukete"},{z:"救護車",j:"救急車を呼んでください",r:"Kyuukyuusha"},{z:"警察",j:"警察を呼んでください",r:"Keisatsu"}
        ];

        // 獨立全域發音函數
        function playVoice(txt) {
            try {
                if (!window.speechSynthesis) {
                    document.getElementById('ttsGuide').style.display = 'flex';
                    return;
                }
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(txt);
                u.lang = 'ja-JP';
                var spd = document.getElementById('spd');
                u.rate = (spd && spd.checked) ? 0.45 : 0.85;
                u.onerror = function() { document.getElementById('ttsGuide').style.display = 'flex'; };
                window.speechSynthesis.speak(u);
            } catch(e) {
                document.getElementById('ttsGuide').style.display = 'flex';
            }
        }

        // 獨立全域放大函數
        function showZoom(ja, zh) {
            var mJa = document.getElementById('m-ja');
            var mZh = document.getElementById('m-zh');
            var mod = document.getElementById('mod');
            if(mJa) mJa.innerText = ja;
            if(mZh) mZh.innerText = zh;
            if(mod) mod.style.display = 'flex';
        }

        // 暴力渲染
        try {
            var listHtml = "";
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                // 將參數直接寫入 onclick 字串，避免任何閉包或作用域問題
                listHtml += '<div class="card">' +
                                '<div class="card-in" onclick="playVoice(\'' + item.j + '\')">' +
                                    '<div class="zh">' + item.z + '</div>' +
                                    '<div class="ja-box"><span class="ja">🔊 ' + item.j + '</span></div>' +
                                    '<div class="ro">' + item.r + '</div>' +
                                '</div>' +
                                '<button class="bar-btn" onclick="showZoom(\'' + item.j + '\', \'' + item.z + '\')">🪧 放大顯示</button>' +
                            '</div>';
            }
            
            var box = document.getElementById('list');
            if(box) box.innerHTML = listHtml;

        } catch(error) {
            // 如果這還能錯，那真的見鬼了
            var errBox = document.getElementById('list');
            if(errBox) errBox.innerHTML = '<h2 style="color:red;">錯誤: ' + error.message + '</h2>';
        }
    </script>
</body>
</html>
