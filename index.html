<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 (極簡測試版)</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .category-row {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .category-row::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 30px;
            white-space: nowrap;
            color: #94a3b8;
            border: 1px solid #334155;
            cursor: pointer;
            font-weight: bold;
        }
        .cat-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            margin-bottom: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            position: relative;
        }
        .zh {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .ja {
            font-size: 18px;
            color: #93c5fd;
        }
        .romaji {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
        .fav-star {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
        }
        .fav-star.active {
            color: #fbbf24;
        }
        .debug-box {
            margin-top: 20px;
            padding: 10px;
            background: #330000;
            color: #ff8888;
            white-space: pre-wrap;
            border-radius: 8px;
            display: none;
        }
        .placeholder {
            color: #94a3b8;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇯🇵 日本旅遊神器 (極簡版)</h1>
        <input type="text" id="search" class="search-box" placeholder="🔍 搜尋...">
        <div class="category-row" id="catRow"></div>
        <div id="cardContainer"></div>
        <div id="debug" class="debug-box"></div>
    </div>

    <script>
        (function() {
            // 除錯輸出
            function log(msg) {
                console.log('[神器]', msg);
                const debugDiv = document.getElementById('debug');
                if (debugDiv) {
                    debugDiv.style.display = 'block';
                    debugDiv.innerText += msg + '\n';
                }
            }

            log('腳本開始執行');

            // ----- 硬編碼資料 (保證有內容) -----
            const phrases = {
                "👋 招呼": [
                    { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" },
                    { zh: "謝謝", ja: "ありがとう", romaji: "Arigatou" }
                ],
                "🍜 用餐": [
                    { zh: "兩位", ja: "二人です", romaji: "Futari desu" },
                    { zh: "乾杯", ja: "乾杯", romaji: "Kanpai" }
                ]
            };

            // 分類清單
            const categories = ['🌟 全部', ...Object.keys(phrases), '✏️ 自訂'];

            // 狀態
            let currentCat = '🌟 全部';
            let favorites = [];

            // 讀取收藏
            try {
                const saved = localStorage.getItem('favs_simple');
                if (saved) favorites = JSON.parse(saved);
            } catch (e) {
                log('讀取 localStorage 失敗');
            }

            // ----- 渲染卡片 -----
            function render(cat, query) {
                log('渲染: ' + cat + ', 搜尋: ' + query);
                const container = document.getElementById('cardContainer');
                if (!container) {
                    log('錯誤: 找不到 cardContainer');
                    return;
                }
                container.innerHTML = '';

                // 自訂分類簡單處理
                if (cat === '✏️ 自訂') {
                    container.innerHTML = '<div class="card" style="padding:30px;">✏️ 自訂翻譯功能 (簡化版暫不實作)</div>';
                    return;
                }

                // 收集句子
                let list = [];
                if (cat === '🌟 全部') {
                    for (let key in phrases) {
                        list = list.concat(phrases[key]);
                    }
                } else if (cat === '⭐ 最愛') {
                    for (let key in phrases) {
                        phrases[key].forEach(item => {
                            if (favorites.includes(item.ja)) list.push(item);
                        });
                    }
                } else {
                    list = phrases[cat] || [];
                }

                // 搜尋過濾
                if (query) {
                    const q = query.toLowerCase();
                    list = list.filter(item =>
                        item.zh.includes(q) ||
                        item.ja.includes(q) ||
                        (item.romaji && item.romaji.toLowerCase().includes(q))
                    );
                }

                // 去重 (以日文為準)
                const seen = new Set();
                const unique = [];
                list.forEach(item => {
                    if (!seen.has(item.ja)) {
                        seen.add(item.ja);
                        unique.push(item);
                    }
                });

                if (unique.length === 0) {
                    container.innerHTML = '<div class="placeholder">😢 沒有符合的句子</div>';
                    return;
                }

                // 逐一建立卡片
                unique.forEach(item => {
                    const isFav = favorites.includes(item.ja);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="fav-star ${isFav ? 'active' : ''}">★</div>
                        <div class="zh">${escapeHtml(item.zh)}</div>
                        <div class="ja">🔊 ${escapeHtml(item.ja)}</div>
                        <div class="romaji">${escapeHtml(item.romaji || '')}</div>
                    `;

                    // 卡片點擊 -> 發音
                    card.addEventListener('click', (e) => {
                        if (e.target.classList.contains('fav-star')) return; // 交給星星處理
                        log('發音: ' + item.ja);
                        if (window.speechSynthesis) {
                            const utter = new SpeechSynthesisUtterance(item.ja);
                            utter.lang = 'ja-JP';
                            window.speechSynthesis.cancel();
                            window.speechSynthesis.speak(utter);
                        } else {
                            alert('不支援語音');
                        }
                    });

                    // 星星收藏
                    const star = card.querySelector('.fav-star');
                    star.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = favorites.indexOf(item.ja);
                        if (idx > -1) {
                            favorites.splice(idx, 1);
                        } else {
                            favorites.push(item.ja);
                        }
                        localStorage.setItem('favs_simple', JSON.stringify(favorites));
                        log('收藏更新，重新渲染');
                        render(currentCat, document.getElementById('search').value);
                    });

                    container.appendChild(card);
                });
            }

            // 簡單跳脫函數
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // ----- 建立分類按鈕 -----
            function buildCategoryButtons() {
                log('建立分類按鈕');
                const row = document.getElementById('catRow');
                if (!row) {
                    log('錯誤: 找不到 catRow');
                    return;
                }
                row.innerHTML = '';

                categories.forEach(cat => {
                    const btn = document.createElement('span');
                    btn.className = 'cat-btn' + (cat === currentCat ? ' active' : '');
                    btn.innerText = cat;
                    btn.onclick = () => {
                        // 切換 active 樣式
                        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentCat = cat;
                        render(currentCat, document.getElementById('search').value);
                    };
                    row.appendChild(btn);
                });
            }

            // ----- 搜尋框事件 -----
            const searchInput = document.getElementById('search');
            if (searchInput) {
                searchInput.oninput = (e) => {
                    render(currentCat, e.target.value);
                };
            } else {
                log('錯誤: 找不到搜尋框');
            }

            // ----- 頁面載入後初始化 -----
            window.onload = function() {
                log('window.onload 觸發');
                buildCategoryButtons();
                render(currentCat, '');
                log('初始化完成，按鈕應已出現');
            };
        })();
    </script>
</body>
</html>
