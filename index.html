<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 終極重構</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日語神器">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">
    <link rel="manifest" href='data:application/json;charset=utf-8,{"name":"日本旅遊神器","short_name":"日語神器","start_url":".","display":"standalone","background_color":"#070b14","theme_color":"#070b14","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/197/197604.png","sizes":"512x512","type":"image/png"}]}'>

    <script>
        window.onerror = function(msg, url, line) {
            var box = document.getElementById('list-box');
            if(box) box.innerHTML = '<div style="color:red; padding:20px; background:#450a0a; border-radius:10px; margin-top:20px;"><b>系統崩潰報告:</b><br>' + msg + '<br>行數: ' + line + '</div>';
            return false;
        };
    </script>

    <script>
        try {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1) {
                if (location.search.indexOf("openBrowser=1") === -1) {
                    location.href = location.href + (location.search ? "&" : "?") + "openBrowser=1";
                }
                window.onload = function() { document.getElementById('blocker').style.display = 'flex'; };
            }
        } catch(e) {}
    </script>

    <style>
        :root { --bg: #070b14; --blue: #3b82f6; --card: #1e293b; --border: #334155; --txt: #f8fafc; --sub: #94a3b8; --green: #10b981; --gold: #fbbf24; --red: #ef4444; }
        html, body { background-color: var(--bg); color: var(--txt); margin: 0; font-family: sans-serif; text-align: center; min-height: 100vh; }
        body { background-image: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); background-attachment: fixed; padding-bottom: 100px; }
        
        .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .title { font-size: 26px; margin: 15px 0; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(59,130,246,0.5); cursor: pointer; user-select: none; }
        
        /* 安裝橫幅 */
        #install-banner { display: none; background: linear-gradient(to right, #059669, #10b981); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(16,185,129,0.3); }

        .search { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #0f172a; color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; }
        
        .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn.active { background: var(--blue); border-color: transparent; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .btn-help { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.5); color: var(--red); grid-column: span 2; }
        .chk-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--sub); display: flex; justify-content: center; align-items: center; gap: 5px; font-weight: bold; }
        
        .cats { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; }
        .cats::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-btn.active { background: #475569; color: #fff; border-color: #fff; }

        .list { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; border: 1px solid var(--border); text-align: center; overflow: hidden; position: relative; }
        .card-in { padding: 20px 15px 15px; cursor: pointer; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; margin-bottom: 6px; display: inline-block; border: 1px solid rgba(59,130,246,0.2); }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); font-style: italic; }
        .star { position: absolute; top: 12px; left: 12px; font-size: 26px; color: #334155; padding: 5px; cursor: pointer; }
        .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .zoom { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--border); padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .m-box { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: left; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .m-close { width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; font-size: 16px; cursor: pointer; }

        #blocker { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="blocker">
        <h1 style="color:var(--red);font-size:60px;margin:0;">⚠️</h1>
        <h2>請切換瀏覽器</h2>
        <p style="color:var(--sub);">LINE內部瀏覽器無法發音，請點擊右上角「使用預設瀏覽器開啟」。</p>
    </div>

    <div id="mod-help" class="modal">
        <div class="m-box">
            <h2 style="color:var(--red); margin-top:0; text-align:center;">🔇 發音失敗/沒聲音</h2>
            <p style="color:var(--txt); font-size:15px; line-height:1.6;">
                <b style="color:var(--gold);">1. 網站權限：</b>確認網址旁邊鎖頭的「聲音」已允許。<br><br>
                <b style="color:var(--gold);">2. 靜音模式：</b>確認手機未靜音，且「媒體音量」已調大。<br><br>
                <b style="color:var(--gold);">3. 語音包：</b>前往手機設定下載日文語音包。
            </p>
            <label style="display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:14px; margin-top:15px; cursor:pointer;">
                <input type="checkbox" id="chk-ignore" style="width:18px; height:18px; margin-right:8px;">
                ✅ 我有聲音，請不要自動彈出
            </label>
            <button class="m-close" onclick="closeHelp()">關閉提示</button>
        </div>
    </div>

    <div id="mod-install" class="modal">
        <div class="m-box" style="text-align:center;">
            <h2 style="color:var(--green); margin-top:0;">📲 安裝到桌面</h2>
            <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; text-align:left; font-size:15px;">
                🍎 <b>iPhone：</b><br>點擊下方「分享」按鈕，選擇 <b>「加入主畫面」</b>。<br><br>
                🤖 <b>Android：</b><br>點擊右上角「⋮」，選擇 <b>「加到主畫面」</b>。
            </div>
            <button class="m-close" style="background:var(--green);" onclick="document.getElementById('mod-install').style.display='none'">我知道了</button>
        </div>
    </div>

    <div id="mod-zoom" class="modal">
        <div id="z-ja" style="font-size:12vw; font-weight:900; color:#fff; text-align:center;"></div>
        <div id="z-zh" style="font-size:22px; color:var(--sub); margin-top:30px; text-align:center;"></div>
        <button class="m-close" style="background:#1e293b; border:1px solid #334155; margin-top:40px; border-radius:30px; width:200px;" onclick="document.getElementById('mod-zoom').style.display='none'">✖ 關閉</button>
    </div>

    <div class="wrap">
        <div class="title" onclick="unlock()">🇯🇵 Japan Travel 最終版</div>
        
        <div id="install-banner" onclick="doInstall()">⬇️ 點此一鍵安裝到手機桌面</div>

        <input type="text" id="search" class="search" placeholder="🔍 搜尋你想說的話...">

        <div class="grid-top">
            <button class="btn" id="btn-rec" onclick="setCat('🕒 最近')">🕒 最近</button>
            <button class="btn" id="btn-fav" onclick="setCat('⭐ 最愛')">⭐ 最愛</button>
            <div class="chk-box"><label>🔊 大音量 <input type="checkbox" id="vol" checked></label></div>
            <div class="chk-box"><label>🐢 龜速 <input type="checkbox" id="spd"></label></div>
            <button class="btn btn-help" onclick="document.getElementById('mod-help').style.display='flex'">🚑 沒聲音看這裡</button>
        </div>

        <div class="cats" id="cat-box"></div>
        <div class="list" id="list-box">
            <h3 style="color:#94a3b8;">載入中...</h3>
        </div>
    </div>

    <script>
        // 資料格式: 分類|中文|日文|羅馬拼音^分類|中文|日文|羅馬拼音
        var rawDB = "👋 常用|你好|こんにちは|Konnichiwa^👋 常用|謝謝|ありがとうございます|Arigatou gozaimasu^👋 常用|不好意思/請問|すみません|Sumimasen^👋 常用|沒關係|大丈夫です|Daijoubu desu^👋 常用|拜託您了|お願いします|Onegaishimasu^👋 常用|對不起|ごめんなさい|Gomennasai^👋 常用|早安|おはようございます|Ohayou gozaimasu^👋 常用|晚安|こんばんは|Konbanwa^👋 常用|我不懂日文|日本語がわかりません|Nihongo ga wakarimasen^👋 常用|請再說一次|もう一度言ってください|Mou ichido itte kudasai^👋 常用|好的|はい|Hai^👋 常用|不是|いいえ|Iie^👋 常用|幫大忙了|助かりました|Tasukarimashita^👋 常用|請說慢一點|ゆっくり話してください|Yukkuri hanashite kudasai^👋 常用|這是什麼|これは何ですか|Kore wa nan desu ka^👋 常用|辛苦了|お疲れ様です|Otsukaresama desu^👋 常用|再見|さようなら|Sayounara^👋 常用|初次見面|初めまして|Hajimemashite^👋 常用|請多指教|よろしくお願いします|Yoroshiku onegaishimasu^🏨 住宿|我要辦理入住|チェックインをお願いします|Chekku-in o onegaishimasu^🏨 住宿|我有預約|予約しています|Yoyaku shite imasu^🏨 住宿|能寄放行李嗎|荷物を預かってもらえますか|Nimotsu o azukatte moraemasu ka^🏨 住宿|我要退房|チェックアウトをお願いします|Chekku-auto o onegaishimasu^🏨 住宿|Wi-Fi密碼是多少|Wi-Fiのパスワードは何ですか|Wi-Fi no pasuwaado wa nan desu ka^🏨 住宿|沒有熱水|お湯が出ません|Oyu ga demasen^🏨 住宿|請幫我叫計程車|タクシーを呼んでください|Takushii o yonde kudasai^🏨 住宿|請幫我換房間|部屋を変えてください|Heya o kaete kudasai^🏨 住宿|請再給我一條毛巾|タオルをもう一枚ください|Taoru o mou ichimai kudasai^🏨 住宿|早餐是幾點|朝食は何時ですか|Choushoku wa nanji desu ka^🍜 餐廳|兩位|2人です|Futari desu^🍜 餐廳|有菜單嗎|メニューはありますか|Menyuu wa arimasu ka^🍜 餐廳|有推薦的嗎|おすすめは何ですか|Osusume wa nan desu ka^🍜 餐廳|我要點這個|これを注文します|Kore o chuumon shimasu^🍜 餐廳|請給我水|お水をください|Omizu o kudasai^🍜 餐廳|請不要加芥末|わさび抜きでお願いします|Wasabi nuki de onegaishimasu^🍜 餐廳|很好吃|美味しいです|Oishii desu^🍜 餐廳|麻煩結帳|お会計をお願いします|Okaikei o onegaishimasu^🍜 餐廳|可以分開付嗎|別々に払えますか|Betsubetsu ni haraemasu ka^🍜 餐廳|我要外帶|持ち帰りで|Mochikaeri de^🍜 餐廳|請給我禁菸席|禁煙席をお願いします|Kin-enseki o onegaishimasu^🛍️ 購物|這個多少錢|いくらですか|Ikura desu ka^🛍️ 購物|我要買這個|これをください|Kore o kudasai^🛍️ 購物|可以免稅嗎|免税できますか|Menzei dekimasu ka^🛍️ 購物|有全新的嗎|新しいものはありますか|Atarashii mono wa arimasu ka^🛍️ 購物|可以試穿嗎|試着してもいいですか|Shichaku shite mo ii desu ka^🛍️ 購物|有大一點的嗎|大きいのはありますか|Ookii no wa arimasu ka^🛍️ 購物|請給我袋子|袋をください|Fukuro o kudasai^🛍️ 購物|可以刷卡嗎|カードは使えますか|Kaado wa tsukaemasu ka^🛍️ 購物|有折扣嗎|割引はありますか|Waribiki wa arimasu ka^🚇 交通|車站在哪裡|駅はどこですか|Eki wa doko desu ka^🚇 交通|去新宿嗎|新宿に行きますか|Shinjuku ni ikimasu ka^🚇 交通|買票處在哪裡|切符売り場はどこですか|Kippu uriba wa doko desu ka^🚇 交通|我要在這裡下車|ここで降ります|Koko de orimasu^🚇 交通|下一站是哪裡|次の駅はどこですか|Tsugi no eki wa doko desu ka^🚇 交通|出口在哪裡|出口はどこですか|Deguchi wa doko desu ka^🚇 交通|這是特急列車嗎|これは特急ですか|Kore wa tokkyuu desu ka^🏪 超商|請微波加熱|温めてください|Atatamete kudasai^🏪 超商|請給我筷子|お箸をください|Ohashi o kudasai^🏪 超商|我不需要袋子|袋はいりません|Fukuro iranai desu^🏪 超商|請給我收據|レシートをください|Reshiito o kudasai^🏪 超商|我要儲值|チャージをお願いします|Chaaji o onegaishimasu^🏪 超商|能借用廁所嗎|トイレを貸してください|Toire o kashite kudasai^🍻 居酒屋|請給我生啤酒|生ビールをお願いします|Nama biiru o onegaishimasu^🍻 居酒屋|乾杯！|乾杯！|Kanpai!^🍻 居酒屋|最後點餐是幾點|ラストオーダーは何時ですか|Rasuto oodaa wa nanji desu ka^🍻 居酒屋|跟那個一樣的|同じものをください|Onaji mono o kudasai^🍻 居酒屋|有下酒菜嗎|おつまみはありますか|Otsumami wa arimasu ka^🚑 緊急|救命！|助けてください|Tasukete kudasai^🚑 緊急|請叫救護車！|救急車を呼んでください|Kyuukyuusha o yonde kudasai^🚑 緊急|請叫警察！|警察を呼んでください|Keisatsu o yonde kudasai^🚑 緊急|我迷路了|道に迷いました|Michi ni mayoimashita^🚑 緊急|護照不見了|パスポートをなくしました|Pasupooto o nakushimashita^🚑 緊急|我發燒了|熱があります|Netsu ga arimasu^🚑 緊急|藥局在哪裡|薬局はどこですか|Yakkyoku wa doko desu ka^🔞 隱藏|笨蛋|馬鹿|Baka^🔞 隱藏|白癡|阿呆|Ahou^🔞 隱藏|去死|死ね|Shine^🔞 隱藏|混蛋|馬鹿野郎|Bakayarou^🔞 隱藏|吵死了|うるさい|Urusai^🔞 隱藏|變態|変態|Hentai^🔞 隱藏|畜生|ちくしょう|Chikusho";

        // 解析資料
        var items = rawDB.split('^');
        var DB = [];
        var cats = ['🌟 全部'];
        
        for(var i=0; i<items.length; i++) {
            var parts = items[i].split('|');
            if(parts.length >= 3) {
                var c = parts[0], z = parts[1], j = parts[2], r = parts[3]||"";
                DB.push({c:c, z:z, j:j, r:r});
                var isNewCat = true;
                for(var k=0; k<cats.length; k++) { if(cats[k] === c) isNewCat = false; }
                if(isNewCat && c !== "🔞 隱藏") cats.push(c);
            }
        }

        var curCat = "🌟 全部";
        var favs = [], hist = [];
        var clk = 0, lastTxt = '', lastTime = 0, ignTTS = false;
        var deferredPrompt = null;

        // 安裝邏輯
        var isApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (!isApp) { document.getElementById('install-banner').style.display = 'block'; }

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'block';
        });

        function doInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(res) { 
                    if(res.outcome === 'accepted') document.getElementById('install-banner').style.display = 'none';
                    deferredPrompt = null; 
                });
            } else {
                document.getElementById('mod-install').style.display = 'flex';
            }
        }

        // 存取邏輯
        try {
            var f = localStorage.getItem('v6_fav'); if(f) favs = JSON.parse(f);
            var h = localStorage.getItem('v6_hist'); if(h) hist = JSON.parse(h);
            if(localStorage.getItem('v6_igntts') === 'true') ignTTS = true;
        } catch(e) {}

        function closeHelp() {
            var chk = document.getElementById('chk-ignore');
            if (chk && chk.checked) {
                ignTTS = true;
                try { localStorage.setItem('v6_igntts', 'true'); } catch(e) {}
            }
            document.getElementById('mod-help').style.display = 'none';
        }

        function spk(txt, zh, ro) {
            var now = new Date().getTime();
            if (txt === lastTxt && (now - lastTime) < 3000 && !ignTTS) {
                document.getElementById('mod-help').style.display = 'flex';
            }
            lastTxt = txt; lastTime = now;

            try {
                if (!window.speechSynthesis) { document.getElementById('mod-help').style.display = 'flex'; return; }
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(txt);
                u.lang = 'ja-JP';
                var spd = document.getElementById('spd');
                var vol = document.getElementById('vol');
                u.rate = (spd && spd.checked) ? 0.45 : 0.85;
                u.volume = (vol && vol.checked) ? 1.0 : 0.8;
                u.onerror = function() { if(!ignTTS) document.getElementById('mod-help').style.display = 'flex'; };
                window.speechSynthesis.speak(u);
            } catch(e) { if(!ignTTS) document.getElementById('mod-help').style.display = 'flex'; }

            if (zh) {
                var temp = [];
                for (var i = 0; i < hist.length; i++) { if (hist[i].j !== txt) temp.push(hist[i]); }
                temp.unshift({c:"🕒 最近", z:zh, j:txt, r:ro});
                if (temp.length > 20) temp.pop();
                hist = temp;
                try { localStorage.setItem('v6_hist', JSON.stringify(hist)); } catch(e) {}
            }
        }

        function tglFav(ja) {
            var idx = favs.indexOf(ja);
            if (idx > -1) favs.splice(idx, 1); else favs.push(ja);
            try { localStorage.setItem('v6_fav', JSON.stringify(favs)); } catch(e) {}
            draw(curCat, document.getElementById('search').value);
        }

        function z(ja, zh) {
            document.getElementById('z-ja').innerText = ja;
            document.getElementById('z-zh').innerText = zh;
            document.getElementById('mod-zoom').style.display = 'flex';
        }

        function draw(cat, q) {
            var box = document.getElementById('list-box');
            if(!box) return;
            box.innerHTML = '';

            var arr = [];
            for (var i=0; i<DB.length; i++) {
                if (cat === '🌟 全部' && DB[i].c !== '🔞 隱藏') arr.push(DB[i]);
                else if (cat === '⭐ 最愛') {
                    if (favs.indexOf(DB[i].j) > -1) arr.push(DB[i]);
                }
                else if (cat === DB[i].c) arr.push(DB[i]);
            }
            if (cat === '🕒 最近') arr = hist;

            if (q) {
                q = q.toLowerCase();
                var tmp = [];
                for (var j=0; j<arr.length; j++) {
