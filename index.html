<style>
    /* iOS 安裝引導面板 */
    #ios-install-guide {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        background: rgba(15, 23, 42, 0.95);
        border: 2px solid var(--neon-blue);
        border-radius: 16px;
        padding: 20px;
        z-index: 10002;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        color: white;
        text-align: center;
    }
    .ios-step { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; font-size: 15px; }
    .ios-icon { width: 24px; height: 24px; }
</style>

<div id="ios-install-guide">
    <div style="font-weight: bold; color: var(--neon-blue); margin-bottom: 10px;">📲 將此工具安裝至桌面</div>
    <div class="ios-step">1. 點擊瀏覽器下方的 <img src="https://img.icons8.com/ios/50/ffffff/share-rounded.png" class="ios-icon"> 「分享」按鈕</div>
    <div class="ios-step">2. 往下滑找到 <img src="https://img.icons8.com/ios/50/ffffff/plus-math.png" class="ios-icon"> 「加入主畫面」</div>
    <button onclick="document.getElementById('ios-install-guide').style.display='none'" style="margin-top:15px; background:none; border:1px solid #444; color:#888; padding:5px 15px; border-radius:20px;">暫時關閉</button>
</div>

<script>
    // 偵測是否為 iPhone 且尚未安裝
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isIos && !isStandalone) {
        // 如果是 iPhone 且不在 App 模式下，顯示教學
        setTimeout(() => {
            document.getElementById('ios-install-guide').style.display = 'block';
        }, 3000); // 延遲 3 秒顯示，比較不突兀
    }

    // Android 一鍵安裝邏輯 (維持不變，但在 iOS 不會觸發)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // 這裡可以顯示一個自定義的 Android 安裝按鈕
    });
</script>
