<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本旅遊翻譯神器 (分類版)</title>
    <style>
        /* 基礎設定與深色背景 */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0 10px 0;
            font-size: 24px;
        }

        /* 上方情境分類列 (Tabs) */
        .category-container {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            width: 100%;
            max-width: 600px;
            padding: 10px;
            gap: 10px;
            /* 隱藏捲軸但保持可滑動 */
            scrollbar-width: none; 
        }
        .category-container::-webkit-scrollbar {
            display: none;
        }

        /* 分類按鈕樣式 */
        .tab-btn {
            background-color: #333333;
            color: #cccccc;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        /* 被選中的分類按鈕樣式 */
        .tab-btn.active {
            background-color: #4CAF50; /* 亮綠色 */
            color: white;
            border: 2px solid #81c784;
        }

        /* 下方語音按鈕網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 語音按鈕樣式 */
        .sound-btn {
            background-color: #3b82f6; /* 藍色 */
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        .sound-btn:active {
            transform: scale(0.95);
            background-color: #2563eb;
        }
        /* 顯示在按鈕下方的小字日文(輔助用) */
        .ja-text {
            font-size: 12px;
            color: #bbdefb;
            margin-top: 8px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <h1>🇯🇵 旅遊發音神器</h1>

    <div class="category-container" id="category-container">
        </div>

    <div class="grid-container" id="button-container">
        </div>

    <script>
        // --- 1. 資料字典：在這裡新增或修改你的句子！ ---
        const phrasesData = {
            "打招呼/基本": [
                { zh: "你好", ja: "こんにちは" },
                { zh: "謝謝", ja: "ありがとうございます" },
                { zh: "不好意思", ja: "すみません" },
                { zh: "拜託您了", ja: "お願いします" }
            ],
            "🛍️ 購物": [
                { zh: "這個多少錢？", ja: "いくらですか" },
                { zh: "我要買這個", ja: "これをください" },
                { zh: "可以刷卡嗎？", ja: "クレジットカードは使えますか" },
                { zh: "可以免稅嗎？", ja: "免税できますか" }
            ],
            "🍜 餐廳": [
                { zh: "請給我菜單", ja: "メニューをお願いします" },
                { zh: "有英文菜單嗎？", ja: "英語のメニューはありますか" },
                { zh: "我要結帳", ja: "お会計をお願いします" },
                { zh: "非常好吃！", ja: "美味しいです" }
            ],
            "🚇 交通/問路": [
                { zh: "洗手間在哪裡？", ja: "トイレはどこですか" },
                { zh: "車站怎麼走？", ja: "駅はどこですか" },
                { zh: "我要去這個地方", ja: "ここに行きたいです" }
            ],
            "🆘 求助": [
                { zh: "請幫幫我", ja: "助けてください" },
                { zh: "我迷路了", ja: "道に迷いました" },
                { zh: "我身體不舒服", ja: "気分が悪いです" }
            ]
        };

        // --- 2. 取得畫面上的容器 ---
        const categoryContainer = document.getElementById('category-container');
        const buttonContainer = document.getElementById('button-container');

        // --- 3. 發音功能 ---
        function speakJapanese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85; // 語速放慢一點點，讓外國人聽得更清楚
                window.speechSynthesis.speak(utterance);
            } else {
                alert("抱歉，您的裝置不支援文字轉語音功能！");
            }
        }

        // --- 4. 渲染語音按鈕的函數 ---
        function renderButtons(categoryName) {
            // 清空目前的按鈕
            buttonContainer.innerHTML = ''; 
            
            // 取得該分類下的所有句子
            const phrases = phrasesData[categoryName];

            // 針對每個句子，製造一個按鈕
            phrases.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                
                // 按鈕裡面放中文，以及小字的日文
                btn.innerHTML = `
                    ${item.zh}
                    <span class="ja-text">${item.ja}</span>
                `;
                
                // 點擊時觸發發音
                btn.onclick = () => speakJapanese(item.ja);
                
                // 把按鈕加到畫面上
                buttonContainer.appendChild(btn);
            });
        }

        // --- 5. 初始化分類標籤 ---
        function initApp() {
            // 抓出所有的分類名稱 (例如 "購物", "餐廳")
            const categories = Object.keys(phrasesData);

            categories.forEach((category, index) => {
                // 產生分類按鈕
                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab-btn';
                tabBtn.textContent = category;
                
                // 預設選擇第一個分類
                if (index === 0) {
                    tabBtn.classList.add('active');
                    renderButtons(category); 
                }

                // 點擊分類標籤時的動作
                tabBtn.onclick = () => {
                    // 把所有標籤的 active 樣式拿掉
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    // 把被點擊的標籤加上 active 樣式
                    tabBtn.classList.add('active');
                    // 重新渲染下方的語音按鈕
                    renderButtons(category);
                };

                categoryContainer.appendChild(tabBtn);
            });
        }

        // 啟動程式！
        initApp();
    </script>

</body>
</html>
