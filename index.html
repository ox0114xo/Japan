<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO_JP_VOICE v5.0 機甲覺醒</title>
    <style>
        /* 賽博機甲 UI 變數 */
        :root { 
            --bg-deep: #050b14; --panel-bg: #0b1426; 
            --neon-blue: #00f0ff; --neon-purple: #b026ff; --neon-green: #39ff14; 
            --neon-red: #ff2a2a; --neon-yellow: #fbbf24;
            --key-top: #152238; --key-side: #060c17; --key-border: #1e3a5f;
            --text-main: #e2e8f0; --text-muted: #64748b; 
        }
        
        body { 
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            background-color: var(--bg-deep); 
            /* 科技網格背景 */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            padding: 15px; max-width: 800px; margin: 0 auto; line-height: 1.6; 
            padding-bottom: 40px; min-height: 100vh;
            overflow-x: hidden;
        }

        /* 頂部標題 HUD 風格 */
        h1 { 
            text-align: center; color: #fff; 
            text-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue); 
            font-size: 28px; margin: 10px 0 25px 0; user-select: none; cursor: pointer; 
            letter-spacing: 4px; font-weight: 900; font-style: italic;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }
        h1::before { content: 'SYS.V5 // '; font-size: 14px; color: var(--neon-purple); text-shadow: none; vertical-align: middle;}
        
        /* 終端搜尋與翻譯整合區 */
        .search-container { display: flex; gap: 12px; margin-bottom: 20px; width: 100%; }
        .search-box { 
            flex: 1; padding: 16px 20px; 
            background: rgba(0,0,0,0.7); 
            border: 1px solid var(--neon-purple); 
            border-left: 4px solid var(--neon-purple);
            border-radius: 4px; font-size: 16px; color: var(--neon-blue); 
            box-sizing: border-box; transition: 0.3s; width: 100%;
            font-family: monospace; letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(176, 38, 255, 0.1);
        }
        .search-box:focus { outline: none; box-shadow: 0 0 20px rgba(176, 38, 255, 0.4), inset 0 0 10px rgba(176, 38, 255, 0.2); }
        .search-box::placeholder { color: #475569; font-family: 'Segoe UI'; }
        
        /* 翻譯執行按鈕 (實體感) */
        .translate-btn-inline { 
            background: linear-gradient(180deg, var(--neon-purple) 0%, #6b21a8 100%);
            color: white; border: 1px solid #d8b4fe; 
            border-bottom: 5px solid #4c1d95; /* 按鍵厚度 */
            padding: 0 20px; border-radius: 6px; font-size: 16px; font-weight: 900; 
            cursor: pointer; transition: all 0.1s; white-space: nowrap; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 6px 15px rgba(176, 38, 255, 0.3);
        }
        .translate-btn-inline:active { 
            transform: translateY(5px); /* 壓下去的物理位移 */
            border-bottom: 0px solid #4c1d95; /* 厚度消失 */
            box-shadow: 0 1px 5px rgba(176, 38, 255, 0.5);
            background: #6b21a8;
        }
        .translate-btn-inline:disabled { opacity: 0.5; cursor: not-allowed; transform: none; border-bottom: 5px solid #4c1d95; }

        /* 即時翻譯結果框 - 全息投影感 */
        #inline-translate-result { 
            display: none; margin-bottom: 25px; padding: 25px 20px 20px 20px; 
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(0,0,0,0.8) 100%); 
            border: 1px solid var(--neon-blue); border-radius: 8px; text-align: center; 
            position: relative; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15) inset, 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        #inline-translate-result::before { 
            content: '▶ NEURAL_TRANSLATION_CORE_ACTIVE'; font-size: 11px; font-family: monospace;
            color: #000; position: absolute; top: -1px; left: -1px; 
            background: var(--neon-blue); padding: 4px 10px; font-weight: bold; 
            border-bottom-right-radius: 8px; box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }
        #inline-jp-text { 
            font-size: 26px; font-weight: 900; color: var(--neon-green); margin: 15px 0; 
            letter-spacing: 2px; word-break: break-all; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }

        /* 分類按鈕區 (切換檔位感) */
        .category-scroll { display: flex; overflow-x: auto; gap: 12px; margin-bottom: 25px; padding-bottom: 10px; scrollbar-width: none; cursor: grab; }
        .category-scroll:active { cursor: grabbing; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { 
            white-space: nowrap; background: #0f172a; color: var(--text-muted); 
            border: 1px solid #334155; border-bottom: 3px solid #020617;
            padding: 10px 22px; border-radius: 4px; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: all 0.1s; letter-spacing: 1px; user-select: none;
        }
        .cat-btn:active { transform: translateY(3px); border-bottom-width: 0px; }
        .cat-btn.active { 
            background: rgba(0, 240, 255, 0.15); color: var(--neon-blue); 
            border-color: var(--neon-blue); border-bottom-color: #008b99;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); text-shadow: 0 0 5px var(--neon-blue);
        }
        .cat-btn.secret-active { 
            background: rgba(255, 42, 42, 0.15); color: var(--neon-red); 
            border-color: var(--neon-red); border-bottom-color: #8b0000;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.3); text-shadow: 0 0 5px var(--neon-red);
        }

        /* 控制滑桿區 */
        .controls-panel { 
            background: rgba(11, 20, 38, 0.8); padding: 15px 20px; border-radius: 8px; 
            border: 1px solid #1e3a5f; border-left: 3px solid var(--text-muted);
            margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; 
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }
        .slider-container { display: flex; align-items: center; gap: 15px; }
        .speed-slider { flex: 1; -webkit-appearance: none; background: #1e3a5f; height: 6px; border-radius: 3px; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 4px; background: var(--text-main); cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.5); border: 2px solid var(--bg-deep);}
        .slider-val { font-family: monospace; font-size: 16px; color: var(--text-main); width: 45px; text-align: right; font-weight: bold;}

        /* ====== 重頭戲：立體機械按鍵列表 ====== */
        ul { 
            list-style: none; padding: 0; margin: 0; 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }
        li.cyber-key { 
            background: linear-gradient(180deg, var(--key-top) 0%, #0d1627 100%);
            border: 1px solid var(--key-border); 
            border-bottom: 8px solid var(--key-side); /* 極深的實體按鍵厚度 */
            border-radius: 12px; 
            padding: 20px; 
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; 
            position: relative; 
            transition: transform 0.08s ease, border-bottom-width 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.05); 
        }
        
        /* 按下按鍵的物理效果 */
        li.cyber-key:active { 
            transform: translateY(8px); 
            border-bottom-width: 0px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 240, 255, 0.2); 
            background: linear-gradient(180deg, #0d1627 0%, var(--key-top) 100%);
        }

        /* 標籤角標 */
        .key-indicator {
            position: absolute; top: 15px; right: 15px;
            font-size: 10px; color: var(--neon-blue); font-family: monospace;
            border: 1px solid var(--neon-blue); padding: 2px 6px; border-radius: 3px;
            opacity: 0.5;
        }

        /* 內容排版 */
        .key-content { z-index: 1; pointer-events: none; margin-bottom: 15px;}
        .jp-text { 
            font-size: 22px; font-weight: 900; color: #fff; display: block; 
            margin-bottom: 8px; letter-spacing: 1px; line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .romaji-text { 
            font-size: 13px; color: var(--neon-green); font-family: monospace; 
            display: block; margin-bottom: 8px; background: rgba(57, 255, 20, 0.05);
            padding: 4px 8px; border-radius: 4px; border-left: 2px solid var(--neon-green);
        }
        .zh-text { font-size: 15px; color: var(--text-muted); display: block; font-weight: 500;}

        /* 按鍵底部的功能列 */
        .key-actions { 
            display: flex; gap: 8px; justify-content: flex-end; 
            border-top: 1px dashed #1e3a5f; padding-top: 12px;
        }
        .icon-btn { 
            background: rgba(0,0,0,0.4); border: 1px solid #334155; border-radius: 4px; 
            font-size: 14px; color: #64748b; cursor: pointer; padding: 8px 15px; 
            transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;
            font-weight: bold;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #64748b;}
        .icon-btn.star.active { 
            color: var(--neon-yellow); border-color: var(--neon-yellow); 
            background: rgba(251, 191, 36, 0.1); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }
        .icon-btn.fullscreen { color: var(--neon-blue); border-color: rgba(0, 240, 255, 0.3);}
        .icon-btn.copy { color: var(--neon-green); border-color: rgba(57, 255, 20, 0.3);}
        .key-actions .icon-btn:active { transform: scale(0.9); }

        /* 全螢幕字幕覆蓋層 */
        #fullscreen-overlay { 
            display: none; position: fixed; inset: 0; background: #000; 
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.05) 2px, rgba(0, 240, 255, 0.05) 4px);
            z-index: 10000; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 20px; box-sizing: border-box; font-family: monospace; 
        }
        #fullscreen-jp { font-size: 10vw; font-weight: bold; color: var(--neon-blue); margin-bottom: 15px; width: 100%; word-wrap: break-word; text-shadow: 0 0 30px var(--neon-blue); }
        #fullscreen-romaji { font-size: 5vw; color: var(--neon-green); margin-bottom: 30px; }
        #fullscreen-zh { font-size: 6vw; color: #fff; font-family: 'Segoe UI';}
        .close-fullscreen { position: absolute; top: 20px; right: 20px; font-size: 35px; color: #fff; background: none; border: none; cursor: pointer; padding: 10px; z-index: 10001; }
        .replay-btn-large { 
            margin-top: 50px; background: rgba(0, 240, 255, 0.1); border: 2px solid var(--neon-blue); 
            color: var(--neon-blue); padding: 15px 50px; font-size: 22px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 4px;
        }
        .replay-btn-large:active { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }

        /* 錯誤與讀取 */
        .loader-container { display: flex; justify-content: center; align-items: center; padding: 50px; flex-direction: column; gap: 20px; }
        .tech-spinner { width: 50px; height: 50px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: var(--neon-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #error-box { display: none; background: rgba(255,42,42,0.1); border: 2px solid var(--neon-red); padding: 20px; border-radius: 8px; margin-top: 20px; word-break: break-all; }
        #error-box h3 { color: var(--neon-red); margin-top: 0; }
    </style>
</head>
<body>

    <div id="fullscreen-overlay">
        <button class="close-fullscreen" onclick="closeFullscreen()">✕</button>
        <div id="fullscreen-jp"></div>
        <div id="fullscreen-romaji"></div>
        <div id="fullscreen-zh"></div>
        <button class="replay-btn-large" onclick="replayFullscreen()">► REPLAY_VOICE</button>
    </div>

    <h1 id="app-title">NEO_JP_VOICE</h1>
    
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="輸入關鍵字檢索，或輸入中文按 Enter 執行自譯..." onkeyup="filterData()" onkeypress="if(event.key === 'Enter') translateAndSpeak()">
        <button class="translate-btn-inline" id="main-translate-btn" onclick="translateAndSpeak()" title="翻譯並發音">翻譯</button>
    </div>

    <div id="inline-translate-result">
        <div id="inline-jp-text"></div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button class="icon-btn copy" onclick="copyText(event, document.getElementById('inline-jp-text').innerText)">📋 複製數據</button>
            <button class="icon-btn fullscreen" onclick="triggerHaptic(); speak(document.getElementById('inline-jp-text').innerText)">🔊 再次播放</button>
        </div>
    </div>

    <div class="category-scroll" id="category-container"></div>

    <div class="controls-panel">
        <div class="slider-container">
            <span style="font-size: 14px; color: var(--text-muted); width: 60px;">⚡ 語速</span>
            <input type="range" id="speed-slider" class="speed-slider" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateSliders()">
            <span id="speed-val" class="slider-val">1.0x</span>
        </div>
        <div class="slider-container">
            <span style="font-size: 14px; color: var(--text-muted); width: 60px;">🔊 音調</span>
            <input type="range" id="pitch-slider" class="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateSliders()">
            <span id="pitch-val" class="slider-val">1.0</span>
        </div>
    </div>

    <div id="error-box"></div>

    <div id="loading" class="loader-container">
        <div class="tech-spinner"></div>
        <span style="color: var(--neon-blue); font-family: monospace; letter-spacing: 2px;">連線至機甲資料庫...</span>
    </div>

    <ul id="sentence-list"></ul>

    <script>
        // --- 核心體驗：Haptic Engine 震動回饋 ---
        // 觸發短震動 (用於按鈕點擊)
        function triggerHaptic(duration = 15) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }
        // 觸發兩次震動 (用於翻譯成功等重要動作)
        function triggerHapticSuccess() {
            if (navigator.vibrate) {
                navigator.vibrate([20, 50, 20]);
            }
        }

        // --- 電腦版滑鼠拖曳分類 ---
        const catContainer = document.getElementById('category-container');
        let isDown = false;
        let startX;
        let scrollLeft;

        catContainer.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - catContainer.offsetLeft;
            scrollLeft = catContainer.scrollLeft;
        });
        catContainer.addEventListener('mouseleave', () => { isDown = false; });
        catContainer.addEventListener('mouseup', () => { isDown = false; });
        catContainer.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - catContainer.offsetLeft;
            const walk = (x - startX) * 2; 
            catContainer.scrollLeft = scrollLeft - walk;
        });

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
        let globalData = [];
        let currentCategory = '全部';
        let favorites = JSON.parse(localStorage.getItem('jp_favorites')) || [];
        
        let clickCount = 0;
        let isSecretUnlocked = false;
        const SECRET_KEYWORD = '🤬 隱藏情緒';

        window.onload = () => {
            loadCSV();
            if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
        };

        function updateSliders() {
            document.getElementById('speed-val').innerText = Number(document.getElementById('speed-slider').value).toFixed(1) + 'x';
            document.getElementById('pitch-val').innerText = Number(document.getElementById('pitch-slider').value).toFixed(1);
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return alert("系統錯誤：未偵測到發音模組");
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = parseFloat(document.getElementById('speed-slider').value);
            utterance.pitch = parseFloat(document.getElementById('pitch-slider').value);
            
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang === 'ja-JP' || v.lang.includes('ja'));
            if(jpVoice) utterance.voice = jpVoice;

            window.speechSynthesis.speak(utterance);
        }

        function toggleFavorite(event, jp) {
            event.stopPropagation();
            triggerHaptic(20);
            const index = favorites.indexOf(jp);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(jp);
            localStorage.setItem('jp_favorites', JSON.stringify(favorites));
            filterData();
        }

        function copyText(event, text) {
            event.stopPropagation();
            triggerHapticSuccess();
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.currentTarget;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '✔ 複製成功';
                btn.style.color = '#39ff14';
                btn.style.borderColor = '#39ff14';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 1500);
            }).catch(err => console.error('複製失敗:', err));
        }

        function openFullscreen(event, jp, zh, romaji) {
            event.stopPropagation();
            triggerHaptic(30);
            document.getElementById('fullscreen-jp').innerText = jp;
            document.getElementById('fullscreen-romaji').innerText = romaji || '';
            document.getElementById('fullscreen-zh').innerText = zh;
            document.getElementById('fullscreen-overlay').style.display = 'flex';
            speak(jp);
        }

        function closeFullscreen() {
            triggerHaptic(15);
            document.getElementById('fullscreen-overlay').style.display = 'none';
            window.speechSynthesis.cancel();
        }

        function replayFullscreen() {
            triggerHaptic(20);
            const jp = document.getElementById('fullscreen-jp').innerText;
            if(jp) speak(jp);
        }

        document.getElementById('app-title').addEventListener('click', () => {
            if (isSecretUnlocked) return;
            triggerHaptic(10);
            clickCount++;
            if (clickCount >= 10) {
                isSecretUnlocked = true;
                triggerHapticSuccess();
                alert('⚠️ 系統警告：安全限制已解除，深網隱藏模組開啟。');
                currentCategory = SECRET_KEYWORD; 
                renderCategories();
                filterData();
            }
        });

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<h3>[ERR] 核心崩潰</h3><p>${message}</p>`;
        }

        async function loadCSV() {
            try {
                const res = await fetch(CSV_URL);
                if (!res.ok) throw new Error("遠端伺服器拒絕連線");
                const csvText = await res.text();
                processData(csvText);
            } catch(e) {
                showError(e.message || e.toString());
            }
        }

        function processData(csvText) {
            try {
                const rows = csvText.split('\n');
                globalData = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if(!row) continue;
                    
                    let cols = [];
                    let currentVal = '';
                    let inQuotes = false;
                    
                    for (let j = 0; j < row.length; j++) {
                        let char = row[j];
                        if (char === '"') {
                            inQuotes = !inQuotes; 
                        } else if (char === ',' && !inQuotes) {
                            cols.push(currentVal.trim()); 
                            currentVal = '';
                        } else {
                            currentVal += char;
                        }
                    }
                    cols.push(currentVal.trim()); 

                    if (cols.length >= 3) {
                        globalData.push({ 
                            cat: (cols[0] || '未分類').replace(/"/g, ''), 
                            zh: (cols[1] || '').replace(/"/g, ''), 
                            jp: (cols[2] || '').replace(/"/g, ''), 
                            romaji: (cols[3] || '').replace(/"/g, '') 
                        });
                    }
                }
                renderCategories();
                filterData();
                document.getElementById('loading').style.display = 'none';
            } catch(e) {
                showError("數據解析失敗: " + e.message);
            }
        }

        function renderCategories() {
            catContainer.innerHTML = '';
            let baseCats = [];
            if (isSecretUnlocked) baseCats.push(SECRET_KEYWORD);
            baseCats.push('全部', '⭐最愛');
            
            const otherCats = new Set();
            globalData.forEach(item => {
                if (!item.cat.includes('隱藏') && !item.cat.includes('🤬')) {
                    otherCats.add(item.cat);
                }
            });
            
            const allCats = [...baseCats, ...Array.from(otherCats)];

            allCats.forEach(cat => {
                const btn = document.createElement('button');
                if (cat === currentCategory) {
                    btn.className = cat === SECRET_KEYWORD ? 'cat-btn secret-active' : 'cat-btn active';
                } else {
                    btn.className = 'cat-btn';
                }
                
                btn.innerText = cat;
                if(cat === '⭐最愛' && cat !== currentCategory) btn.style.color = 'var(--neon-yellow)';
                
                btn.onclick = () => {
                    if (isDown) return; 
                    triggerHaptic(15);
                    currentCategory = cat;
                    renderCategories(); 
                    filterData();
                };
                catContainer.appendChild(btn);
            });
        }

        function filterData() {
            const query = document.getElementById('search-input').value;
            const queryLower = query.toLowerCase();
            
            if(query.trim() === '') {
                document.getElementById('inline-translate-result').style.display = 'none';
            }

            const filteredData = globalData.filter(item => {
                const isSecretItem = item.cat.includes('隱藏') || item.cat.includes('🤬');
                if (isSecretItem && !isSecretUnlocked) return false;
                if (currentCategory === '全部' && isSecretItem) return false;

                let matchCat = false;
                if (currentCategory === '全部') matchCat = true;
                else if (currentCategory === '⭐最愛') matchCat = favorites.includes(item.jp);
                else if (currentCategory === SECRET_KEYWORD) matchCat = isSecretItem;
                else matchCat = item.cat === currentCategory;

                const matchQuery = (item.zh && item.zh.toLowerCase().includes(queryLower)) || 
                                   (item.jp && item.jp.toLowerCase().includes(queryLower)) || 
                                   (item.romaji && item.romaji.toLowerCase().includes(queryLower));
                
                return matchCat && matchQuery;
            });
            
            renderList(filteredData);
        }

        function renderList(dataToRender) {
            const list = document.getElementById('sentence-list');
            list.innerHTML = '';
            if(dataToRender.length === 0) {
                list.innerHTML = '<li style="background:transparent; border:none; box-shadow:none; text-align:center; color:#475569; display:block;">[ 未找到匹配的數據 ]</li>';
                return;
            }

            dataToRender.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cyber-key';
                
                const safeJp = item.jp.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const safeZh = item.zh.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const safeRomaji = item.romaji.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const isFav = favorites.includes(item.jp);

                const isSecretItem = item.cat.includes('隱藏') || item.cat.includes('🤬');
                // 隱藏模式特殊外觀
                if(isSecretItem) {
                    li.style.borderColor = 'rgba(255, 42, 42, 0.4)';
                    li.style.borderBottomColor = '#3a0000';
                }

                // 綁定整個按鍵的點擊事件 (包含震動)
                li.onclick = () => {
                    triggerHaptic(25);
                    speak(item.jp);
                };
                
                li.innerHTML = `
                    <div class="key-indicator">${isSecretItem ? '[ DANGER ]' : '[ DATA_BLOCK ]'}</div>
                    <div class="key-content">
                        <span class="jp-text" ${isSecretItem ? 'style="color:var(--neon-red); text-shadow:0 0 10px rgba(255,42,42,0.5);"' : ''}>${item.jp}</span>
                        ${item.romaji ? `<span class="romaji-text">${item.romaji}</span>` : ''}
                        <span class="zh-text">${item.zh}</span>
                    </div>
                    <div class="key-actions">
                        <button class="icon-btn copy" onclick="copyText(event, '${safeJp}')">📋 複製</button>
                        <button class="icon-btn star ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeJp}')">★ 收藏</button>
                        <button class="icon-btn fullscreen" onclick="openFullscreen(event, '${safeJp}', '${safeZh}', '${safeRomaji}')">⛶ 放大</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function translateAndSpeak() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;

            triggerHaptic(20);

            const resContainer = document.getElementById('inline-translate-result');
            const resJp = document.getElementById('inline-jp-text');
            const btn = document.getElementById('main-translate-btn');
            
            resContainer.style.display = 'block';
            resJp.style.color = 'var(--text-muted)';
            resJp.style.textShadow = 'none';
            resJp.innerText = "解析中...";
            btn.disabled = true;
            btn.innerText = "處理中";

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=ja&dt=t&q=${encodeURIComponent(input)}`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error("伺服器斷線");
                
                const data = await response.json();
                const translatedText = data[0][0][0]; 
                
                resJp.style.color = 'var(--neon-green)';
                resJp.style.textShadow = '0 0 15px rgba(57, 255, 20, 0.6)';
                resJp.innerText = translatedText;
                
                triggerHapticSuccess();
                speak(translatedText);

            } catch (error) {
                resJp.style.color = 'var(--neon-red)';
                resJp.innerText = "[ ERR_TRANSLATION_FAILED ]";
            } finally {
                btn.disabled = false;
                btn.innerText = "翻譯";
            }
        }
    </script>
</body>
</html>
