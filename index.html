<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="日文語音">
    <title>日本旅遊常用句</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        /* 日本傳統色系 */
        :root { 
            --bg-washi: #F9F6F0;       /* 和紙白 */
            --kurenai: #BC002D;        /* 鳥居紅 (主色) */
            --sakura: #FEDfe1;         /* 櫻粉色 */
            --sumi: #1C1C1C;           /* 墨黑 */
            --ai: #1A4359;             /* 藍染 (深藍) */
            --matcha: #8BA888;         /* 抹茶綠 */
            --kin: #D4AF37;            /* 金色 */
            --text-main: #2C3E50;      /* 深鐵灰 */
            --text-muted: #88929A; 
            --border-light: #EAD9C9; 
        }
        
        body { 
            font-family: 'Noto Serif JP', 'Yu Mincho', 'Microsoft JhengHei', serif; /* 帶有襯線的典雅字體 */
            margin: 0; padding: 15px; padding-bottom: 90px; min-height: 100vh;
            color: var(--text-main); background-color: var(--bg-washi); 
            /* 隱約的和風紋理背景 */
            background-image: linear-gradient(rgba(188, 0, 45, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(188, 0, 45, 0.03) 1px, transparent 1px);
            background-size: 20px 20px; overflow-x: hidden; position: relative;
        }

        /* 內建瀏覽器警告牆 */
        #inapp-warning { display: none; position: fixed; inset: 0; background: rgba(28,28,28,0.95); z-index: 9999999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; }
        #inapp-warning h1 { color: var(--kurenai); font-size: 28px; margin-bottom: 15px; border: none;}
        #inapp-warning p { font-size: 18px; line-height: 1.6; margin-bottom: 20px; color: #fff;}

        /* 標題與功能區 */
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border-light); padding-bottom: 15px;}
        h1 { 
            font-size: 26px; font-weight: 900; letter-spacing: 2px; margin: 0; color: var(--sumi);
            display: flex; align-items: center; gap: 8px;
        }
        .header-actions { display: flex; gap: 10px; }
        .omikuji-btn {
            background: #fff; color: var(--sumi); border: 1px solid var(--border-light);
            padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .sos-btn {
            background: var(--kurenai); color: #fff; border: none;
            padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(188, 0, 45, 0.3); animation: pulseRed 2s infinite;
        }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(188, 0, 45, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(188, 0, 45, 0); } 100% { box-shadow: 0 0 0 0 rgba(188, 0, 45, 0); } }

        /* 搜尋、語音輸入與翻譯列 */
        .search-container { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; }
        .input-wrapper { position: relative; flex: 1; display: flex; }
        .search-box { 
            width: 100%; padding: 16px 50px 16px 20px; font-size: 16px; color: var(--sumi); font-weight: bold;
            background: #fff; border: 2px solid var(--border-light); 
            border-radius: 30px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .search-box:focus { border-color: var(--kurenai); box-shadow: 0 0 10px rgba(188,0,45,0.1); }
        .mic-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--bg-washi); border: none; color: var(--kurenai); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .mic-btn.recording { background: var(--kurenai); color: #fff; animation: pulseRed 1s infinite; }
        .translate-btn-inline { background: var(--sumi); color: white; border: none; padding: 0 20px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .translate-btn-inline:active { transform: scale(0.95); }

        /* 和風開關面板 */
        .toggles-panel { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: #fff; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border-light); }
        .polite-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-main); font-weight: bold; cursor: pointer;}
        .polite-toggle input { width: 16px; height: 16px; accent-color: var(--kurenai); }

        /* 翻譯結果顯示區 */
        #inline-translate-result { display: none; margin-bottom: 25px; padding: 25px 20px; text-align: center; position: relative; background: #fff; border: 2px solid var(--kurenai); border-radius: 12px; box-shadow: 0 4px 15px rgba(188,0,45,0.08); }
        .trans-badge { position: absolute; top: -12px; left: 20px; font-size: 13px; font-weight: bold; color: #fff; background: var(--kurenai); padding: 4px 12px; border-radius: 20px; }
        #inline-jp-text { font-size: 26px; font-weight: 900; color: var(--sumi); margin: 15px 0; letter-spacing: 2px; }

        /* 分類按鈕 (木牌風格) */
        .category-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .category-row-static { display: flex; flex-wrap: wrap; gap: 10px; }
        .category-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; scrollbar-width: none; cursor: grab; white-space: nowrap; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { 
            flex-shrink: 0; background: #fff; color: var(--text-muted); 
            border: 1px solid var(--border-light); 
            padding: 10px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .cat-btn.active { background: var(--kurenai); color: #fff; border-color: var(--kurenai); box-shadow: 0 4px 10px rgba(188,0,45,0.2); }
        .cat-btn.custom-active { background: var(--matcha); color: #fff; border-color: var(--matcha); }
        .cat-btn.secret-active { background: var(--sumi); color: #fff; border-color: var(--sumi); }

        /* 滑桿面板 */
        .controls-panel { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--border-light); margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .slider-container { display: flex; align-items: center; gap: 15px; width: 100%; max-width: 350px; justify-content: space-between; }
        .slider-label { font-size: 14px; font-weight: bold; color: var(--text-main); width: 40px; }
        .speed-slider { flex: 1; -webkit-appearance: none; background: var(--border-light); height: 6px; border-radius: 3px; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--kurenai); cursor: pointer; box-shadow: 0 2px 5px rgba(188,0,45,0.4); }
        .slider-val { font-family: monospace; font-size: 14px; font-weight: bold; color: var(--kurenai); width: 40px; text-align: right; }

        /* ====== 和風卡片 (繪馬/印章設計) ====== */
        ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        li.wafu-card { 
            background: #fff; border: 1px solid var(--border-light); border-left: 5px solid var(--kurenai);
            border-radius: 10px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; position: relative; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
        }
        li.wafu-card:active { transform: scale(0.98); background: #fdfbf7; }

        /* 印章風格的分類標籤 */
        .hanko-stamp { 
            position: absolute; top: 15px; right: 15px; font-size: 12px; font-weight: 900; color: var(--kurenai); 
            border: 2px solid var(--kurenai); padding: 2px 6px; border-radius: 4px; 
            transform: rotate(-5deg); opacity: 0.8; letter-spacing: 1px; font-family: 'Yu Mincho', serif;
        }
        .key-content { z-index: 1; pointer-events: none; margin-bottom: 15px; margin-top: 10px;}
        .zh-text-main { font-size: 18px; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 8px; line-height: 1.4; }
        .jp-text-sub { font-size: 24px; color: var(--sumi); display: block; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; }
        .romaji-text { font-size: 13px; color: var(--ai); font-family: monospace; display: inline-block; font-weight: bold; background: rgba(26, 67, 89, 0.05); padding: 4px 8px; border-radius: 4px; }
        
        .card-actions { display: flex; gap: 10px; justify-content: flex-end; border-top: 1px dashed var(--border-light); padding-top: 15px; }
        .icon-btn { background: #f9f9f9; border: 1px solid var(--border-light); border-radius: 20px; font-size: 13px; color: var(--text-main); cursor: pointer; padding: 6px 14px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px; font-weight: bold; }
        .icon-btn:hover { background: #f0f0f0; }
        .icon-btn.star.active { color: var(--kin); border-color: var(--kin); background: rgba(212, 175, 55, 0.1); }
        .icon-btn.fullscreen { color: var(--kurenai); border-color: rgba(188, 0, 45, 0.2);}
        
        /* 櫻花飄落動畫 */
        .petal { position: fixed; top: -10px; background: var(--sakura); border-radius: 15px 0 15px 0; width: 12px; height: 12px; z-index: 9998; pointer-events: none; animation: fall linear infinite, sway ease-in-out infinite alternate; box-shadow: 0 0 5px rgba(254, 223, 225, 0.8); }
        @keyframes fall { to { top: 110vh; transform: rotate(720deg); } }
        @keyframes sway { from { margin-left: -20px; } to { margin-left: 20px; } }

        /* 書法掛軸大字報 (Fullscreen) */
        #fullscreen-overlay { display: none; position: fixed; inset: 0; background: var(--bg-washi); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; background-image: radial-gradient(circle, rgba(0,0,0,0.02) 2px, transparent 2px); background-size: 30px 30px;}
        .scroll-inner { background: #fff; width: 90%; height: 80%; border: 20px solid #e0d0b8; border-top-width: 40px; border-bottom-width: 40px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; justify-content: center; padding: 30px; position: relative;}
        #fullscreen-jp { font-size: 8vw; font-weight: 900; color: var(--sumi); margin-bottom: 20px; word-wrap: break-word; font-family: 'Yu Mincho', serif; writing-mode: vertical-rl; text-orientation: upright; max-height: 60vh;}
        #fullscreen-romaji { font-size: 4vw; font-weight: bold; color: var(--kurenai); position: absolute; bottom: 20px; left: 20px; writing-mode: horizontal-tb;}
        #fullscreen-zh { font-size: 4vw; font-weight: bold; color: var(--text-muted); position: absolute; top: 20px; left: 20px; writing-mode: horizontal-tb;}
        .close-fullscreen { position: absolute; top: 20px; right: 20px; font-size: 40px; color: var(--sumi); background: none; border: none; cursor: pointer; z-index: 10001;}
        .replay-btn-large { position: absolute; bottom: 30px; right: 30px; background: var(--kurenai); color: #fff; border: none; padding: 12px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(188,0,45,0.3);}

        /* 御神籤 (Omikuji) 彈窗 */
        #omikuji-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;}
        .omikuji-card { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 350px; position: relative; border-top: 10px solid var(--kurenai); box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .omikuji-fortune { font-size: 40px; font-weight: 900; color: var(--kurenai); margin-bottom: 10px; font-family: 'Yu Mincho', serif;}
        .omikuji-title { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; font-weight: bold;}
        .omikuji-jp { font-size: 24px; font-weight: bold; color: var(--sumi); margin-bottom: 10px;}
        .omikuji-zh { font-size: 16px; color: var(--text-main); margin-bottom: 25px;}
        .omikuji-btn-play { background: var(--sumi); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-right: 10px;}
        .omikuji-close { background: #eee; color: var(--text-main); border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;}

        /* SOS 緊急求助面板 */
        #sos-modal { display: none; position: fixed; inset: 0; background: rgba(188, 0, 45, 0.95); z-index: 100000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;}
        #sos-modal h2 { color: #fff; font-size: 30px; font-weight: 900; margin-bottom: 30px; letter-spacing: 3px; font-family: 'Yu Mincho', serif;}
        .sos-option { width: 100%; max-width: 350px; background: #fff; color: var(--kurenai); font-size: 20px; font-weight: 900; padding: 18px; border-radius: 8px; margin-bottom: 15px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .sos-close { margin-top: 20px; background: none; border: 2px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>

    <div id="inapp-warning">
        <h1>⚠️ 系統功能受限</h1>
        <p>檢測到您正在使用內建瀏覽器，<br>這將導致語音辨識與發音失效！</p>
        <p>👉 請點擊右上角「⋮」<br>選擇 <span style="color:var(--kurenai); font-weight:bold;">「以預設瀏覽器開啟」</span></p>
    </div>

    <div id="omikuji-modal">
        <div class="omikuji-card">
            <div class="omikuji-fortune" id="omi-fortune">大吉</div>
            <div class="omikuji-title">⛩️ 今日專屬旅遊句</div>
            <div class="omikuji-jp" id="omi-jp"></div>
            <div class="omikuji-zh" id="omi-zh"></div>
            <button class="omikuji-btn-play" onclick="speak(document.getElementById('omi-jp').innerText)">🔊 聆聽</button>
            <button class="omikuji-close" onclick="document.getElementById('omikuji-modal').style.display='none'">收下祝福</button>
        </div>
    </div>

    <div id="sos-modal">
        <h2>🚨 緊急事態 (SOS) 🚨</h2>
        <button class="sos-option" onclick="triggerSOS('我需要叫救護車', '救急車を呼んでください')">🚑 叫救護車</button>
        <button class="sos-option" onclick="triggerSOS('請幫我報警', '警察を呼んでください')">🚓 請幫我報警</button>
        <button class="sos-option" onclick="triggerSOS('我迷路了，請幫我', '道に迷いました。助けてください')">🗺️ 我迷路了</button>
        <button class="sos-option" onclick="triggerSOS('我弄丟了護照/錢包', 'パスポートと財布をなくしました')">🛂 遺失護照/錢包</button>
        <button class="sos-close" onclick="closeSOS()">取消</button>
    </div>

    <div id="fullscreen-overlay">
        <button class="close-fullscreen" onclick="closeFullscreen()">✕</button>
        <div class="scroll-inner">
            <div id="fullscreen-zh"></div>
            <div id="fullscreen-jp"></div>
            <div id="fullscreen-romaji"></div>
            <button class="replay-btn-large" onclick="replayFullscreen()">🔊 發音</button>
        </div>
    </div>

    <div class="header-area">
        <h1 id="app-title"><span style="color: var(--kurenai);">⛩️</span> 日本旅遊常用句</h1>
        <div class="header-actions">
            <button class="omikuji-btn" onclick="drawOmikuji()">🥠 求籤</button>
            <button class="sos-btn" onclick="document.getElementById('sos-modal').style.display='flex'; triggerHaptic(50);">SOS</button>
        </div>
    </div>
    
    <div class="search-container">
        <div class="input-wrapper">
            <input type="text" id="search-input" class="search-box" placeholder="輸入中文/日文，或點擊麥克風" onkeyup="filterData()" onkeypress="if(event.key === 'Enter') translateAndSpeak()">
            <button id="mic-btn" class="mic-btn" onclick="startVoiceInput()">🎤</button>
        </div>
        <button class="translate-btn-inline" id="main-translate-btn" onclick="translateAndSpeak()">翻譯</button>
    </div>

    <div class="toggles-panel">
        <label class="polite-toggle">
            <input type="checkbox" id="polite-mode" onchange="filterData()"> 🌸 智慧禮貌用語 (すみません)
        </label>
        <label class="polite-toggle">
            <input type="checkbox" id="romaji-toggle" checked onchange="toggleRomaji()"> 🔤 顯示羅馬拼音
        </label>
        <label class="polite-toggle">
            <input type="checkbox" id="sakura-toggle" onchange="toggleSakura()"> 🎐 櫻花飄落特效
        </label>
    </div>

    <div id="inline-translate-result">
        <div class="trans-badge">翻譯結果</div>
        <div id="inline-jp-text"></div>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
            <button class="icon-btn copy" onclick="copyText(event, document.getElementById('inline-jp-text').innerText)">📋 複製</button>
            <button class="icon-btn fullscreen" onclick="triggerHaptic(); speak(document.getElementById('inline-jp-text').innerText)">🔊 發音</button>
            <button class="icon-btn star active" id="save-custom-btn" onclick="saveCustomTranslation()">💾 存入自訂</button>
        </div>
    </div>

    <div class="category-container">
        <div class="category-row-static" id="cat-row-1"></div>
        <div class="category-scroll" id="cat-row-2"></div>
    </div>

    <div class="controls-panel">
        <div class="slider-container">
            <span class="slider-label">語速</span>
            <input type="range" id="speed-slider" class="speed-slider" min="0" max="2" step="0.1" value="1.0" oninput="updateSliders()">
            <span id="speed-val" class="slider-val">1.0x</span>
        </div>
        <div class="slider-container">
            <span class="slider-label">音調</span>
            <input type="range" id="pitch-slider" class="speed-slider" min="0" max="2" step="0.1" value="1.0" oninput="updateSliders()">
            <span id="pitch-val" class="slider-val">1.0</span>
        </div>
    </div>

    <ul id="sentence-list"></ul>

    <script>
        // 內建瀏覽器防護
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInApp = /Line|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);
        if (isInApp) { document.getElementById('inapp-warning').style.display = 'flex'; }

        // 櫻花特效邏輯
        let sakuraInterval;
        function toggleSakura() {
            const isChecked = document.getElementById('sakura-toggle').checked;
            if (isChecked) {
                sakuraInterval = setInterval(() => {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    petal.style.opacity = Math.random();
                    document.body.appendChild(petal);
                    setTimeout(() => petal.remove(), 7000);
                }, 400);
            } else {
                clearInterval(sakuraInterval);
                document.querySelectorAll('.petal').forEach(p => p.remove());
            }
        }

        // 御神籤 (Omikuji) 邏輯
        function drawOmikuji() {
            triggerHaptic(30);
            if (globalData.length === 0) return alert('資料庫載入中，請稍後抽籤！');
            const fortunes = ['大吉', '中吉', '小吉', '吉'];
            const f = fortunes[Math.floor(Math.random() * fortunes.length)];
            const item = globalData[Math.floor(Math.random() * globalData.length)];
            
            document.getElementById('omi-fortune').innerText = f;
            document.getElementById('omi-fortune').style.color = (f === '大吉') ? 'var(--kurenai)' : 'var(--sumi)';
            document.getElementById('omi-jp').innerText = item.jp;
            document.getElementById('omi-zh').innerText = item.zh;
            document.getElementById('omikuji-modal').style.display = 'flex';
            speak(item.jp);
        }

        // 語音辨識
        function startVoiceInput() {
            triggerHaptic(20);
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("您的設備不支援語音輸入！");
            const recognition = new SpeechRecognition(); recognition.lang = 'zh-TW'; recognition.interimResults = false;
            const micBtn = document.getElementById('mic-btn'); const searchInput = document.getElementById('search-input');
            recognition.onstart = () => { micBtn.classList.add('recording'); searchInput.value = ''; searchInput.placeholder = '聆聽中...'; };
            recognition.onresult = (event) => { searchInput.value = event.results[0][0].transcript; translateAndSpeak(); };
            recognition.onend = () => { micBtn.classList.remove('recording'); searchInput.placeholder = '輸入中文/日文，或點擊麥克風'; };
            recognition.start();
        }

        // 基礎功能
        function triggerHaptic(duration = 15) { if (navigator.vibrate) navigator.vibrate(duration); }
        function triggerHapticSuccess() { if (navigator.vibrate) navigator.vibrate([20, 50, 20]); }

        // 橫向滑動
        const catScrollContainer = document.getElementById('cat-row-2');
        let isDown = false; let startX; let scrollLeft;
        catScrollContainer.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - catScrollContainer.offsetLeft; scrollLeft = catScrollContainer.scrollLeft; });
        catScrollContainer.addEventListener('mouseleave', () => { isDown = false; });
        catScrollContainer.addEventListener('mouseup', () => { setTimeout(()=> { isDown = false; }, 50); });
        catScrollContainer.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); catScrollContainer.scrollLeft = scrollLeft - ((e.pageX - catScrollContainer.offsetLeft) - startX) * 2; });

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
        let globalData = []; let currentCategory = '全部';
        let favorites = JSON.parse(localStorage.getItem('jp_favorites')) || [];
        const CUSTOM_KEYWORD = '🗂️ 自訂';
        let customTranslations = JSON.parse(localStorage.getItem('jp_custom_translations')) || [];

        window.onload = () => { loadCSV(); if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); };

        function updateSliders() {
            document.getElementById('speed-val').innerText = Number(document.getElementById('speed-slider').value).toFixed(1) + 'x';
            document.getElementById('pitch-val').innerText = Number(document.getElementById('pitch-slider').value).toFixed(1);
        }

        function toggleRomaji() {
            const isChecked = document.getElementById('romaji-toggle').checked;
            document.querySelectorAll('.romaji-text').forEach(el => el.style.display = isChecked ? 'inline-block' : 'none');
        }

        function speak(text, forceLoudAndSlow = false) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            if (forceLoudAndSlow) { utterance.rate = 0.7; utterance.pitch = 1.0; utterance.volume = 1.0; } 
            else { let r = parseFloat(document.getElementById('speed-slider').value); utterance.rate = r===0 ? 0.1 : r; utterance.pitch = parseFloat(document.getElementById('pitch-slider').value); }
            window.speechSynthesis.speak(utterance);
        }

        function triggerSOS(zh, jp) { triggerHaptic([50, 100, 50, 100, 50]); document.getElementById('sos-modal').style.display = 'none'; openFullscreen({stopPropagation:()=>{}}, jp, zh, ''); speak(jp, true); }
        function closeSOS() { document.getElementById('sos-modal').style.display = 'none'; }

        function toggleFavorite(event, jp) { event.stopPropagation(); triggerHaptic(20); const index = favorites.indexOf(jp); if (index > -1) favorites.splice(index, 1); else favorites.push(jp); localStorage.setItem('jp_favorites', JSON.stringify(favorites)); filterData(); }
        function copyText(event, text) { event.stopPropagation(); navigator.clipboard.writeText(text).then(() => { const btn = event.currentTarget; const originalHTML = btn.innerHTML; btn.innerHTML = '✔ 成功'; setTimeout(() => btn.innerHTML = originalHTML, 1500); }); }
        
        function openFullscreen(event, jp, zh, romaji) { event.stopPropagation(); triggerHaptic(30); document.getElementById('fullscreen-jp').innerText = jp; document.getElementById('fullscreen-romaji').innerText = romaji || ''; document.getElementById('fullscreen-zh').innerText = zh; document.getElementById('fullscreen-overlay').style.display = 'flex'; speak(jp); }
        function closeFullscreen() { triggerHaptic(15); document.getElementById('fullscreen-overlay').style.display = 'none'; window.speechSynthesis.cancel(); }
        function replayFullscreen() { triggerHaptic(20); speak(document.getElementById('fullscreen-jp').innerText); }

        async function loadCSV() { try { const res = await fetch(CSV_URL); const csvText = await res.text(); processData(csvText); } catch(e) { console.error(e); } }

        function processData(csvText) {
            const rows = csvText.split('\n'); globalData = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].trim(); if(!row) continue;
                let cols = []; let currentVal = ''; let inQuotes = false;
                for (let j = 0; j < row.length; j++) {
                    let char = row[j];
                    if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { cols.push(currentVal.trim()); currentVal = ''; } else currentVal += char;
                }
                cols.push(currentVal.trim()); 
                if (cols.length >= 3) globalData.push({ cat: (cols[0] || '未分類').replace(/"/g, ''), zh: (cols[1] || '').replace(/"/g, ''), jp: (cols[2] || '').replace(/"/g, ''), romaji: (cols[3] || '').replace(/"/g, '') });
            }
            if(customTranslations.length > 0) globalData = [...globalData, ...customTranslations];
            renderCategories(); filterData();
        }

        function renderCategories() {
            const row1 = document.getElementById('cat-row-1'); const row2 = document.getElementById('cat-row-2');
            row1.innerHTML = ''; row2.innerHTML = '';
            let baseCats = ['全部', '⭐最愛']; if (customTranslations.length > 0) baseCats.push(CUSTOM_KEYWORD);
            const otherCats = new Set(); globalData.forEach(item => { if (item.cat !== CUSTOM_KEYWORD) otherCats.add(item.cat); });

            function createBtn(cat) {
                const btn = document.createElement('button');
                btn.className = (cat === currentCategory) ? 'cat-btn active' : 'cat-btn';
                btn.innerText = cat;
                return btn;
            }

            baseCats.forEach(cat => { let btn = createBtn(cat); btn.onclick = () => { currentCategory = cat; renderCategories(); filterData(); }; row1.appendChild(btn); });
            Array.from(otherCats).forEach(cat => { let btn = createBtn(cat); btn.onclick = () => { if (isDown) return; currentCategory = cat; renderCategories(); filterData(); }; row2.appendChild(btn); });
        }

        function shouldAddPolitePrefix(zhText, jpText) {
            const excludeKeywords = ['你好', '早安', '午安', '晚安', '謝謝', '感謝', '對不起', '抱歉', '沒關係', '沒問題', '再見', '掰掰', '不好意思', '不用', '好'];
            if (jpText.includes('すみません') || jpText.includes('ごめんなさい')) return false;
            if (zhText.trim().length <= 2) return false;
            for (let word of excludeKeywords) { if (zhText.startsWith(word) || zhText === word) return false; }
            return true;
        }

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filteredData = globalData.filter(item => {
                let matchCat = (currentCategory === '全部') ? true : (currentCategory === '⭐最愛' ? favorites.includes(item.jp) : item.cat === currentCategory);
                const matchQuery = (item.zh && item.zh.toLowerCase().includes(query)) || (item.jp && item.jp.toLowerCase().includes(query));
                return matchCat && matchQuery;
            });
            renderList(filteredData);
        }

        function renderList(dataToRender) {
            const list = document.getElementById('sentence-list'); list.innerHTML = '';
            const isPolite = document.getElementById('polite-mode').checked;
            const showRomaji = document.getElementById('romaji-toggle').checked;

            dataToRender.forEach(item => {
                const li = document.createElement('li'); li.className = 'wafu-card'; 
                let needsPolite = isPolite && shouldAddPolitePrefix(item.zh, item.jp);
                let displayZh = needsPolite ? `不好意思，${item.zh}` : item.zh;
                let displayJp = needsPolite ? `すみません、${item.jp}` : item.jp;
                let displayRomaji = (needsPolite && item.romaji) ? `Sumimasen, ${item.romaji}` : item.romaji;

                const safeJp = item.jp.replace(/'/g, "\\'").replace(/"/g, "&quot;"); const safeZh = displayZh.replace(/'/g, "\\'").replace(/"/g, "&quot;"); const safeRomaji = displayRomaji.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const isFav = favorites.includes(item.jp); 
                
                let indicatorName = item.cat === CUSTOM_KEYWORD ? '自訂' : item.cat;
                li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') { triggerHaptic(25); speak(displayJp); } };
                
                li.innerHTML = `
                    <div class="hanko-stamp">${indicatorName}</div>
                    <div class="key-content">
                        <span class="zh-text-main">${displayZh}</span>
                        <span class="jp-text-sub">${displayJp}</span>
                        ${displayRomaji ? `<span class="romaji-text" style="display: ${showRomaji ? 'inline-block' : 'none'};">${displayRomaji}</span>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="icon-btn copy" onclick="copyText(event, '${safeJp}')">📋</button>
                        <button class="icon-btn star ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeJp}')">★</button>
                        <button class="icon-btn fullscreen" onclick="openFullscreen(event, '${safeJp}', '${safeZh}', '${safeRomaji}')">⛶ 大字</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function translateAndSpeak() {
            let input = document.getElementById('search-input').value.trim(); if (!input) return;
            const isPolite = document.getElementById('polite-mode').checked;
            const originalZh = input;
            if (isPolite && shouldAddPolitePrefix(input, '')) { input = "不好意思請問，" + input + "，謝謝。"; }

            const resContainer = document.getElementById('inline-translate-result'); const resJp = document.getElementById('inline-jp-text'); const btn = document.getElementById('main-translate-btn');
            resContainer.style.display = 'block'; resJp.innerText = "翻譯中..."; btn.disabled = true; 
            
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=ja&dt=t&q=${encodeURIComponent(input)}`);
                const data = await response.json(); const translatedText = data[0][0][0]; 
                resJp.innerText = translatedText; resContainer.setAttribute('data-zh', originalZh);
                speak(translatedText);
            } catch (error) { resJp.innerText = "[ 翻譯失敗 ]"; } finally { btn.disabled = false; }
        }

        function saveCustomTranslation() {
            const zh = document.getElementById('inline-translate-result').getAttribute('data-zh') || document.getElementById('search-input').value.trim(); 
            const jp = document.getElementById('inline-jp-text').innerText.trim();
            if (!zh || !jp || jp === "翻譯中...") return;
            triggerHapticSuccess(); const newItem = { cat: CUSTOM_KEYWORD, zh: zh, jp: jp, romaji: '' };
            customTranslations.push(newItem); localStorage.setItem('jp_custom_translations', JSON.stringify(customTranslations)); globalData.push(newItem);
            renderCategories(); filterData();
        }
    </script>
</body>
</html>
