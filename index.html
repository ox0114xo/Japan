<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>日本旅遊神器 保頭防踢版</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日語神器">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #3b82f6; --green: #10b981; --red: #ef4444; --gold: #fbbf24; --text: #f8fafc; --sub: #94a3b8; --border: #334155; }
        body { background-color: var(--bg); color: var(--text); margin: 0; font-family: sans-serif; text-align: center; padding-bottom: 100px; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .title { font-size: 26px; font-weight: 900; margin: 20px 0; color: #fff; cursor: pointer; user-select: none; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        
        .search { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; font-size: 16px; text-align: center; box-sizing: border-box; outline: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn.active { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .btn-red { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.5); color: var(--red); grid-column: span 2; }
        .chk-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--sub); display: flex; justify-content: center; align-items: center; gap: 5px; font-weight: bold; }
        
        .cat-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-item { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-item.active { background: #475569; color: #fff; border-color: #fff; }

        .list-area { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
        .card-inner { padding: 20px 15px; cursor: pointer; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; margin-bottom: 5px; display: inline-block; border: 1px solid rgba(59,130,246,0.2); }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); }
        .star { position: absolute; top: 12px; left: 12px; font-size: 26px; color: #334155; padding: 5px; cursor: pointer; }
        .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .zoom-btn { width: 100%; background: rgba(255,255,255,0.05); color: var(--sub); border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .m-box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: left; border: 1px solid var(--border); }
        .m-close { width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; margin-top: 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>

    <div id="modal-tts" class="modal">
        <div class="m-box">
            <h2 style="color:var(--red); margin-top:0; text-align:center;">🔇 發音失敗</h2>
            <p style="color:var(--text); font-size:15px; line-height:1.6;">
                1. 檢查網址列旁邊鎖頭的<b>聲音權限</b>已允許。<br><br>
                2. 確認手機未開啟<b>靜音模式</b>。<br><br>
                3. 前往手機設定下載<b>日文語音包</b>。
            </p>
            <label style="display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:14px; margin-top:15px; cursor:pointer;">
                <input type="checkbox" id="chk-ignore" style="width:18px; height:18px; margin-right:8px;">
                ✅ 我有聲音，請不要自動彈出
            </label>
            <button class="m-close" onclick="document.getElementById('modal-tts').style.display='none'">關閉提示</button>
        </div>
    </div>

    <div id="modal-zoom" class="modal">
        <div id="z-ja" style="font-size:12vw; font-weight:900; color:#fff; text-align:center;"></div>
        <div id="z-zh" style="font-size:22px; color:var(--sub); margin-top:30px; text-align:center; font-weight:bold;"></div>
        <button class="m-close" style="background:var(--border);" onclick="document.getElementById('modal-zoom').style.display='none'">✖ 關閉</button>
    </div>

    <div class="container">
        <div class="title" id="main-title" onclick="unlock()">🇯🇵 Japan Travel 保頭版</div>

        <input type="text" id="search" class="search" placeholder="🔍 搜尋你想說的話...">

        <div class="grid-2">
            <button class="btn" id="btn-rec" onclick="setCat('🕒 歷史紀錄')">🕒 歷史紀錄</button>
            <button class="btn" id="btn-fav" onclick="setCat('⭐ 最愛')">⭐ 最愛</button>

            <div class="chk-box"><label>🐢 龜速 <input type="checkbox" id="spd"></label></div>
            <button class="btn btn-red" onclick="document.getElementById('modal-tts').style.display='flex'">🚑 沒聲音看這裡</button>
        </div>

        <div class="cat-scroll" id="cat-box"></div>
        <div class="list-area" id="list-box"></div>
    </div>
