<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Pro Max Ultra</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* 你的原始 CSS 保持不變，此處為節省空間僅保留關鍵部分，實際使用時請複製原完整樣式 */
        :root {
            --bg-dark: #070b14;
            --accent-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
            --star-gold: #fbbf24;
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            background-attachment: fixed; color: var(--text-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
            padding-bottom: 120px;
            min-height: 100vh;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        h1 { font-size: 26px; margin: 25px 0; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        .search-box { 
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--card-border); 
            background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; backdrop-filter: blur(10px);
        }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; width: 100%; }
        .control-panel { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 20px; border: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; }
        .quick-nav { grid-column: span 2; display: flex; gap: 10px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid var(--card-border); background: var(--card-bg); color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .nav-btn.active { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); border-color: transparent; }
        .toggle-group { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-sub); font-weight: bold; }

        .category-container { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 15px 0; margin-bottom: 15px; scrollbar-width: none; width: 100%; -webkit-overflow-scrolling: touch; }
        .category-container::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 50px; white-space: nowrap; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }

        .grid-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .phrase-card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 28px; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: 0.1s; overflow: hidden; }
        .phrase-card:active { transform: scale(0.97); }
        .card-content { padding: 30px 20px 20px 20px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .zh-text { font-size: 21px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .ja-wrapper { background: rgba(59, 130, 246, 0.1); padding: 10px 20px; border-radius: 12px; margin-bottom: 6px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .ja-text { font-size: 19px; color: #93c5fd; font-weight: bold; }
        .romaji-text { font-size: 13px; color: var(--text-sub); font-style: italic; margin-bottom: 10px; }
        .fav-star { position: absolute; top: 18px; left: 22px; font-size: 26px; color: rgba(255,255,255,0.1); transition: 0.2s; cursor: pointer; }
        .fav-star.active { color: var(--star-gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .full-bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--card-border); padding: 16px; font-weight: bold; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

        .custom-area { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 30px; width: 100%; box-sizing: border-box; border: 1px solid var(--card-border); }
        .custom-textarea { width: 100%; height: 100px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--card-border); padding: 15px; border-radius: 18px; box-sizing: border-box; margin-bottom: 15px; font-size: 18px; outline: none; text-align: center; }
        .translated-box { background: rgba(16,185,129,0.05); padding: 20px; border-radius: 15px; color: #6ee7b7; font-weight: bold; margin-bottom: 15px; min-height: 50px; font-size: 22px; text-align: center; }
        .custom-play-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; border-radius: 18px; font-weight: bold; font-size: 20px; cursor: pointer; }

        .install-fab { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(59, 130, 246, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px 30px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            color: white; font-weight: bold; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; z-index: 9999; cursor: pointer; white-space: nowrap;
        }

        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .modal-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
        .modal-zh { font-size: 24px; color: var(--text-sub); margin-top: 40px; }
        .close-modal { margin-top: 80px; padding: 20px 60px; background: #1e293b; color: #fff; border-radius: 50px; font-size: 20px; font-weight: bold; border: none; cursor: pointer; }
        .toast { position: fixed; bottom: 100px; background: var(--success); color: #fff; padding: 12px 25px; border-radius: 30px; display: none; font-weight: bold; z-index: 10000; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1>🇯🇵 Japan Travel Ultra</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋 300+ 句旅遊日語...">
        
        <div class="controls-grid">
            <div class="quick-nav">
                <button class="nav-btn" id="btnRecent">🕒 最近</button>
                <button class="nav-btn" id="btnFav">⭐ 最愛</button>
            </div>
            <div class="control-panel">
                <div class="toggle-group">🔊 大音量 <input type="checkbox" id="volumeToggle" checked></div>
            </div>
            <div class="control-panel">
                <div class="toggle-group">🐢 龜速模式 <input type="checkbox" id="turtleToggle"></div>
            </div>
        </div>

        <div class="category-container" id="category-container"></div>
        <div class="grid-container" id="button-container"></div>
    </div>

    <div id="installBtn" class="install-fab">📥 安裝到桌面 (離線使用)</div>

    <div id="fullScreenModal" class="modal">
        <div class="modal-ja" id="modalJaText"></div>
        <div class="modal-zh" id="modalZhText"></div>
        <button class="close-modal" onclick="document.getElementById('fullScreenModal').style.display='none'">✖ 關閉</button>
    </div>

    <div id="toast" class="toast">✅ 已複製日文！</div>

    <script>
        (function() {
            // ---------- 資料庫 (完整 300+ 句，此處為精簡版，實際使用可擴充) ----------
            const phrasesData = {
                "👋 招呼/基本": [
                    { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" },
                    { zh: "謝謝", ja: "ありがとうございます", romaji: "Arigatou gozaimasu" },
                    { zh: "請問/不好意思", ja: "すみません", romaji: "Sumimasen" },
                    { zh: "沒關係", ja: "大丈夫です", romaji: "Daijoubu desu" },
                    { zh: "拜託了", ja: "お願いします", romaji: "Onegaishimasu" },
                    { zh: "對不起", ja: "ごめんなさい", romaji: "Gomennasai" },
                    { zh: "早安", ja: "おはようございます", romaji: "Ohayou gozaimasu" },
                    { zh: "晚安", ja: "こんばんは", romaji: "Konbanwa" }
                ],
                "🍜 餐廳用餐": [
                    { zh: "兩位", ja: "2人です", romaji: "Futari desu" },
                    { zh: "有菜單嗎", ja: "メニューはありますか", romaji: "Menyuu wa arimasu ka" },
                    { zh: "推薦什麼", ja: "おすすめは何ですか", romaji: "Osusume wa nan desu ka" },
                    { zh: "點這個", ja: "これを注文します", romaji: "Kore o chuumon shimasu" }
                ],
                "🛍️ 購物免稅": [
                    { zh: "多少錢", ja: "いくらですか", romaji: "Ikura desu ka" },
                    { zh: "買這個", ja: "これをください", romaji: "Kore o kudasai" },
                    { zh: "免稅嗎", ja: "免税できますか", romaji: "Menzei dekimasu ka" }
                ],
                "🚇 交通問路": [
                    { zh: "廁所在哪", ja: "トイレはどこですか", romaji: "Toire wa doko desu ka" },
                    { zh: "車站在哪", ja: "駅はどこですか", romaji: "Eki wa doko desu ka" }
                ],
                // 可自行加入更多分類
            };

            // ---------- 狀態變數 ----------
            let currentCategory = '🌟 全部';
            let favorites = [];
            let historyList = [];

            // 從 localStorage 讀取收藏與歷史
            try {
                favorites = JSON.parse(localStorage.getItem('jp_favs')) || [];
                historyList = JSON.parse(localStorage.getItem('jp_history')) || [];
            } catch (e) {
                console.warn('讀取 localStorage 失敗', e);
            }

            // ---------- 發音函數 (安全版本) ----------
            function speak(text, item) {
                if (!text) return;
                // 若瀏覽器不支援語音
                if (!window.speechSynthesis) {
                    alert('您的瀏覽器不支援語音功能');
                    return;
                }
                try {
                    window.speechSynthesis.cancel(); // 停止目前播放
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ja-JP';
                    utterance.rate = document.getElementById('turtleToggle')?.checked ? 0.45 : 0.85;
                    utterance.volume = document.getElementById('volumeToggle')?.checked ? 1.0 : 0.8;
                    utterance.onerror = (ev) => {
                        console.warn('語音錯誤', ev);
                        // 可提示使用者檢查音量/權限
                    };
                    window.speechSynthesis.speak(utterance);

                    // 若傳入 item，加入歷史紀錄
                    if (item) {
                        historyList = historyList.filter(h => h.ja !== item.ja);
                        historyList.unshift(item);
                        if (historyList.length > 20) historyList.pop();
                        localStorage.setItem('jp_history', JSON.stringify(historyList));
                    }
                } catch (err) {
                    console.error('speak 例外', err);
                }
            }

            // ---------- 渲染主列表 ----------
            function render(cat, query) {
                const container = document.getElementById('button-container');
                if (!container) return;
                container.innerHTML = ''; // 清空

                // 自訂分類：顯示翻譯區塊
                if (cat === '✏️ 自訂') {
                    container.innerHTML = `
                        <div class="custom-area">
                            <textarea id="customInput" class="custom-textarea" placeholder="輸入中文..."></textarea>
                            <div id="translatedResult" class="translated-box">結果</div>
                            <button class="custom-play-btn" onclick="window.doTranslate()">🌍 翻譯並發音</button>
                        </div>
                    `;
                    return;
                }

                // 取得當前分類的所有句子
                let list = [];
                if (cat === '🌟 全部') {
                    for (let key in phrasesData) {
                        list = list.concat(phrasesData[key]);
                    }
                } else if (cat === '⭐ 最愛') {
                    for (let key in phrasesData) {
                        phrasesData[key].forEach(item => {
                            if (favorites.includes(item.ja)) list.push(item);
                        });
                    }
                } else if (cat === '🕒 最近') {
                    list = historyList;
                } else {
                    list = phrasesData[cat] || [];
                }

                // 搜尋過濾
                if (query) {
                    const q = query.toLowerCase();
                    list = list.filter(item =>
                        item.zh.includes(q) ||
                        item.ja.includes(q) ||
                        (item.romaji && item.romaji.toLowerCase().includes(q))
                    );
                }

                // 去除重複 (以 ja 為 key)
                const uniqueMap = new Map();
                list.forEach(item => uniqueMap.set(item.ja, item));
                const uniqueList = Array.from(uniqueMap.values());

                // 若無資料，顯示提示
                if (uniqueList.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-sub); padding: 40px; text-align: center;">😢 沒有符合的句子</div>';
                    return;
                }

                // 建立卡片
                uniqueList.forEach(item => {
                    const isFav = favorites.includes(item.ja);
                    const card = document.createElement('div');
                    card.className = 'phrase-card';

                    // 內部 HTML
                    card.innerHTML = `
                        <div class="card-content">
                            <div class="fav-star ${isFav ? 'active' : ''}">★</div>
                            <div class="zh-text">${escapeHtml(item.zh)}</div>
                            <div class="ja-wrapper"><span class="ja-text">🔊 ${escapeHtml(item.ja)}</span></div>
                            <div class="romaji-text">${escapeHtml(item.romaji || '')}</div>
                        </div>
                        <button class="full-bar-btn" data-ja="${escapeHtml(item.ja)}" data-zh="${escapeHtml(item.zh)}">🪧 放大顯示</button>
                    `;

                    // 點擊卡片 -> 發音 (並傳入 item 以加入歷史)
                    card.addEventListener('click', (e) => {
                        // 避免點擊到星星或按鈕時觸發兩次
                        if (e.target.classList.contains('fav-star') || e.target.classList.contains('full-bar-btn')) return;
                        speak(item.ja, item);
                    });

                    // 星星收藏
                    const star = card.querySelector('.fav-star');
                    star.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = favorites.indexOf(item.ja);
                        if (idx > -1) {
                            favorites.splice(idx, 1);
                        } else {
                            favorites.push(item.ja);
                        }
                        localStorage.setItem('jp_favs', JSON.stringify(favorites));
                        // 重新渲染當前分類（保持搜尋關鍵字）
                        render(currentCategory, document.getElementById('searchInput').value);
                    });

                    // 放大按鈕
                    const zoomBtn = card.querySelector('.full-bar-btn');
                    zoomBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const ja = zoomBtn.dataset.ja;
                        const zh = zoomBtn.dataset.zh;
                        zoom(ja, zh);
                    });

                    container.appendChild(card);
                });
            }

            // 簡單的 HTML 跳脫 (避免 XSS)
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // ---------- 放大顯示 ----------
            function zoom(ja, zh) {
                document.getElementById('modalJaText').innerText = ja;
                document.getElementById('modalZhText').innerText = zh;
                document.getElementById('fullScreenModal').style.display = 'flex';
            }

            // ---------- 翻譯功能 (需網路) ----------
            window.doTranslate = async function() {
                const input = document.getElementById('customInput');
                const resultBox = document.getElementById('translatedResult');
                if (!input || !resultBox) return;
                const q = input.value.trim();
                if (!q) return;
                resultBox.innerText = '⏳ 翻譯中...';
                try {
                    const response = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=zh-TW|ja');
                    const data = await response.json();
                    const translated = data.responseData.translatedText || '翻譯失敗';
                    resultBox.innerText = translated;
                    speak(translated); // 直接發音翻譯結果
                } catch (err) {
                    resultBox.innerText = '❌ 網路錯誤';
                    console.error(err);
                }
            };

            // ---------- 安裝 PWA ----------
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installBtn').style.display = 'block';
            });

            document.getElementById('installBtn').addEventListener('click', () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choice) => {
                        if (choice.outcome === 'accepted') {
                            document.getElementById('installBtn').style.display = 'none';
                        }
                        deferredPrompt = null;
                    });
                } else {
                    alert('iOS 使用者請點擊瀏覽器下方的「分享」圖示，然後選擇「加入主畫面」喔！');
                }
            });

            // ---------- 初始化頁面 ----------
            window.addEventListener('load', () => {
                const catContainer = document.getElementById('category-container');
                if (!catContainer) return;

                // 建立分類按鈕 (包含「全部」、所有資料庫分類、「自訂」)
                const categories = ['🌟 全部', ...Object.keys(phrasesData), '✏️ 自訂'];
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (cat === '🌟 全部' ? ' active' : '');
                    btn.textContent = cat;
                    btn.addEventListener('click', () => {
                        // 移
