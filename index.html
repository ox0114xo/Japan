<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日文語音系統 v2.1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* 未來科技感 UI 變數 */
        :root { 
            --bg-dark: #0f172a; 
            --neon-blue: #00f0ff; 
            --neon-purple: #b026ff;
            --neon-green: #39ff14;
            --btn-depth: #0369a1; /* 鍵盤底部陰影顏色 */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }
        
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%); color: var(--text-main); padding: 15px; max-width: 600px; margin: 0 auto; line-height: 1.6; padding-bottom: 90px; min-height: 100vh; }
        
        h1 { text-align: center; color: #fff; text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); font-size: 26px; margin: 10px 0 20px 0; user-select: none; cursor: pointer; letter-spacing: 2px;}
        
        /* 搜尋列 */
        .search-box { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--neon-purple); border-radius: 8px; font-size: 16px; color: #fff; box-sizing: border-box; transition: 0.3s; }
        .search-box:focus { outline: none; box-shadow: 0 0 15px var(--neon-purple); }
        .search-box::placeholder { color: #64748b; }

        /* 分類按鈕區 */
        .category-scroll { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 8px; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { white-space: nowrap; background: rgba(0,0,0,0.5); color: var(--text-muted); border: 1px solid #334155; padding: 10px 20px; border-radius: 30px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;}
        .cat-btn.active { background: rgba(0, 240, 255, 0.1); color: var(--neon-blue); border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); font-weight: bold; }

        /* 語速滑桿 (全寬) */
        .slider-container { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 25px; }
        .speed-slider { flex: 1; -webkit-appearance: none; background: #334155; height: 4px; border-radius: 2px; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; box-shadow: 0 0 10px var(--neon-blue); }

        /* 機械鍵盤效果列表 */
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px; 
            margin-bottom: 20px; 
            padding: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer;
            /* 3D 陰影效果：底部厚度與外掛陰影 */
            box-shadow: 0 6px 0 var(--btn-depth), 0 10px 15px rgba(0,0,0,0.5);
            transform: translateY(0);
            transition: transform 0.1s, box-shadow 0.1s, background 0.2s; 
            position: relative;
        }
        
        /* 按下時的下壓回饋 */
        li:active { 
            transform: translateY(6px); /* 往下壓 6px */
            box-shadow: 0 0 0 var(--btn-depth), 0 2px 4px rgba(0,0,0,0.5); /* 底部厚度消失 */
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border-color: var(--neon-blue);
        }
        
        /* 視覺引導：發聲圖示 */
        .play-indicator {
            font-size: 24px;
            margin-right: 15px;
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            opacity: 0.8;
        }

        .text-content { flex: 1; margin-right: 10px; z-index: 1; }
        .jp-text { font-size: 18px; font-weight: bold; color: #fff; display: block; margin-bottom: 4px; letter-spacing: 0.5px;}
        .romaji-text { font-size: 12px; color: var(--neon-blue); font-family: monospace; display: block; margin-bottom: 6px; }
        .zh-text { font-size: 14px; color: var(--text-muted); display: block; }

        /* 右側動作按鈕 */
        .action-group { display: flex; gap: 10px; z-index: 1; align-items: center; }
        .icon-btn { background: rgba(0,0,0,0.3); border: 1px solid #334155; border-radius: 6px; font-size: 18px; color: #64748b; cursor: pointer; padding: 8px; transition: 0.2s; display: flex; justify-content: center; align-items: center;}
        .icon-btn.star.active { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.1); }
        .icon-btn.fullscreen { color: var(--neon-blue); }
        
        /* 避免子按鈕被點擊時，連帶觸發整個 li 的下壓動畫 */
        .action-group .icon-btn:active { transform: scale(0.9); }

        /* 全螢幕字幕覆蓋層 */
        #fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: var(--neon-green); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; font-family: monospace; }
        #fullscreen-jp { font-size: 12vw; font-weight: bold; margin-bottom: 15px; width: 100%; word-wrap: break-word; text-shadow: 0 0 20px var(--neon-green); }
        #fullscreen-romaji { font-size: 6vw; color: #fff; margin-bottom: 20px; opacity: 0.8; }
        #fullscreen-zh { font-size: 6vw; color: var(--text-muted); }
        .close-fullscreen { position: absolute; top: 20px; right: 20px; font-size: 30px; color: #fff; background: none; border: none; cursor: pointer; padding: 10px; z-index: 10001; }
        .replay-btn-large { margin-top: 40px; background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 15px 40px; font-size: 20px; border-radius: 8px; cursor: pointer; font-family: monospace; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;}
        .replay-btn-large:active { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        /* 懸浮自定義按鈕 */
        .fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--neon-purple), #4f46e5); color: white; border: none; padding: 16px 32px; border-radius: 30px; font-size: 16px; font-weight: bold; box-shadow: 0 10px 25px rgba(176, 38, 255, 0.4); z-index: 900; width: 90%; max-width: 400px; cursor: pointer; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; }
        .fab:active { transform: translateX(-50%) scale(0.95); }

        /* 讀取動畫 */
        .loader-container { display: flex; justify-content: center; align-items: center; padding: 40px; flex-direction: column; gap: 15px; }
        .tech-spinner { width: 40px; height: 40px; border: 3px solid transparent; border-top-color: var(--neon-blue); border-bottom-color: var(--neon-purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 模態框 (Modal) */
        #translate-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-dark); border: 1px solid var(--neon-blue); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; color: #fff;}
        .modal-content input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; box-sizing: border-box; }
        .modal-content input:focus { outline: none; border-color: var(--neon-blue); }
        .modal-content button { width: 100%; background: var(--neon-blue); color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* 蓋板與彩蛋 */
        #in-app-blocker { display: none; position: fixed; inset: 0; background: #000; color: #fff; z-index: 99999; text-align: center; padding: 60px 20px; }
        #easter-egg { display: none; background: rgba(255, 0, 0, 0.1); border-left: 4px solid red; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="in-app-blocker">
        <h2 style="color: var(--neon-green);">⚠️ 系統攔截</h2>
        <p>偵測到內建瀏覽器，語音引擎無法啟動。</p>
        <p>👉 <b>請點選單「以預設瀏覽器開啟」</b></p>
    </div>

    <div id="fullscreen-overlay">
        <button class="close-fullscreen" onclick="closeFullscreen()">✕</button>
        <div id="fullscreen-jp"></div>
        <div id="fullscreen-romaji"></div>
        <div id="fullscreen-zh"></div>
        <button class="replay-btn-large" onclick="replayFullscreen()">► Replay</button>
    </div>

    <h1 id="app-title">NEO_JP_VOICE 🇯🇵</h1>

    <input type="text" id="search-input" class="search-box" placeholder="輸入中文、日文或羅馬音進行深度檢索..." onkeyup="filterData()">

    <div class="category-scroll" id="category-container"></div>

    <div class="slider-container">
        <span style="font-size: 14px; color: var(--text-muted);">⚙️ 系統語速</span>
        <input type="range" id="speed-slider" class="speed-slider" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateSpeedVal()">
        <span id="speed-val" style="font-family: monospace; color: var(--neon-blue); width: 35px; text-align: right;">1.0x</span>
    </div>

    <div id="easter-egg">
        <h3 style="color: #ff3333; margin: 0 0 10px 0;">[ 隱藏權限已解鎖 ]</h3>
        <ul id="swear-list">
            <li onclick="speak('ふざけるな')">
                <div class="play-indicator">🔊</div>
                <div class="text-content"><span class="jp-text">ふざけるな</span><span class="zh-text">別開玩笑了</span></div>
            </li>
            <li onclick="speak('だまれ')">
                <div class="play-indicator">🔊</div>
                <div class="text-content"><span class="jp-text">だまれ</span><span class="zh-text">閉嘴</span></div>
            </li>
        </ul>
    </div>

    <div id="loading" class="loader-container">
        <div class="tech-spinner"></div>
        <span style="color: var(--neon-blue); font-family: monospace;">連線資料庫中...</span>
    </div>

    <ul id="sentence-list"></ul>

    <button class="fab" onclick="document.getElementById('translate-modal').style.display='flex'">
        <span>⚡</span> 啟動自定義翻譯引擎
    </button>

    <div id="translate-modal">
        <div class="modal-content">
            <button class="close-fullscreen" style="top:5px; right:5px; color:#64748b;" onclick="document.getElementById('translate-modal').style.display='none'">✕</button>
            <h3 style="margin-top: 0; color: var(--neon-blue);">自譯引擎啟動</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">輸入中文，系統將自動翻譯並進行日文語音合成。</p>
            <input type="text" id="translate-input" placeholder="請輸入欲翻譯之中文...">
            <button onclick="translateAndSpeak()" id="translate-btn">執行翻譯與發音</button>
            <div id="translate-result" style="margin-top: 15px; font-weight: bold; color: var(--neon-green); text-align: center; font-size: 18px;"></div>
        </div>
    </div>

    <script>
        // --- 核心變數 ---
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv';
        let globalData = [];
        let currentCategory = '全部';
        let clickCount = 0;
        let favorites = JSON.parse(localStorage.getItem('jp_favorites')) || [];

        if (/(Line|FBAN|FBAV|Instagram)/i.test(navigator.userAgent)) {
            document.getElementById('in-app-blocker').style.display = 'block';
        }

        // --- 彩蛋解鎖 ---
        document.getElementById('app-title').addEventListener('click', () => {
            clickCount++;
            if (clickCount === 10) {
                document.getElementById('easter-egg').style.display = 'block';
                alert('⚠️ 警告：已覆蓋系統安全協議，進入隱藏模式。');
            }
        });

        // --- 語速控制 ---
        function updateSpeedVal() {
            const val = document.getElementById('speed-slider').value;
            document.getElementById('speed-val').innerText = Number(val).toFixed(1) + 'x';
        }

        // --- 精簡後的語音核心引擎 ---
        function speak(text) {
            if (!('speechSynthesis' in window)) return alert("引擎不支援");
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            // 移除強制最大音量，交還給設備預設
            utterance.rate = parseFloat(document.getElementById('speed-slider').value);
            
            utterance.onerror = (e) => {
                if(e.error === 'not-allowed') {
                    alert('系統阻擋自動播放，請先手動點擊螢幕任意處。');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- 我的最愛 (書籤) 功能 ---
        function toggleFavorite(event, jp) {
            event.stopPropagation(); // 防止觸發整塊發音
            const index = favorites.indexOf(jp);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(jp);
            }
            localStorage.setItem('jp_favorites', JSON.stringify(favorites));
            filterData(); // 重新整理畫面
        }

        // --- 全螢幕字幕 ---
        function openFullscreen(event, jp, zh, romaji) {
            event.stopPropagation(); // 防止觸發整塊發音
            document.getElementById('fullscreen-jp').innerText = jp;
            document.getElementById('fullscreen-romaji').innerText = romaji || '';
            document.getElementById('fullscreen-zh').innerText = zh;
            document.getElementById('fullscreen-overlay').style.display = 'flex';
            speak(jp);
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
            window.speechSynthesis.cancel();
        }

        function replayFullscreen() {
            const jp = document.getElementById('fullscreen-jp').innerText;
            if(jp) speak(jp);
        }

        // --- 讀取資料庫 (帶有快取機制) ---
        async function loadCSV() {
            const cachedData = localStorage.getItem('jp_csv_cache');
            if (cachedData) processData(cachedData);

            try {
                const res = await fetch(CSV_URL);
                const csvText = await res.text();
                
                if (csvText !== cachedData) {
                    localStorage.setItem('jp_csv_cache', csvText);
                    processData(csvText);
                }
            } catch(e) {
                if(!cachedData) document.getElementById('loading').innerHTML = "連線失敗，請檢查網路。";
            }
        }

        function processData(csvText) {
            const rows = csvText.split('\n');
            const categoriesSet = new Set(['全部', '⭐最愛']);
            globalData = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].trim();
                if(!row) continue;
                const cols = row.split(',');
                if (cols.length >= 3) {
                    globalData.push({ 
                        cat: cols[0] || '未分類', 
                        zh: cols[1], 
                        jp: cols[2], 
                        romaji: cols[3] || '' 
                    });
                    categoriesSet.add(cols[0] || '未分類');
                }
            }
            renderCategories(Array.from(categoriesSet));
            filterData();
            document.getElementById('loading').style.display = 'none';
        }

        // --- 渲染分類 ---
        function renderCategories(cats) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === currentCategory ? 'active' : ''}`;
                btn.innerText = cat;
                if(cat === '⭐最愛') btn.style.color = '#fbbf24';
                
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterData();
                };
                container.appendChild(btn);
            });
        }

        // --- 篩選與渲染列表 ---
        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            const filteredData = globalData.filter(item => {
                const isFav = favorites.includes(item.jp);
                let matchCat = false;
                if (currentCategory === '全部') matchCat = true;
                else if (currentCategory === '⭐最愛') matchCat = isFav;
                else matchCat = item.cat === currentCategory;

                const matchQuery = item.zh.toLowerCase().includes(query) || 
                                   item.jp.toLowerCase().includes(query) || 
                                   item.romaji.toLowerCase().includes(query);
                
                return matchCat && matchQuery;
            });
            
            renderList(filteredData);
        }

        // --- 渲染成機械鍵盤樣式 ---
        function renderList(dataToRender) {
            const list = document.getElementById('sentence-list');
            list.innerHTML = '';
            if(dataToRender.length === 0) {
                list.innerHTML = '<li style="justify-content:center; color:var(--text-muted); box-shadow:none; cursor:default;">無符合之資料</li>';
                return;
            }

            dataToRender.forEach(item => {
                const li = document.createElement('li');
                const safeJp = item.jp.replace(/'/g, "\\'");
                const safeZh = item.zh.replace(/'/g, "\\'");
                const safeRomaji = item.romaji.replace(/'/g, "\\'");
                const isFav = favorites.includes(item.jp);

                li.onclick = () => speak(item.jp);
                
                li.innerHTML = `
                    <div class="play-indicator">🔊</div>
                    <div class="text-content">
                        <span class="jp-text">${item.jp}</span>
                        ${item.romaji ? `<span class="romaji-text">${item.romaji}</span>` : ''}
                        <span class="zh-text">${item.zh}</span>
                    </div>
                    <div class="action-group">
                        <button class="icon-btn star ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeJp}')">★</button>
                        <button class="icon-btn fullscreen" onclick="openFullscreen(event, '${safeJp}', '${safeZh}', '${safeRomaji}')">⛶</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // --- 自定義翻譯引擎 ---
        async function translateAndSpeak() {
            const input = document.getElementById('translate-input').value.trim();
            const btn = document.getElementById('translate-btn');
            const resDiv = document.getElementById('translate-result');
            if (!input) return;

            btn.innerText = "資料解析中...";
            btn.style.background = "#4f46e5";
            btn.d
