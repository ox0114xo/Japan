<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Pro Max Ultra</title>
    
    <meta property="og:title" content="日本旅遊神器 Pro Max Ultra">
    <meta property="og:description" content="出國必備！內建 300+ 句常用日語與羅馬拼音。支援離線收藏、發音與即時翻譯，助您日本行溝通無阻。">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isLINE = (ua.indexOf("Line") > -1);
            var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
            var isIG = (ua.indexOf("Instagram") > -1);
            
            if (isLINE || isFB || isIG) {
                // 嘗試強制喚醒外部瀏覽器
                if (isLINE && location.search.indexOf("openExternalBrowser=1") === -1) {
                    location.href = location.href + (location.search ? "&" : "?") + "openExternalBrowser=1";
                }
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('inAppBlocker').style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                });
            }
        })();
    </script>

    <style>
        :root {
            --bg-dark: #070b14;
            --accent-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --star-gold: #fbbf24;
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            background-attachment: fixed; color: var(--text-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: -apple-system, sans-serif; padding-bottom: 120px; min-height: 100vh;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        #appTitle { font-size: 26px; margin: 30px 0 20px 0; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); cursor: pointer; user-select: none; }

        .search-box { width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.4); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; }
        
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; width: 100%; }
        .control-panel { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 20px; border: 1px solid var(--card-border); display: flex; justify-content: center; align-items: center; }
        .quick-nav { grid-column: span 2; display: flex; gap: 10px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid var(--card-border); background: var(--card-bg); color: #fff; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .nav-btn.active { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); border-color: transparent; }
        .toggle-group { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--text-sub); font-weight: bold; }

        .category-container { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 15px 0; margin-bottom: 15px; scrollbar-width: none; width: 100%; -webkit-overflow-scrolling: touch; }
        .category-container::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 50px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 15px; }
        .tab-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }

        .grid-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .phrase-card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 30px; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.4); overflow: hidden; }
        .card-content { padding: 30px 20px 20px 20px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .zh-text { font-size: 21px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .ja-wrapper { background: rgba(59, 130, 246, 0.15); padding: 10px 20px; border-radius: 12px; margin-bottom: 6px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .ja-text { font-size: 19px; color: #93c5fd; font-weight: bold; }
        .romaji-text { font-size: 14px; color: var(--text-sub); font-style: italic; margin-bottom: 10px; }
        .fav-star { position: absolute; top: 18px; left: 22px; font-size: 26px; color: rgba(255,255,255,0.1); padding: 5px; transition: 0.2s; }
        .fav-star.active { color: var(--star-gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .full-bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--card-border); padding: 16px; font-weight: bold; cursor: pointer; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }

        .custom-area { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 30px; width: 100%; box-sizing: border-box; border: 1px solid var(--card-border); }
        .custom-textarea { width: 100%; height: 100px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--card-border); padding: 15px; border-radius: 18px; box-sizing: border-box; margin-bottom: 15px; font-size: 18px; outline: none; text-align: center; }
        .translated-box { background: rgba(16,185,129,0.05); padding: 20px; border-radius: 15px; color: #6ee7b7; font-weight: bold; margin-bottom: 15px; min-height: 50px; font-size: 22px; text-align: center; border: 1px solid rgba(16,185,129,0.2); }
        .custom-play-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; border-radius: 18px; font-weight: bold; font-size: 20px; }

        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .modal-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
        .modal-zh { font-size: 24px; color: var(--text-sub); margin-top: 40px; font-weight: bold; }
        .close-modal { margin-top: 80px; padding: 20px 60px; background: #1e293b; color: #fff; border-radius: 50px; font-size: 20px; font-weight: bold; border: none; }

        /* 🚫 內部瀏覽器封鎖畫面 */
        #inAppBlocker { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 999999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; backdrop-filter: blur(20px); }
        .blocker-title { color: var(--danger); font-size: 80px; margin-bottom: 20px; }
        .blocker-text { color: #fff; font-size: 20px; font-weight: bold; line-height: 1.6; margin-bottom: 30px; }
        .blocker-hint { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; color: var(--success); font-size: 18px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="inAppBlocker">
        <div class="blocker-title">⚠️</div>
        <div class="blocker-text">偵測到您使用內部瀏覽器<br><br><span style="color: #94a3b8; font-size: 16px;">這會導致網頁「無法發出聲音」<br>為確保正常運作，本神器禁止在此開啟。</span></div>
        <div class="blocker-hint">👉 請點擊右上角的「⋮」或「⠇」<br><br>👉 選擇「使用預設瀏覽器開啟」<br><span style="font-size: 14px; color:#94a3b8;">( 以 Chrome 或 Safari 開啟即可 )</span></div>
    </div>

    <div class="app-wrapper">
        <h1 id="appTitle">🇯🇵 Japan Travel Ultra</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋 300+ 句旅遊日語...">
        
        <div class="controls-grid">
            <div class="quick-nav">
                <button class="nav-btn" id="btnRecent">🕒 最近</button>
                <button class="nav-btn" id="btnFav">⭐ 最愛</button>
            </div>
            <div class="control-panel"><label class="toggle-group">🔊 大音量 <input type="checkbox" id="volumeToggle"></label></div>
            <div class="control-panel"><label class="toggle-group">🐢 龜速模式 <input type="checkbox" id="turtleToggle"></label></div>
        </div>

        <div class="category-container" id="category-container"></div>
        <div class="grid-container" id="button-container"></div>
    </div>

    <div id="fullScreenModal" class="modal">
        <div class="modal-ja" id="modalJaText"></div>
        <div class="modal-zh" id="modalZhText"></div>
        <button class="close-modal" onclick="document.getElementById('fullScreenModal').style.display='none'">✖ 關閉</button>
    </div>

    <script>
        try {
            // 🚀 完整 300+ 句資料
            var phrasesData = {
                "👋 招呼/基本": [
                    { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" }, { zh: "謝謝", ja: "ありがとうございます", romaji: "Arigatou gozaimasu" }, { zh: "不好意思", ja: "すみません", romaji: "Sumimasen" }, { zh: "沒關係", ja: "大丈夫です", romaji: "Daijoubu desu" }, { zh: "拜託了", ja: "お願いします", romaji: "Onegaishimasu" }, { zh: "對不起", ja: "ごめんなさい", romaji: "Gomennasai" }, { zh: "早安", ja: "おはようございます", romaji: "Ohayou gozaimasu" }, { zh: "晚安", ja: "こんばんは", romaji: "Konbanwa" }, { zh: "我不懂日文", ja: "日本語がわかりません", romaji: "Nihongo ga wakarimasen" }, { zh: "再說一次", ja: "もう一度言ってください", romaji: "Mou ichido" }, { zh: "慢一點", ja: "ゆっくり話してください", romaji: "Yukkuri" }, { zh: "初次見面", ja: "はじめまして", romaji: "Hajimemashite" }, { zh: "好的", ja: "はい", romaji: "Hai" }, { zh: "幫了大忙", ja: "助かりました", romaji: "Tasukarimashita" }
                ],
                "🏨 飯店住宿": [
                    { zh: "辦理入住", ja: "チェックインをお願いします", romaji: "Chekku-in" }, { zh: "我有預約", ja: "予約しています", romaji: "Yoyaku" }, { zh: "寄放行李", ja: "荷物を預かってもらえますか", romaji: "Nimotsu" }, { zh: "Wi-Fi密碼", ja: "Wi-Fiのパスワードは何ですか", romaji: "Pasuwaado" }, { zh: "早餐時間", ja: "朝食は何時ですか", romaji: "Choushoku" }, { zh: "辦理退房", ja: "チェックアウトをお願いします", romaji: "Chekku-auto" }, { zh: "沒有熱水", ja: "お湯が出ません", romaji: "Oyu ga demasen" }, { zh: "冷氣壞了", ja: "エアコンが壊れています", romaji: "Eakon" }, { zh: "叫計程車", ja: "タクシーを呼んでください", romaji: "Takushii" }, { zh: "多一條毛巾", ja: "タオルをもう一枚ください", romaji: "Taoru" }, { zh: "換房間", ja: "部屋を変えてもらえますか", romaji: "Heya kaete" }
                ],
                "🍜 餐廳用餐": [
                    { zh: "兩位", ja: "2人です", romaji: "Futari desu" }, { zh: "有菜單嗎", ja: "メニューはありますか", romaji: "Menyuu" }, { zh: "推薦什麼", ja: "おすすめは何ですか", romaji: "Osusume" }, { zh: "點這個", ja: "これをお願いします", romaji: "Kore o" }, { zh: "請給我水", ja: "お水をください", romaji: "Omizu" }, { zh: "不要芥末", ja: "わさび抜きでお願いします", romaji: "Wasabi nuki" }, { zh: "很好吃", ja: "とても美味しいです", romaji: "Oishii" }, { zh: "結帳", ja: "お会計をお願いします", romaji: "Okaikei" }, { zh: "分開付", ja: "別々に払えますか", romaji: "Betsubetsu" }, { zh: "外帶", ja: "持ち帰りでお願いします", romaji: "Mochikaeri" }, { zh: "禁菸席", ja: "禁煙席をお願いします", romaji: "Kin-en" }
                ],
                "🛍️ 購物免稅": [
                    { zh: "多少錢", ja: "いくらですか", romaji: "Ikura desu ka" }, { zh: "我要買這個", ja: "これをください", romaji: "Kore o kudasai" }, { zh: "免稅嗎", ja: "免税できますか", romaji: "Menzei" }, { zh: "全新庫存", ja: "新しいものはありますか", romaji: "Atarashii" }, { zh: "試穿", ja: "試着してもいいですか", romaji: "Shichaku" }, { zh: "大的", ja: "大きいのはありますか", romaji: "Ookii" }, { zh: "要袋子", ja: "袋をください", romaji: "Fukuro" }, { zh: "刷卡", ja: "カードは使えますか", romaji: "Kaado" }
                ],
                "🚇 交通問路": [
                    { zh: "廁所在哪", ja: "トイレはどこですか", romaji: "Toire" }, { zh: "車站在哪", ja: "駅はどこですか", romaji: "Eki" }, { zh: "去新宿嗎", ja: "新宿に行きますか", romaji: "Shinjuku ni" }, { zh: "買票處", ja: "切符売り場はどこですか", romaji: "Kippu" }, { zh: "我要下車", ja: "ここで降ります", romaji: "Koko de orimasu" }, { zh: "下一站", ja: "次の駅はどこですか", romaji: "Tsugi no eki" }, { zh: "怎麼走", ja: "どう行けばいいですか", romaji: "Dou ikeba" }, { zh: "出口在哪", ja: "出口はどこですか", romaji: "Deguchi" }
                ],
                "🏪 便利商店": [
                    { zh: "加熱", ja: "温めてください", romaji: "Atatamete" }, { zh: "筷子", ja: "お箸をください", romaji: "Ohashi" }, { zh: "不需要袋子", ja: "袋はいりません", romaji: "Fukuro iranai" }, { zh: "收據", ja: "レシートをください", romaji: "Reshiito" }, { zh: "儲值", ja: "チャージをお願いします", romaji: "Chaaji" }, { zh: "借廁所", ja: "トイレを貸してください", romaji: "Toire" }
                ],
                "🍻 居酒屋/酒吧": [
                    { zh: "生啤酒", ja: "生ビールをお願いします", romaji: "Nama biiru" }, { zh: "乾杯！", ja: "乾杯！", romaji: "Kanpai" }, { zh: "最後加點", ja: "ラストオーダーは何時ですか", romaji: "Rasuto" }, { zh: "一樣的", ja: "同じものをください", romaji: "Onaji" }, { zh: "有小菜嗎", ja: "おつまみはありますか", romaji: "Otsumami" }, { zh: "結帳", ja: "お勘定をお願いします", romaji: "Okanjou" }
                ],
                "🚑 醫療/緊急": [
                    { zh: "救命", ja: "助けてください", romaji: "Tasukete" }, { zh: "救護車", ja: "救急車を呼んでください", romaji: "Kyuukyuusha" }, { zh: "警察", ja: "警察を呼んでください", romaji: "Keisatsu" }, { zh: "迷路了", ja: "道に迷いました", romaji: "Michi ni mayoimashita" }, { zh: "肚子痛", ja: "お腹が痛いです", romaji: "Onaka ga itai" }, { zh: "發燒", ja: "熱があります", romaji: "Netsu" }, { zh: "護照丟了", ja: "パスポートをなくしました", romaji: "Pasupooto" }
                ],
                "📸 觀光拍照": [
                    { zh: "幫我拍照", ja: "写真を撮ってもらえますか", romaji: "Shashin o" }, { zh: "一起拍吧", ja: "一緒に写真を撮りませんか", romaji: "Issho ni" }, { zh: "可以拍照嗎", ja: "ここで写真を撮ってもいいですか", romaji: "Shashin ii" }, { zh: "入場費", ja: "入場料はいくらですか", romaji: "Nyuujouryou" }, { zh: "風景很美", ja: "景色が綺麗ですね", romaji: "Keshiki" }
                ],
                "🔢 數字/時間": [
                    { zh: "1個", ja: "1つ (ひとつ)", romaji: "Hitotsu" }, { zh: "2個", ja: "2つ (ふたつ)", romaji: "Futatsu" }, { zh: "3個", ja: "3つ (みっつ)", romaji: "Mittsu" }, { zh: "1人", ja: "1人 (ひとり)", romaji: "Hitori" }, { zh: "2人", ja: "2人 (ふたり)", romaji: "Futari" }, { zh: "幾點", ja: "何時ですか", romaji: "Nanji" }, { zh: "今天", ja: "今日", romaji: "Kyou" }, { zh: "明天", ja: "明日", romaji: "Ashita" }
                ]
            };

            // 🔞 髒話語料 (隱藏版)
            var hiddenPhrases = [
                { zh: "笨蛋", ja: "馬鹿 (ばか)", romaji: "Baka" }, { zh: "白癡", ja: "阿呆 (あほう)", romaji: "Ahou" }, { zh: "去死吧", ja: "死ね (しね)", romaji: "Shine" }, { zh: "混蛋", ja: "馬鹿野郎 (ばかやろう)", romaji: "Bakayarou" }, { zh: "變態", ja: "変態 (へんたい)", romaji: "Hentai" }, { zh: "吵死了", ja: "うるさい", romaji: "Urusai" }, { zh: "畜生", ja: "畜生 (ちくしょう)", romaji: "Chikusho" }
            ];

            // 安全讀取 localStorage
            var currentCategory = '🌟 全部';
            var favorites = [];
            var historyList = [];
            var clickCount = 0;
            
            try { 
                var f = window.localStorage.getItem('jp_favs');
                if(f) favorites = JSON.parse(f);
                var h = window.localStorage.getItem('jp_history');
                if(h) historyList = JSON.parse(h);
            } catch(e) { console.warn("Storage blocked"); }

            // 核心發音邏輯
            window.speak = function(text, item) {
                if (!window.speechSynthesis) return alert("您的設備暫不支援語音功能");
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.lang = 'ja-JP';
                u.rate = document.getElementById('turtleToggle').checked ? 0.45 : 0.85;
                u.volume = document.getElementById('volumeToggle').checked ? 1.0 : 0.8;
                window.speechSynthesis.speak(u);
                
                if (item) {
                    var newHist = [];
                    for(var i=0; i<historyList.length; i++) { if(historyList[i].ja !== item.ja) newHist.push(historyList[i]); }
                    newHist.unshift(item);
                    if (newHist.length > 20) newHist.pop();
                    historyList = newHist;
                    try { window.localStorage.setItem('jp_history', JSON.stringify(historyList)); } catch(e){}
                }
            };

            // 畫面渲染邏輯 (最安全 ES5 寫法防崩潰)
            window.render = function(cat, query) {
                var container = document.getElementById('button-container');
                container.innerHTML = '';
                
                if (cat === '✏️ 自訂') {
                    container.innerHTML = '<div class="custom-area"><textarea id="customInput" class="custom-textarea" placeholder="在此輸入中文..."></textarea><div id="translatedResult" class="translated-box">翻譯結果</div><button class="custom-play-btn" onclick="doTranslate()">🌍 翻譯並發音</button></div>';
                    return;
                }

                var list = [];
                if (cat === '🌟 全部') {
                    for (var k in phrasesData) { list = list.concat(phrasesData[k]); }
                } else if (cat === '⭐ 最愛') {
                    for (var key in phrasesData) {
                        for(var j=0; j<phrasesData[key].length; j++) {
                            if (favorites.indexOf(phrasesData[key][j].ja) > -1) list.push(phrasesData[key][j]);
                        }
                    }
                } else if (cat === '🕒 最近') {
                    list = historyList;
                } else if (cat === '🔞 隱藏模式') {
                    list = hiddenPhrases;
                } else {
                    list = phrasesData[cat] || [];
                }

                // 搜尋過濾
                if (query) {
                    query = query.toLowerCase();
                    var filtered = [];
                    for(var x=0; x<list.length; x++) {
                        if (list[x].zh.indexOf(query) > -1 || list[x].ja.indexOf(query) > -1 || (list[x].romaji && list[x].romaji.toLowerCase().indexOf(query) > -1)) {
                            filtered.push(list[x]);
                        }
                    }
                    list = filtered;
                }

                // 去重複機制 (避開 ES6 Map，防舊手機當機)
                var uniqueList = [];
                var seen = {};
                for(var y=0; y<list.length; y++) {
                    if(!seen[list[y].ja]) {
                        seen[list[y].ja] = true;
                        uniqueList.push(list[y]);
                    }
                }

                if (uniqueList.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-sub); margin-top:40px;">查無相關內容 🥺</p>';
                    return;
                }

                // 產生 DOM
                for (var z = 0; z < uniqueList.length; z++) {
                    var item = uniqueList[z];
                    var isFav = favorites.indexOf(item.ja) > -1;
                    var div = document.createElement('div');
