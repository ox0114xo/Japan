<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Ultra v5.0</title>
    
    <style>
        :root { --bg: #070b14; --blue: #3b82f6; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); --txt: #fff; --sub: #94a3b8; --green: #10b981; --gold: #fbbf24; --red: #ef4444; }
        html, body { background-color: #070b14; min-height: 100vh; color: var(--txt); margin: 0; font-family: sans-serif; text-align: center; }
        body { background-image: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); background-attachment: fixed; padding-bottom: 100px; }
        
        .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        #title { font-size: 24px; margin: 20px 0; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .version { font-size: 12px; color: var(--green); vertical-align: middle; border: 1px solid var(--green); padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
        
        .search { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; }
        
        .grid-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 15px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .nav-help { color: var(--gold); border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 12px; display: flex; justify-content: center; align-items: center; font-size: 14px; color: var(--sub); font-weight: bold; gap: 5px; }
        
        .cats { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .cats::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }

        .list { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; text-align: left; }
        .card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 20px; border: 1px solid var(--border); text-align: center; overflow: hidden; }
        .card-in { padding: 20px 15px; cursor: pointer; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(59,130,246,0.2); margin-bottom: 6px; display: inline-block; }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); font-style: italic; }
        .bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .m-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; }
        .m-zh { font-size: 22px; color: var(--sub); margin-top: 30px; }
        .m-close { margin-top: 40px; padding: 15px 50px; background: #1e293b; color: #fff; border-radius: 30px; font-size: 18px; font-weight: bold; border: 1px solid var(--border); cursor: pointer; }
    </style>
</head>
<body>

    <div id="ttsGuide" class="modal">
        <div style="background:#1e293b; padding:25px; border-radius:20px; border:1px solid var(--border); max-width:90%; text-align:left;">
            <h2 style="color:var(--red); margin-top:0; text-align:center;">🔇 發音失敗</h2>
            <p style="color:var(--sub); font-size:15px; line-height:1.6;">
                <b style="color:var(--gold);">1. 網站權限：</b>點擊網址列旁邊的鎖頭圖示，確認「聲音」已允許。<br><br>
                <b style="color:var(--gold);">2. 靜音模式：</b>請確認手機未開啟靜音，且「媒體音量」已調大。<br><br>
                <b style="color:var(--gold);">3. 語音包：</b>前往手機設定 > 語音輸出 > 下載日文語音包。
            </p>
            <button onclick="document.getElementById('ttsGuide').style.display='none'" style="width:100%; padding:15px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:bold; margin-top:10px; font-size:16px;">關閉提示</button>
        </div>
    </div>

    <div class="wrap">
        <h1 id="title" onclick="unlock()">🇯🇵 Japan Travel <span class="version">v5.0 成功版</span></h1>
        
        <input type="text" id="search" class="search" placeholder="🔍 搜尋你想說的話...">

        <div class="grid-ctrl">
            <button class="nav-btn nav-help" onclick="document.getElementById('ttsGuide').style.display='flex'">🚑 沒聲音?</button>
            <div class="panel"><label>龜速發音 <input type="checkbox" id="spd"></label></div>
        </div>

        <div class="cats" id="cat-box"></div>
        
        <div class="list" id="list">
            <h3 style="color:var(--sub);" id="loadingMsg">載入中...</h3>
        </div>
    </div>

    <div id="mod" class="modal">
        <div class="m-ja" id="m-ja"></div>
        <div class="m-zh" id="m-zh"></div>
        <button class="m-close" onclick="document.getElementById('mod').style.display='none'">✖ 關閉</button>
    </div>

    <script>
        // 絕對安全的資料格式
        var D = {
            "👋 常用": [
                {z:"你好",j:"こんにちは",r:"Konnichiwa"},{z:"謝謝",j:"ありがとうございます",r:"Arigatou"},{z:"不好意思",j:"すみません",r:"Sumimasen"},{z:"沒關係",j:"大丈夫です",r:"Daijoubu"},{z:"拜託了",j:"お願いします",r:"Onegaishimasu"},{z:"對不起",j:"ごめんなさい",r:"Gomennasai"}
            ],
            "🏨 住宿": [
                {z:"辦理入住",j:"チェックインをお願いします",r:"Chekku-in"},{z:"我有預約",j:"予約しています",r:"Yoyaku"},{z:"寄放行李",j:"荷物を預かってもらえますか",r:"Nimotsu"},{z:"退房",j:"チェックアウトをお願いします",r:"Chekku-auto"},{z:"沒熱水",j:"お湯が出ません",r:"Oyu ga"}
            ],
            "🍜 餐廳": [
                {z:"兩位",j:"2人です",r:"Futari"},{z:"菜單",j:"メニューはありますか",r:"Menyuu"},{z:"點這個",j:"これを注文します",r:"Kore o"},{z:"結帳",j:"お会計をお願いします",r:"Okaikei"},{z:"外帶",j:"持ち帰りで",r:"Mochikaeri"}
            ],
            "🛍️ 購物": [
                {z:"多少錢",j:"いくらですか",r:"Ikura"},{z:"免稅嗎",j:"免税できますか",r:"Menzei"},{z:"試穿",j:"試着してもいいですか",r:"Shichaku"},{z:"刷卡",j:"カードは使えますか",r:"Kaado"}
            ]
        };

        var HDN = [{z:"笨蛋",j:"馬鹿 (ばか)",r:"Baka"},{z:"去死",j:"死ね (しね)",r:"Shine"},{z:"吵死了",j:"うるさい",r:"Urusai"}];

        var curCat = "👋 常用";
        var clickCount = 0;

        // 全域發音函數
        function playVoice(txt) {
            try {
                if (!window.speechSynthesis) { document.getElementById('ttsGuide').style.display = 'flex'; return; }
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(txt);
                u.lang = 'ja-JP';
                var spd = document.getElementById('spd');
                u.rate = (spd && spd.checked) ? 0.45 : 0.85;
                u.onerror = function() { document.getElementById('ttsGuide').style.display = 'flex'; };
                window.speechSynthesis.speak(u);
            } catch(e) { document.getElementById('ttsGuide').style.display = 'flex'; }
        }

        // 全域放大函數
        function showZoom(ja, zh) {
            document.getElementById('m-ja').innerText = ja;
            document.getElementById('m-zh').innerText = zh;
            document.getElementById('mod').style.display = 'flex';
        }

        // 渲染列表
        function renderList(cat, query) {
            var box = document.getElementById('list');
            box.innerHTML = '';
            
            var arr = [];
            if(cat === "🔞 隱藏") { arr = HDN; }
            else { arr = D[cat] || []; }

            if(query) {
                query = query.toLowerCase();
                var temp = [];
                for(var j=0; j<arr.length; j++) {
                    if(arr[j].z.indexOf(query)>-1 || arr[j].j.indexOf(query)>-1) temp.push(arr[j]);
                }
                arr = temp;
            }

            for(var i=0; i<arr.length; i++) {
                var item = arr[i];
                var card = document.createElement('div');
                card.className = 'card';
                
                var inner = document.createElement('div');
                inner.className = 'card-in';
                inner.setAttribute('onclick', 'playVoice("' + item.j + '")');
                inner.innerHTML = '<div class="zh">' + item.z + '</div>' +
                                  '<div class="ja-box"><span class="ja">🔊 ' + item.j + '</span></div>' +
                                  '<div class="ro">' + item.r + '</div>';
                
                var btn = document.createElement('button');
                btn.className = 'bar-btn';
                btn.innerText = '🪧 放大顯示';
                btn.setAttribute('onclick', 'showZoom("' + item.j + '", "' + item.z + '")');

                card.appendChild(inner);
                card.appendChild(btn);
                box.appendChild(card);
            }
            if(arr.length === 0) box.innerHTML = '<h3 style="color:#94a3b8;">查無資料</h3>';
        }

        // 切換分類
        function setCat(c) {
            curCat = c;
            var btns = document.getElementsByClassName('cat-btn');
            for(var i=0; i<btns.length; i++) {
                btns[i].className = 'cat-btn';
                if(btns[i].innerText === c) btns[i].className = 'cat-btn active';
            }
            renderList(curCat, document.getElementById('search').value);
        }

        // 解鎖彩蛋
        function unlock() {
            clickCount++;
            if(clickCount === 10) {
                var btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.style.color = 'var(--red)';
                btn.style.borderColor = 'var(--red)';
                btn.innerText = '🔞 隱藏';
                btn.onclick = function() { setCat('🔞 隱藏'); };
                document.getElementById('cat-box').prepend(btn);
                setCat('🔞 隱藏');
                alert('解鎖成功！');
            }
        }

        // 初始化
        function init() {
            var cbox = document.getElementById('cat-box');
            for(var k in D) {
                var btn = document.createElement('button');
                btn.className = 'cat-btn';
                if(k === curCat) btn.className += ' active';
                btn.innerText = k;
                btn.setAttribute('onclick', 'setCat("' + k + '")');
                cbox.appendChild(btn);
            }
            document.getElementById('search').oninput = function(e) { renderList(curCat, e.target.value); };
            renderList(curCat, "");
        }

        // 確保 DOM 載入後執行
        setTimeout(init, 100);

    </script>
</body>
</html>
