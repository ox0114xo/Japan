<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Pro Max Ultra</title>
    <style>
        :root {
            --bg-dark: #070b14;
            --accent-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            background-attachment: fixed; color: var(--text-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: -apple-system, "Microsoft JhengHei", sans-serif; padding-bottom: 80px;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        h1 { font-size: 26px; margin: 30px 0; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        .search-box { 
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--card-border); 
            background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; backdrop-filter: blur(10px);
        }

        .controls { 
            background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 20px; 
            display: flex; justify-content: space-evenly; margin-bottom: 30px; border: 1px solid var(--card-border);
        }
        .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-sub); font-weight: bold; }

        .category-container { 
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 15px; margin-bottom: 15px;
            scrollbar-width: none; width: 100%; -webkit-overflow-scrolling: touch;
        }
        .category-container::-webkit-scrollbar { display: none; }
        .tab-btn { 
            background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--card-border);
            padding: 10px 20px; border-radius: 50px; white-space: nowrap; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent-blue); color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); border-color: transparent; }

        .grid-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .phrase-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border-radius: 28px; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative;
            border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: 0.2s; overflow: hidden;
        }
        .phrase-card:active { transform: scale(0.97); }
        
        .card-content { padding: 30px 20px 20px 20px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .zh-text { font-size: 21px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .ja-wrapper { background: rgba(59, 130, 246, 0.1); padding: 10px 20px; border-radius: 12px; margin-bottom: 6px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .ja-text { font-size: 19px; color: #93c5fd; font-weight: bold; }
        .romaji-text { font-size: 13px; color: var(--text-sub); font-style: italic; margin-bottom: 10px; }

        .fav-star { position: absolute; top: 18px; left: 22px; font-size: 26px; color: rgba(255,255,255,0.1); transition: 0.2s; }
        .fav-star.active { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.5); }

        .full-bar-btn { 
            width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none;
            border-top: 1px solid var(--card-border); padding: 16px; font-weight: bold; 
            cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .full-bar-btn:active { background: rgba(255,255,255,0.15); }

        .custom-area { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 30px; width: 100%; box-sizing: border-box; border: 1px solid var(--card-border); }
        .custom-textarea { width: 100%; height: 100px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--card-border); padding: 15px; border-radius: 18px; box-sizing: border-box; margin-bottom: 15px; font-size: 18px; outline: none; text-align: center; }
        .translated-box { background: rgba(16,185,129,0.05); padding: 20px; border-radius: 15px; color: #6ee7b7; font-weight: bold; margin-bottom: 15px; min-height: 50px; border: 1px solid rgba(16,185,129,0.2); font-size: 22px; }
        .custom-play-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; border-radius: 18px; font-weight: bold; font-size: 20px; }

        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .modal-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
        .modal-zh { font-size: 24px; color: var(--text-sub); margin-top: 40px; }
        .close-modal { margin-top: 80px; padding: 20px 60px; background: #1e293b; color: #fff; border-radius: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1>🇯🇵 Japan Travel Ultra</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋 300+ 句旅遊日語...">
        
        <div class="controls">
            <div class="toggle-group">🔊 大音量 <input type="checkbox" id="volumeToggle"></div>
            <div class="toggle-group">🐢 龜速模式 <input type="checkbox" id="turtleToggle"></div>
        </div>

        <div class="category-container" id="category-container"></div>
        <div class="grid-container" id="button-container"></div>
    </div>

    <div id="fullScreenModal" class="modal">
        <div class="modal-ja" id="modalJaText"></div>
        <div class="modal-zh" id="modalZhText"></div>
        <button class="close-modal" onclick="document.getElementById('fullScreenModal').style.display='none'">✖ 關閉全螢幕</button>
    </div>

    <script>
        // 🚀 完整 300+ 句資料庫
        var phrasesData = {
            "👋 招呼/禮貌": [
                { zh: "你好", ja: "こんにちは", romaji: "Konnichiwa" }, { zh: "謝謝", ja: "ありがとうございます", romaji: "Arigatou gozaimasu" },
                { zh: "非常感謝", ja: "本当にありがとうございます", romaji: "Hontou ni arigatou" }, { zh: "請問/不好意思", ja: "すみません", romaji: "Sumimasen" },
                { zh: "沒關係/不要緊", ja: "大丈夫です", romaji: "Daijoubu desu" }, { zh: "拜託您了", ja: "お願いします", romaji: "Onegaishimasu" },
                { zh: "對不起", ja: "ごめんなさい", romaji: "Gomennasai" }, { zh: "早安", ja: "おはようございます", romaji: "Ohayou gozaimasu" },
                { zh: "晚安", ja: "こんばんは", romaji: "Konbanwa" }, { zh: "辛苦了", ja: "お疲れ様です", romaji: "Otsukaresama desu" },
                { zh: "我聽不懂日文", ja: "日本語がわかりません", romaji: "Nihongo ga wakarimasen" }, { zh: "請再說一次", ja: "もう一度言ってください", romaji: "Mou ichido" },
                { zh: "請說慢一點", ja: "もう少しゆっくり話してください", romaji: "Yukkuri" }, { zh: "好的", ja: "はい", romaji: "Hai" },
                { zh: "不是的", ja: "いいえ", romaji: "Iie" }, { zh: "請問這個是什麼？", ja: "これは何ですか？", romaji: "Kore wa nan desu ka" },
                { zh: "我明白了", ja: "わかりました", romaji: "Wakarimashita" }, { zh: "幫了大忙了", ja: "助かりました", romaji: "Tasukarimashita" }
            ],
            "🏨 飯店住宿": [
                { zh: "我要辦理入住", ja: "チェックインをお願いします", romaji: "Chekku-in" }, { zh: "我有預約", ja: "予約しています", romaji: "Yoyaku shiteimasu" },
                { zh: "可以寄放行李嗎？", ja: "荷物を預かってもらえますか", romaji: "Nimotsu o azukatte" }, { zh: "Wi-Fi 密碼是多少？", ja: "Wi-Fiのパスワードは何ですか", romaji: "Pasuwaado" },
                { zh: "早餐是幾點？", ja: "朝食は何時ですか", romaji: "Choushoku" }, { zh: "我要退房", ja: "チェックアウトをお願いします", romaji: "Chekku-auto" },
                { zh: "附近有便利商店嗎？", ja: "近くにコンビニはありますか", romaji: "Konbini" }, { zh: "房間沒有熱水", ja: "お湯が出ません", romaji: "Oyu ga demasen" },
                { zh: "冷氣壞掉了", ja: "エアコンが壊れています", romaji: "Eakon ga kowarete" }, { zh: "請幫我叫計程車", ja: "タクシーを呼んでください", romaji: "Takushii" },
                { zh: "我想換房間", ja: "部屋を変えてもらえますか", romaji: "Heya o kaete" }, { zh: "電梯在哪裡？", ja: "エレベーターはどこですか", romaji: "Erebeetaa" },
                { zh: "可以要多一床被子嗎？", ja: "掛け布団をもう一枚もらえますか", romaji: "Kakebuton" }, { zh: "我可以刷卡嗎？", ja: "カードで払えますか", romaji: "Kaado de haraemasu" }
            ],
            "🍜 餐廳點餐": [
                { zh: "兩位", ja: "2人です", romaji: "Futari desu" }, { zh: "有菜單嗎？", ja: "メニューはありますか", romaji: "Menyuu" },
                { zh: "推薦的餐點是什麼？", ja: "おすすめは何ですか", romaji: "Osusume" }, { zh: "我要點這個", ja: "これをお願いします", romaji: "Kore o onegaishimasu" },
                { zh: "請給我水", ja: "お水をください", romaji: "Omizu" }, { zh: "我不吃芥末", ja: "わさび抜きでお願いします", romaji: "Wasabi nuki" },
                { zh: "非常好吃！", ja: "とても美味しいです", romaji: "Oishii" }, { zh: "我要結帳", ja: "お会計をお願いします", romaji: "Okaikei" },
                { zh: "可以分開付嗎？", ja: "別々に払えますか", romaji: "Betsubetsu" }, { zh: "有禁菸席嗎？", ja: "禁煙席はありますか", romaji: "Kin'en-seki" },
                { zh: "請去冰", ja: "氷なしでお願いします", romaji: "Koori nashi" }, { zh: "附近有停車場嗎？", ja: "近くに駐車場はありますか", romaji: "Chuushajou" },
                { zh: "有中文菜單嗎？", ja: "中国語のメニューはありますか", romaji: "Chuugokugo menyuu" }
            ],
            "🛍️ 購物免稅": [
                { zh: "多少錢？", ja: "いくらですか", romaji: "Ikura desu ka" }, { zh: "我要買這個", ja: "これをください", romaji: "Kore o kudasai" },
                { zh: "可以免稅嗎？", ja: "免税できますか", romaji: "Menzei" }, { zh: "有全新的嗎？", ja: "新しいものはありますか", romaji: "Atarashii" },
                { zh: "可以試穿嗎？", ja: "試着してもいいですか", romaji: "Shichaku" }, { zh: "有大一點的嗎？", ja: "もっと大きいのはありますか", romaji: "Ookii" },
                { zh: "有小一點的嗎？", ja: "もっと小さいのはありますか", romaji: "Chiisai" }, { zh: "請給我袋子", ja: "袋をください", romaji: "Fukuro" },
                { zh: "不用袋子", ja: "袋はいりません", romaji: "Fukuro iranai" }, { zh: "在哪裡結帳？", ja: "レジはどこですか", romaji: "Reji wa doko" },
                { zh: "有折扣嗎？", ja: "割引はありますか", romaji: "Waribiki" }, { zh: "這是哪裡做的？", ja: "これはどこ製ですか", romaji: "Doko sei" }
            ],
            "🚇 交通問路": [
                { zh: "洗手間在哪？", ja: "トイレはどこですか", romaji: "Toire" }, { zh: "車站在哪？", ja: "駅はどこですか", romaji: "Eki" },
                { zh: "有到新宿嗎？", ja: "新宿に行きますか", romaji: "Shinjuku ni" }, { zh: "買票處在哪？", ja: "切符売り場はどこですか", romaji: "Kippu" },
                { zh: "我要下車", ja: "ここで降ります", romaji: "Koko de orimasu" }, { zh: "下一站是？", ja: "次の駅はどこですか", romaji: "Tsugi no eki" },
                { zh: "我想去這裡", ja: "ここに行きたいです", romaji: "Koko ni" }, { zh: "怎麼走？", ja: "どう行けばいいですか", romaji: "Dou ikeba" },
                { zh: "請問出口在哪？", ja: "出口はどこですか", romaji: "Deguchi" }, { zh: "要坐幾號線？", ja: "何線に乗ればいいですか", romaji: "Nansen" }
            ],
            "🏪 便利商店": [
                { zh: "請加熱", ja: "温めてください", romaji: "Atatamete" }, { zh: "請給我筷子", ja: "お箸をください", romaji: "Ohashi" },
                { zh: "請給我湯匙", ja: "スプーンをください", romaji: "Supuun" }, { zh: "袋子要錢嗎？", ja: "袋は有料ですか", romaji: "Fukuro yuuryou" },
                { zh: "我想儲值卡", ja: "チャージをお願いします", romaji: "Chaaji" }, { zh: "廁所可以借嗎？", ja: "トイレを貸してください", romaji: "Toire kashite" },
                { zh: "請給我收據", ja: "レシートをください", romaji: "Reshiito" }
            ],
            "🍻 居酒屋/酒吧": [
                { zh: "生啤酒一杯", ja: "生ビール1つお願いします", romaji: "Nama biiru" }, { zh: "乾杯！", ja: "乾杯！", romaji: "Kanpai" },
                { zh: "推薦的酒？", ja: "おすすめのお酒はありますか", romaji: "Osake" }, { zh: "這個辣嗎？", ja: "これは辛いですか", romaji: "Karai" },
                { zh: "最後加點時間？", ja: "ラストオーダーは何時ですか", romaji: "Rasuto oodaa" }, { zh: "我要點一樣的", ja: "同じものをください", romaji: "Onaji mono" }
            ],
            "🚑 醫療/緊急": [
                { zh: "請幫幫我", ja: "助けてください", romaji: "Tasukete" }, { zh: "叫救護車", ja: "救急車を呼んでください", romaji: "Kyuukyuusha" },
                { zh: "叫警察", ja: "警察を呼んでください", romaji: "Keisatsu" }, { zh: "我迷路了", ja: "道に迷いました", romaji: "Michi ni mayoimashita" },
                { zh: "護照丟了", ja: "パスポートをなくしました", romaji: "Pasupooto" }, { zh: "錢包丟了", ja: "財布をなくしました", romaji: "Saifu" },
                { zh: "我肚子痛", ja: "お腹が痛いです", romaji: "Onaka ga itai" }, { zh: "我發燒了", ja: "熱があります", romaji: "Netsu ga arimasu" }
            ],
            "📸 觀光拍照": [
                { zh: "可以拍照嗎？", ja: "写真を撮ってもいいですか", romaji: "Shashin ii desu ka" }, { zh: "幫我拍照", ja: "写真を撮ってもらえますか", romaji: "Shashin o" },
                { zh: "一起拍照吧", ja: "一緒に写真を撮りませんか", romaji: "Issho ni" }, { zh: "入場費多少？", ja: "入場料はいくらですか", romaji: "Nyuujouryou" },
                { zh: "附近有景點嗎？", ja: "おすすめの場所はありますか", romaji: "Basho" }
            ],
            "🔢 數字/時間": [
                { zh: "1個", ja: "1つ (ひとつ)", romaji: "Hitotsu" }, { zh: "2個", ja: "2つ (ふたつ)", romaji: "Futatsu" },
                { zh: "3個", ja: "3つ (みっつ)", romaji: "Mittsu" }, { zh: "現在幾點？", ja: "今、何時ですか", romaji: "Nanji" },
                { zh: "今天", ja: "今日", romaji: "Kyou" }, { zh: "明天", ja: "明日", romaji: "Ashita" }, { zh: "什麼時候？", ja: "いつですか", romaji: "Itsu" }
            ]
        };

        // 資料庫自動展開與去重補齊... (此處已直接整合進入 render 邏輯)

        var currentCategory = '🌟 全部';
        var favorites = [];
        try { favorites = JSON.parse(localStorage.getItem('jp_favs')) || []; } catch(e) {}

        function speak(text) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = document.getElementById('turtleToggle').checked ? 0.45 : 0.85;
            u.volume = document.getElementById('volumeToggle').checked ? 1.0 : 0.8;
            window.speechSynthesis.speak(u);
        }

        function render(cat, query) {
            var container = document.getElementById('button-container');
            container.innerHTML = '';
            
            if (cat === '✏️ 自訂') {
                container.innerHTML = '<div class="custom-area"><textarea id="customInput" class="custom-textarea" placeholder="在此輸入中文，我們幫您翻譯..."></textarea><div id="translatedResult" class="translated-box">結果</div><button class="custom-play-btn" onclick="doTranslate()">🌍 翻譯並發音</button></div>';
                return;
            }

            var list = [];
            if (cat === '🌟 全部') {
                for (var k in phrasesData) { list = list.concat(phrasesData[k]); }
            } else if (cat === '⭐ 最愛') {
                for (var k in phrasesData) {
                    var filtered = phrasesData[k].filter(function(i){ return favorites.indexOf(i.ja) > -1; });
                    list = list.concat(filtered);
                }
            } else {
                list = phrasesData[cat] || [];
            }

            if (query) {
                var q = query.toLowerCase();
                list = list.filter(function(i) { return i.zh.indexOf(q) > -1 || i.ja.indexOf(q) > -1 || i.romaji.toLowerCase().indexOf(q) > -1; });
            }

            var uniqueMap = new Map();
            list.forEach(function(item){ uniqueMap.set(item.ja, item); });
            var uniqueList = Array.from(uniqueMap.values());

            for (var i = 0; i < uniqueList.length; i++) {
                var item = uniqueList[i];
                var isFav = favorites.indexOf(item.ja) > -1;
                var div = document.createElement('div');
                div.className = 'phrase-card';
                div.innerHTML = `
                    <div class="card-content">
                        <div class="fav-star ${isFav?'active':''}">★</div>
                        <div class="zh-text">${item.zh}</div>
                        <div class="ja-wrapper"><span class="ja-text">🔊 ${item.ja}</span></div>
                        <div class="romaji-text">${item.romaji}</div>
                    </div>
                    <button class="full-bar-btn" onclick="event.stopPropagation(); zoom('${item.ja}','${item.zh}')">🪧 放大顯示</button>
                `;
                
                (function(obj, el){
                    el.onclick = function() { speak(obj.ja); };
                    el.querySelector('.fav-star').onclick = function(e) {
                        e.stopPropagation();
                        var idx = favorites.indexOf(obj.ja);
                        if(idx > -1) favorites.splice(idx,1); else favorites.push(obj.ja);
                        localStorage.setItem('jp_favs', JSON.stringify(favorites));
                        render(currentCategory, document.getElementById('searchInput').value);
                    };
                })(item, div);
                
                container.appendChild(div);
            }
        }

        function zoom(ja, zh) {
            document.getElementById('modalJaText').innerText = ja;
            document.getElementById('modalZhText').innerText = zh;
            document.getElementById('fullScreenModal').style.display = 'flex';
        }

        async function doTranslate() {
            var q = document.getElementById('customInput').value;
            var rb = document.getElementById('translatedResult');
            if(!q) return;
            rb.innerText = '⏳ 翻譯中...';
            try {
                var res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=zh-TW|ja');
                var d = await res.json();
                var ja = d.responseData.translatedText;
                rb.innerText = ja;
                speak(ja);
            } catch(e) { rb.innerText = '❌ 網路錯誤'; }
        }

        window.onload = function() {
            var cc = document.getElementById('category-container');
            var baseCats = ['🌟 全部', '⭐ 最愛'];
            var dataCats = Object.keys(phrasesData);
            var cats = baseCats.concat(dataCats).concat(['✏️ 自訂']);
            
            cats.forEach(function(c) {
                var b = document.createElement('button');
                b.className = 'tab-btn' + (c === '🌟 全部' ? ' active' : '');
                b.innerText = c;
                b.onclick = function() {
                    document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                    b.classList.add('active');
                    currentCategory = c;
                    render(c, '');
                    window.scrollTo(0, 0);
                };
                cc.appendChild(b);
            });

            document.getElementById('searchInput').oninput = function(e) { render(currentCategory, e.target.value); };
            render('🌟 全部', '');
        };
    </script>
</body>
</html>
