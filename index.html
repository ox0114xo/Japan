<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 封神版</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日語神器">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

    <script>
        try {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if ((ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1)) {
                if (location.search.indexOf("openExternalBrowser=1") === -1) {
                    location.href = location.href + (location.search ? "&" : "?") + "openExternalBrowser=1";
                }
                document.addEventListener('DOMContentLoaded', function() {
                    var blocker = document.getElementById('inAppBlocker');
                    if (blocker) blocker.style.display = 'flex';
                });
            }
        } catch(e) {}
    </script>

    <style>
        :root { --bg: #070b14; --blue: #3b82f6; --card: #1e293b; --border: #334155; --txt: #f8fafc; --sub: #94a3b8; --green: #10b981; --gold: #fbbf24; --red: #ef4444; }
        html, body { background-color: var(--bg); min-height: 100vh; color: var(--txt); margin: 0; font-family: sans-serif; text-align: center; }
        body { background-image: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); background-attachment: fixed; padding-bottom: 120px; }
        
        .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .title { font-size: 26px; margin: 20px 0; font-weight: 900; text-shadow: 0 0 10px rgba(59,130,246,0.5); user-select: none; cursor: pointer;}
        
        .search { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.7); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; }
        
        .grid-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn.active { background: var(--blue); border-color: transparent; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .btn-red { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.5); color: var(--red); grid-column: span 2; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--sub); display: flex; justify-content: center; align-items: center; gap: 5px; font-weight: bold;}
        
        .cats { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .cats::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }

        .list { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 20px; border: 1px solid var(--border); text-align: center; overflow: hidden; position: relative; }
        .card-in { padding: 20px 15px 15px; cursor: pointer; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; margin-bottom: 6px; display: inline-block; border: 1px solid rgba(59,130,246,0.2); }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); font-style: italic; }
        .star { position: absolute; top: 12px; left: 12px; font-size: 26px; color: rgba(255,255,255,0.1); padding: 5px; cursor: pointer; }
        .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .zoom-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .m-box { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; text-align: left; border: 1px solid var(--border); }
        .m-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; word-wrap: break-word; }
        .m-zh { font-size: 22px; color: var(--sub); margin-top: 30px; text-align: center; font-weight:bold; }
        .m-close { width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; margin-top: 20px; font-size: 16px; cursor: pointer; }

        #inAppBlocker { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="inAppBlocker">
        <h1 style="color:var(--red);font-size:60px;margin:0;">⚠️</h1>
        <h2>請切換瀏覽器</h2>
        <p style="color:var(--sub);">內部瀏覽器會導致發音失敗，請點擊右上角「使用預設瀏覽器開啟」。</p>
    </div>

    <div id="ttsGuide" class="modal">
        <div class="m-box">
            <h2 style="color:var(--red); margin-top:0; text-align:center;">🔇 發音失敗</h2>
            <p style="color:var(--txt); font-size:15px; line-height:1.6;">
                1. 檢查網址列旁邊鎖頭的<b>「聲音權限」</b>。<br><br>
                2. 確認手機未開啟<b>「靜音模式」</b>。<br><br>
                3. 前往手機設定下載<b>「日文語音包」</b>。
            </p>
            <label style="display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:14px; margin-top:15px; cursor:pointer;">
                <input type="checkbox" id="chkIgnoreTTS" style="width:18px; height:18px; margin-right:8px;">
                ✅ 我有聲音，請不要自動彈出
            </label>
            <button class="m-close" onclick="closeTTS()">關閉提示</button>
        </div>
    </div>

    <div id="zoomModal" class="modal">
        <div class="m-ja" id="m-ja"></div>
        <div class="m-zh" id="m-zh"></div>
        <button class="m-close" style="background:#1e293b; border:1px solid #334155; margin-top:40px; border-radius:30px;" onclick="document.getElementById('zoomModal').style.display='none'">✖ 關閉</button>
    </div>

    <div class="wrap">
        <div class="title" onclick="unlockHidden()">🇯🇵 Japan Travel 封神版</div>
        
        <input type="text" id="search" class="search" placeholder="🔍 搜尋你想說的話...">

        <div class="grid-ctrl">
            <button class="btn" id="btn-rec" onclick="changeCat('🕒 最近')">🕒 最近</button>
            <button class="btn" id="btn-fav" onclick="changeCat('⭐ 最愛')">⭐ 最愛</button>
            <div class="panel"><label>🔊 大音量 <input type="checkbox" id="vol" checked></label></div>
            <div class="panel"><label>🐢 龜速 <input type="checkbox" id="spd"></label></div>
            <button class="btn btn-red" onclick="document.getElementById('ttsGuide').style.display='flex'">🚑 點我沒聲音看這裡</button>
        </div>

        <div class="cats" id="cat-box"></div>
        <div class="list" id="list">
            <h3 id="errMsg" style="color:red; display:none;"></h3>
        </div>
    </div>
