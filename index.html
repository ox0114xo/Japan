<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Pro Max Ultra 300</title>
    <style>
        :root {
            --bg-dark: #070b14;
            --accent-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --success: #10b981;
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            background-attachment: fixed; color: var(--text-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            font-family: -apple-system, "SF Pro Display", "Microsoft JhengHei", sans-serif; padding-bottom: 80px;
        }

        .app-wrapper { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        h1 { font-size: 28px; margin: 30px 0; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }

        /* 🔍 搜尋區 */
        .search-box { 
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--card-border); 
            background: rgba(0,0,0,0.4); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; backdrop-filter: blur(10px);
        }

        /* 🎛️ 控制區 */
        .controls { 
            background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 20px; 
            display: flex; justify-content: space-evenly; margin-bottom: 30px; border: 1px solid var(--card-border);
        }
        .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-sub); font-weight: bold; }

        /* 🏷️ 分類選單 */
        .category-container { 
            display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 20px 0; margin-bottom: 15px;
            scrollbar-width: none; width: 100%; -webkit-overflow-scrolling: touch;
        }
        .category-container::-webkit-scrollbar { display: none; }
        .tab-btn { 
            background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--card-border);
            padding: 10px 22px; border-radius: 50px; white-space: nowrap; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent-blue); color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); border-color: transparent; }

        /* 💳 卡片設計 */
        .grid-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .phrase-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border-radius: 30px; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative;
            border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: 0.1s; overflow: hidden;
        }
        .phrase-card:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
        
        .card-content { padding: 30px 20px 20px 20px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .zh-text { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #fff; letter-spacing: 1px; }
        
        .ja-wrapper { background: rgba(59, 130, 246, 0.1); padding: 12px 25px; border-radius: 15px; margin-bottom: 8px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .ja-text { font-size: 20px; color: #93c5fd; font-weight: bold; }
        .romaji-text { font-size: 14px; color: var(--text-sub); font-style: italic; margin-bottom: 15px; }

        .fav-star { position: absolute; top: 20px; left: 25px; font-size: 26px; color: rgba(255,255,255,0.1); transition: 0.2s; }
        .fav-star.active { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }

        /* 🚀 長條形放大按鈕 */
        .full-bar-btn { 
            width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none;
            border-top: 1px solid var(--card-border); padding: 18px; font-weight: bold; 
            cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .full-bar-btn:active { background: rgba(255,255,255,0.15); color: #fff; }

        /* 🌍 自訂翻譯區 */
        .custom-area { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 30px; width: 100%; box-sizing: border-box; border: 1px solid var(--card-border); }
        .custom-textarea { width: 100%; height: 100px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--card-border); padding: 15px; border-radius: 18px; box-sizing: border-box; margin-bottom: 15px; font-size: 18px; outline: none; text-align: center; }
        .translated-box { background: rgba(16,185,129,0.05); padding: 20px; border-radius: 15px; color: #6ee7b7; font-weight: bold; margin-bottom: 15px; min-height: 50px; border: 1px solid rgba(16,185,129,0.2); font-size: 22px; text-align: center; }
        .custom-play-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; border-radius: 18px; font-weight: bold; font-size: 20px; }

        /* 全螢幕 Modal */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .modal-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
        .modal-zh { font-size: 24px; color: var(--text-sub); margin-top: 40px; }
        .close-modal { margin-top: 80px; padding: 20px 60px; background: #1e293b; color: #fff; border-radius: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>

            ],
            "💬 日常應答": [
                { zh: "真的棒", ja: "最高です", romaji: "Saikou" }, { zh: "好可愛", ja: "かわいい", romaji: "Kawaii" }, { zh: "好冷", ja: "寒いですね", romaji: "Samui" }, { zh: "好熱", ja: "暑いですね", romaji: "Atsui" }, { zh: "肚子餓", ja: "お腹が空きました", romaji: "Onaka suita" }, { zh: "想睡覺", ja: "眠いです", romaji: "Nemui" }, { zh: "有趣", ja: "面白いです", romaji: "Omoshiroi" }, { zh: "太貴了", ja: "高すぎます", romaji: "Takasugi" }, { zh: "便宜", ja: "安いです", romaji: "Yasui" }, { zh: "沒事吧", ja: "大丈夫ですか？", romaji: "Daijoubu" }, { zh: "沒錯", ja: "その通りです", romaji: "Sono toori" }, { zh: "不知道", ja: "知りません", romaji: "Shirimasen" }, { zh: "也許吧", ja: "たぶん", romaji: "Tabun" }, { zh: "不可能", ja: "無理です", romaji: "Muri" }, { zh: "當然", ja: "もちろんです", romaji: "Mochiron" }, { zh: "太好了", ja: "よかった", romaji: "Yokatta" }, { zh: "真遺憾", ja: "残念ですね", romaji: "Zannen" }, { zh: "加油", ja: "頑張ってください", romaji: "Ganbatte" }, { zh: "救命", ja: "助けて！", romaji: "Tasukete" }, { zh: "安靜點", ja: "静かにしてください", romaji: "Shizuka" }, { zh: "請快點", ja: "早くしてください", romaji: "Hayaku" }, { zh: "別這樣", ja: "やめてください", romaji: "Yamete" }, { zh: "真的嗎", ja: "本当ですか？", romaji: "Hontou" }, { zh: "開玩笑", ja: "冗談です", romaji: "Joudan" }, { zh: "好美", ja: "美しいですね", romaji: "Utsukushii" }
            ]
        };

        // --- 核心邏輯 ---
        var currentCategory = '🌟 全部';
        var favorites = [];
        var historyList = [];
        try { 
            favorites = JSON.parse(localStorage.getItem('jp_favs')) || []; 
            historyList = JSON.parse(localStorage.getItem('jp_history')) || [];
        } catch(e) {}

        function speak(text, item) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = document.getElementById('turtleToggle').checked ? 0.45 : 0.85;
            u.volume = document.getElementById('volumeToggle').checked ? 1.0 : 0.8;
            window.speechSynthesis.speak(u);

            if (item) {
                historyList = historyList.filter(function(h){ return h.ja !== item.ja; });
                historyList.unshift(item);
                if (historyList.length > 20) historyList.pop();
                localStorage.setItem('jp_history', JSON.stringify(historyList));
            }
        }

        function render(cat, query) {
            var container = document.getElementById('button-container');
            container.innerHTML = '';
            
            if (cat === '✏️ 自訂') {
                container.innerHTML = '<div class="custom-area"><textarea id="customInput" class="custom-textarea" placeholder="在此輸入中文，我們幫您翻譯..."></textarea><div id="translatedResult" class="translated-box">結果將在此顯示</div><button class="custom-play-btn" onclick="doTranslate()">🌍 翻譯並發音</button></div>';
                return;
            }

            var list = [];
            if (cat === '🌟 全部') {
                for (var k in phrasesData) { list = list.concat(phrasesData[k]); }
            } else if (cat === '⭐ 最愛') {
                for (var k in phrasesData) {
                    var filtered = phrasesData[k].filter(function(i){ return favorites.indexOf(i.ja) > -1; });
                    list = list.concat(filtered);
                }
            } else if (cat === '🕒 最近') {
                list = historyList;
            } else {
                list = phrasesData[cat] || [];
            }

            if (query) {
                query = query.toLowerCase();
                list = list.filter(function(i) { 
                    return i.zh.toLowerCase().indexOf(query) > -1 || i.ja.indexOf(query) > -1 || (i.romaji && i.romaji.toLowerCase().indexOf(query) > -1); 
                });
            }

            var uniqueMap = new Map();
            list.forEach(function(item){ uniqueMap.set(item.ja, item); });
            var uniqueList = Array.from(uniqueMap.values());

            for (var i = 0; i < uniqueList.length; i++) {
                var item = uniqueList[i];
                var isFav = favorites.indexOf(item.ja) > -1;
                var div = document.createElement('div');
                div.className = 'phrase-card';
                div.innerHTML = `
                    <div class="card-content">
                        <div class="fav-star ${isFav?'active':''}">★</div>
                        <div class="zh-text">${item.zh}</div>
                        <div class="ja-wrapper"><span class="ja-text">🔊 ${item.ja}</span></div>
                        <div class="romaji-text">${item.romaji || ''}</div>
                    </div>
                    <button class="full-bar-btn" onclick="event.stopPropagation(); zoom('${item.ja}','${item.zh}')">🪧 放大顯示</button>
                `;
                
                (function(obj, el){
                    el.onclick = function() { speak(obj.ja, obj); };
                    el.querySelector('.fav-star').onclick = function(e) {
                        e.stopPropagation();
                        var idx = favorites.indexOf(obj.ja);
                        if(idx > -1) favorites.splice(idx,1); else favorites.push(obj.ja);
                        localStorage.setItem('jp_favs', JSON.stringify(favorites));
                        render(currentCategory, document.getElementById('searchInput').value);
                    };
                })(item, div);
                
                container.appendChild(div);
            }
        }

        function zoom(ja, zh) {
            document.getElementById('modalJaText').innerText = ja;
            document.getElementById('modalZhText').innerText = zh;
            document.getElementById('fullScreenModal').style.display = 'flex';
        }

        async function doTranslate() {
            var q = document.getElementById('customInput').value;
            var rb = document.getElementById('translatedResult');
            if(!q) return;
            rb.innerText = '⏳ 翻譯中...';
            try {
                var res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=zh-TW|ja');
                var d = await res.json();
                var ja = d.responseData.translatedText;
                rb.innerText = ja;
                speak(ja);
            } catch(e) { rb.innerText = '❌ 網路錯誤'; }
        }

        window.onload = function() {
            var cc = document.getElementById('category-container');
            var baseCats = ['🌟 全部', '🕒 最近', '⭐ 最愛'];
            var dataCats = Object.keys(phrasesData);
            var cats = baseCats.concat(dataCats).concat(['✏️ 自訂']);
            
            cats.forEach(function(c) {
                var b = document.createElement('button');
                b.className = 'tab-btn' + (c === '🌟 全部' ? ' active' : '');
                b.innerText = c;
                b.onclick = function() {
                    document.querySelectorAll('.tab-btn').forEach(function(btn){ btn.classList.remove('active'); });
                    b.classList.add('active');
                    currentCategory = c;
                    document.getElementById('searchInput').value = '';
                    render(c, '');
                    window.scrollTo(0, 0);
                };
                cc.appendChild(b);
            });

            document.getElementById('searchInput').oninput = function(e) { render(currentCategory, e.target.value); };
            render('🌟 全部', '');
        };
    </script>
