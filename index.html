        .search-box:focus { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .toggle-group { display: flex; align-items: center; font-size: 14px; gap: 8px; font-weight: 600; color: #cbd5e1; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        input:checked + .slider { background-color: var(--success); }

        /* 分類標籤 */
        .category-container { display: flex; overflow-x: auto; white-space: nowrap; padding-bottom: 20px; gap: 12px; scrollbar-width: none; }

        .tab-btn { background: rgba(255,255,255,0.05); color: var(--text-sub); border: 1px solid var(--glass-border); border-radius: 25px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-grad); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(99,102,241,0.4); transform: translateY(-2px); }

        /* 卡片 UI */
        .grid-container { display: flex; flex-direction: column; gap: 15px; }
        .phrase-card { border-radius: 24px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.15); transition: 0.15s; cursor: pointer; }
        .phrase-card:active { transform: scale(0.97); background: rgba(255,255,255,0.12); }
        .text-area { display: flex; flex-direction: column; flex: 1; margin: 0 12px 0 5px; pointer-events: none; }
        .zh-text { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
        .ja-text { font-size: 17px; color: var(--ja-color); font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .romaji-text { font-size: 14px; color: var(--text-sub); letter-spacing: 0.5px; }
        .action-area { display: flex; flex-direction: column; gap: 8px; }
        .action-btn { background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid var(--glass-border); border-radius: 14px; padding: 8px 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        .fav-star.active { color: var(--star-active); text-shadow: 0 0 15px rgba(251,191,36,0.6); transform: scale(1.1); }

        .modal { display: none; position: fixed; z-index: 2000; inset: 0; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .modal-ja { color: #fff; font-size: 12vw; font-weight: 900; text-align: center; line-height: 1.3; text-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .close-modal-btn { margin-top: 50px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: rgba(16,185,129,0.9); backdrop-filter: blur(8px); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.4s; z-index: 9999; }
