<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本旅遊常用句</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
        }

        /* 拉桿區塊樣式 */
        .settings-panel {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }
        .slider-group label {
            width: 80px;
        }
        .slider-group input[type="range"] {
            flex-grow: 1;
            margin: 0 15px;
        }
        .slider-value {
            width: 30px;
            text-align: right;
        }

        /* 分類按鈕區塊樣式 */
        .category-container {
            margin-bottom: 20px;
        }
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .category-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .category-btn:hover, .category-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <h1>日本旅遊常用句</h1>

    <div class="settings-panel">
        <div class="slider-group">
            <label for="rate">語速</label>
            <input type="range" id="rate" min="0" max="2" step="0.1" value="1.0">
            <span class="slider-value" id="rate-val">1.0</span>
        </div>
        <div class="slider-group">
            <label for="pitch">音調</label>
            <input type="range" id="pitch" min="0" max="2" step="0.1" value="1.0">
            <span class="slider-value" id="pitch-val">1.0</span>
        </div>
    </div>

    <div class="category-container">
        <div class="category-row">
            <button class="category-btn active">全部</button>
            <button class="category-btn">最愛</button>
            <button class="category-btn">自訂</button>
        </div>
        <div class="category-row">
            <button class="category-btn">機場</button>
            <button class="category-btn">交通</button>
            <button class="category-btn">住宿</button>
            <button class="category-btn">餐廳</button>
            <button class="category-btn">購物</button>
            <button class="category-btn">求助</button>
        </div>
    </div>

    <div id="phrase-list">
        </div>

    <script>
        // 更新拉桿數值顯示與防呆機制
        const rateSlider = document.getElementById('rate');
        const pitchSlider = document.getElementById('pitch');
        const rateVal = document.getElementById('rate-val');
        const pitchVal = document.getElementById('pitch-val');

        rateSlider.addEventListener('input', function() {
            // 讓畫面上顯示一位小數，例如 1.0
            rateVal.textContent = parseFloat(this.value).toFixed(1);
        });

        pitchSlider.addEventListener('input', function() {
            pitchVal.textContent = parseFloat(this.value).toFixed(1);
        });

        // 當需要發音 (TTS) 時，獲取語速的範例函數
        function getSpeechRate() {
            let val = parseFloat(rateSlider.value);
            // 語音 API (SpeechSynthesis) 的 rate 如果是 0 會報錯或無聲
            // 所以在背景幫它設定一個極小值，但 UI 依然維持置中好看
            return val === 0 ? 0.1 : val; 
        }
        
        function getSpeechPitch() {
            return parseFloat(pitchSlider.value);
        }
    </script>
</body>
</html>
