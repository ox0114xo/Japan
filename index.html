<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 Ultra 最終版</title>
    <meta property="og:title" content="日本旅遊神器 Ultra">
    <meta property="og:description" content="內建海量實用旅遊日語。支援離線收藏、發音與即時翻譯，助您日本行溝通無阻。">
    <style>
        :root { --bg: #070b14; --blue: #3b82f6; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); --txt: #fff; --sub: #94a3b8; --green: #10b981; --gold: #fbbf24; --red: #ef4444; }
        body { background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%); background-attachment: fixed; color: var(--txt); margin: 0; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; padding-bottom: 120px; min-height: 100vh; }
        .wrap { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; }
        #title { font-size: 26px; margin: 20px 0; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(59,130,246,0.5); cursor: pointer; }
        .search { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: #fff; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; }
        
        .grid-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-top { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 15px; font-weight: bold; font-size: 14px; transition: 0.2s; cursor: pointer; }
        .btn-top.active { background: var(--blue); border-color: transparent; box-shadow: 0 0 10px var(--blue); }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 12px; display: flex; justify-content: center; align-items: center; font-size: 13px; color: var(--sub); font-weight: bold; gap: 5px; }
        
        .cats { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .cats::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; }
        
        .list { display: flex; flex-direction: column; gap: 15px; }
        .card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border-radius: 24px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .card-in { padding: 25px 15px 15px; display: flex; flex-direction: column; align-items: center; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(59,130,246,0.2); margin-bottom: 6px; }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); font-style: italic; margin-bottom: 5px; }
        .star { position: absolute; top: 15px; left: 15px; font-size: 24px; color: rgba(255,255,255,0.1); padding: 5px; }
        .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .bar-btn { width: 100%; background: rgba(255,255,255,0.05); color: #cbd5e1; border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
        
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .m-ja { font-size: 12vw; font-weight: 900; color: #fff; text-align: center; }
        .m-zh { font-size: 22px; color: var(--sub); margin-top: 30px; }
        .m-close { margin-top: 50px; padding: 15px 50px; background: #1e293b; color: #fff; border-radius: 30px; font-size: 18px; font-weight: bold; border: none; }
        
        .c-area { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        .c-txt { width: 100%; height: 80px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 12px; box-sizing: border-box; text-align: center; font-size: 16px; outline: none; }
        .c-res { padding: 15px; color: var(--green); font-weight: bold; font-size: 18px; text-align: center; min-height: 30px; }
        .c-btn { width: 100%; padding: 15px; background: var(--green); color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 id="title">🇯🇵 Japan Travel Ultra</h1>
        <input type="text" id="search" class="search" placeholder="🔍 搜尋你想說的話...">
        
        <div class="grid-ctrl">
            <button class="btn-top" id="b-rec">🕒 最近</button>
            <button class="btn-top" id="b-fav">⭐ 最愛</button>
            <div class="panel">🔊 大音量 <input type="checkbox" id="vol"></div>
            <div class="panel">🐢 龜速 <input type="checkbox" id="spd"></div>
        </div>

        <div class="cats" id="cat-box"></div>
        <div class="list" id="list"></div>
    </div>

    <div id="mod" class="modal">
        <div class="m-ja" id="m-ja"></div>
        <div class="m-zh" id="m-zh"></div>
        <button class="m-close" onclick="document.getElementById('mod').style.display='none'">✖ 關閉</button>
    </div>

    <script>
        // 🚀 高密度壓縮語料庫 (確保語法絕對正確不會斷尾)
        const D = {
            "👋 常用": [
                {z:"你好",j:"こんにちは",r:"Konnichiwa"},{z:"謝謝",j:"ありがとうございます",r:"Arigatou"},{z:"不好意思",j:"すみません",r:"Sumimasen"},{z:"沒關係",j:"大丈夫です",r:"Daijoubu"},{z:"拜託了",j:"お願いします",r:"Onegaishimasu"},{z:"對不起",j:"ごめんなさい",r:"Gomennasai"},{z:"早安",j:"おはようございます",r:"Ohayou"},{z:"晚安",j:"こんばんは",r:"Konbanwa"},{z:"不懂日文",j:"日本語がわかりません",r:"Nihongo ga wakarimasen"},{z:"再說一次",j:"もう一度言ってください",r:"Mou ichido"},{z:"好的",j:"はい",r:"Hai"},{z:"不是",j:"いいえ",r:"Iie"},{z:"幫大忙了",j:"助かりました",r:"Tasukari"},{z:"慢一點",j:"ゆっくり話してください",r:"Yukkuri"}
            ],
            "🏨 住宿": [
                {z:"辦理入住",j:"チェックインをお願いします",r:"Chekku-in"},{z:"我有預約",j:"予約しています",r:"Yoyaku"},{z:"寄放行李",j:"荷物を預かってもらえますか",r:"Nimotsu"},{z:"Wi-Fi密碼",j:"Wi-Fiのパスワードは何ですか",r:"Pasuwaado"},{z:"退房",j:"チェックアウトをお願いします",r:"Chekku-auto"},{z:"沒熱水",j:"お湯が出ません",r:"Oyu ga"},{z:"叫計程車",j:"タクシーを呼んでください",r:"Takushii"},{z:"換房間",j:"部屋を変えてください",r:"Heya kaete"},{z:"多一條毛巾",j:"タオルをもう一枚ください",r:"Taoru"}
            ],
            "🍜 餐廳": [
                {z:"兩位",j:"2人です",r:"Futari"},{z:"菜單",j:"メニューはありますか",r:"Menyuu"},{z:"推薦什麼",j:"おすすめは何ですか",r:"Osusume"},{z:"點這個",j:"これを注文します",r:"Kore o"},{z:"給我水",j:"お水をください",r:"Omizu"},{z:"不要芥末",j:"わさび抜きでお願いします",r:"Wasabi nuki"},{z:"很好吃",j:"美味しいです",r:"Oishii"},{z:"結帳",j:"お会計をお願いします",r:"Okaikei"},{z:"分開付",j:"別々に払えますか",r:"Betsubetsu"},{z:"外帶",j:"持ち帰りで",r:"Mochikaeri"}
            ],
            "🛍️ 購物": [
                {z:"多少錢",j:"いくらですか",r:"Ikura"},{z:"買這個",j:"これをください",r:"Kore o"},{z:"免稅嗎",j:"免税できますか",r:"Menzei"},{z:"全新",j:"新しいものはありますか",r:"Atarashii"},{z:"試穿",j:"試着してもいいですか",r:"Shichaku"},{z:"大的",j:"大きいのはありますか",r:"Ookii"},{z:"袋子",j:"袋をください",r:"Fukuro"},{z:"刷卡",j:"カードは使えますか",r:"Kaado"}
            ],
            "🚇 交通": [
                {z:"廁所在哪",j:"トイレはどこですか",r:"Toire"},{z:"車站",j:"駅はどこですか",r:"Eki"},{z:"去新宿",j:"新宿に行きますか",r:"Shinjuku"},{z:"買票處",j:"切符売り場はどこですか",r:"Kippu"},{z:"下車",j:"ここで降ります",r:"Koko de orimasu"},{z:"下一站",j:"次の駅はどこですか",r:"Tsugi"},{z:"出口",j:"出口はどこですか",r:"Deguchi"}
            ],
            "🏪 超商": [
                {z:"加熱",j:"温めてください",r:"Atatamete"},{z:"筷子",j:"お箸をください",r:"Ohashi"},{z:"免袋子",j:"袋はいりません",r:"Fukuro iranai"},{z:"收據",j:"レシートをください",r:"Reshiito"},{z:"儲值",j:"チャージをお願いします",r:"Chaaji"}
            ],
            "🚑 緊急": [
                {z:"救命",j:"助けてください",r:"Tasukete"},{z:"救護車",j:"救急車を呼んでください",r:"Kyuukyuusha"},{z:"警察",j:"警察を呼んでください",r:"Keisatsu"},{z:"迷路了",j:"道に迷いました",r:"Michi"},{z:"護照丟了",j:"パスポートをなくしました",r:"Pasupooto"},{z:"發燒",j:"熱があります",r:"Netsu"}
            ]
        };

        const HDN = [
            {z:"笨蛋",j:"馬鹿 (ばか)",r:"Baka"},{z:"白癡",j:"阿呆 (あほう)",r:"Ahou"},{z:"去死",j:"死ね (しね)",r:"Shine"},{z:"混蛋",j:"馬鹿野郎",r:"Bakayarou"},{z:"吵死了",j:"うるさい",r:"Urusai"}
        ];

        let cur = '🌟 全部', favs = [], hist = [], clk = 0;
        try { 
            let f = localStorage.getItem('jp_f'); if(f) favs = JSON.parse(f);
            let h = localStorage.getItem('jp_h'); if(h) hist = JSON.parse(h);
        } catch(e) {}

        function spk(txt, item) {
            try {
                window.speechSynthesis.cancel();
                let u = new SpeechSynthesisUtterance(txt);
                u.lang = 'ja-JP';
                u.rate = document.getElementById('spd').checked ? 0.45 : 0.85;
                u.volume = document.getElementById('vol').checked ? 1.0 : 0.8;
                window.speechSynthesis.speak(u);
            } catch(e) { alert("此設備無法發音"); }

            if (item) {
                hist = hist.filter(h => h.j !== item.j);
                hist.unshift(item);
                if (hist.length > 20) hist.pop();
                try { localStorage.setItem('jp_h', JSON.stringify(hist)); } catch(e){}
            }
        }

        function draw(cat, q) {
            let box = document.getElementById('list');
            box.innerHTML = '';
            
            if (cat === '✏️ 自訂') {
                box.innerHTML = '<div class="c-area"><textarea id="cin" class="c-txt" placeholder="輸入中文..."></textarea><div id="cres" class="c-res"></div><button class="c-btn" onclick="trans()">🌍 翻譯並發音</button></div>';
                return;
            }

            let arr = [];
            if (cat === '🌟 全部') { for (let k in D) arr.push(...D[k]); }
            else if (cat === '⭐ 最愛') { for (let k in D) arr.push(...D[k].filter(i => favs.includes(i.j))); }
            else if (cat === '🕒 最近') { arr = hist; }
            else if (cat === '🔞 隱藏') { arr = HDN; }
            else { arr = D[cat] || []; }

            if (q) {
                q = q.toLowerCase();
                arr = arr.filter(i => i.z.includes(q) || i.j.includes(q) || (i.r && i.r.toLowerCase().includes(q)));
            }

            // 去重複
            let uniq = []; let seen = new Set();
            for (let i of arr) { if (!seen.has(i.j)) { seen.add(i.j); uniq.push(i); } }

            if(uniq.length === 0) { box.innerHTML = '<p style="color:#94a3b8;margin-top:30px;">查無資料</p>'; return; }

            uniq.forEach(i => {
                let isF = favs.includes(i.j);
                let d = document.createElement('div');
                d.className = 'card';
                d.innerHTML = `
                    <div class="card-in">
                        <div class="star ${isF?'active':''}">★</div>
                        <div class="zh">${i.z}</div>
                        <div class="ja-box"><span class="ja">🔊 ${i.j}</span></div>
                        <div class="ro">${i.r||''}</div>
                    </div>
                    <button class="bar-btn">🪧 放大顯示</button>
                `;
                d.onclick = (e) => { if(e.target.tagName !== 'BUTTON') spk(i.j, i); };
                d.querySelector('.star').onclick = (e) => {
                    e.stopPropagation();
                    let idx = favs.indexOf(i.j);
                    if(idx > -1) favs.splice(idx,1); else favs.push(i.j);
                    try{ localStorage.setItem('jp_f', JSON.stringify(favs)); }catch(err){}
                    draw(cur, document.getElementById('search').value);
                };
                d.querySelector('.bar-btn').onclick = (e) => {
                    e.stopPropagation();
                    document.getElementById('m-ja').innerText = i.j;
                    document.getElementById('m-zh').innerText = i.z;
                    document.getElementById('mod').style.display = 'flex';
                };
                box.appendChild(d);
            });
        }

        async function trans() {
            let q = document.getElementById('cin').value, r = document.getElementById('cres');
            if(!q) return; r.innerText = '⏳ 翻譯中...';
            try {
                let res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=zh-TW|ja');
                let data = await res.json(); 
                r.innerText = data.responseData.translatedText; 
                spk(r.innerText, null);
            } catch(e) { r.innerText = '❌ 網路錯誤'; }
        }

        document.getElementById('title').onclick = () => {
            clk++;
            if (clk === 10) {
                let b = document.createElement('button'); b.className = 'cat-btn'; b.style.color = '#ef4444'; b.style.borderColor = '#ef4444'; b.innerText = '🔞 隱藏';
                b.onclick = function() { setC('🔞 隱藏'); };
                document.getElementById('cat-box').prepend(b);
                setC('🔞 隱藏'); alert("解鎖髒話模式！");
            }
        };

        function setC(c) {
            cur = c;
            document.querySelectorAll('.cat-btn, .btn-top').forEach(btn => btn.classList.remove('active'));
            
            if(c === '🕒 最近') document.getElementById('b-rec').classList.add('active');
            else if(c === '⭐ 最愛') document.getElementById('b-fav').classList.add('active');
            else {
                let btns = document.querySelectorAll('.cat-btn');
                for(let b of btns) if(b.innerText === c) b.classList.add('active');
            }
            draw(c, document.getElementById('search').value);
        }

        // 啟動
        let cbox = document.getElementById('cat-box');
        ['🌟 全部', ...Object.keys(D), '✏️ 自訂'].forEach(c => {
            let b = document.createElement('button'); b.className = 'cat-btn' + (c==='🌟 全部'?' active':''); b.innerText = c;
            b.onclick = () => { document.getElementById('search').value = ''; setC(c); };
            cbox.appendChild(b);
        });

        document.getElementById('b-rec').onclick = () => setC('🕒 最近');
        document.getElementById('b-fav').onclick = () => setC('⭐ 最愛');
        document.getElementById('search').oninput = (e) => draw(cur, e.target.value);
        
        draw('🌟 全部', '');
    </script>
</body>
</html>
