<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊神器 浴火重生版</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日語神器">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

    <script>
        try {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1) {
                if (location.search.indexOf("openBrowser=1") === -1) {
                    location.href = location.href + (location.search ? "&" : "?") + "openBrowser=1";
                }
                document.addEventListener("DOMContentLoaded", function() {
                    var b = document.getElementById("blocker");
                    if(b) b.style.display = "flex";
                });
            }
        } catch(e) {}
    </script>

    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #3b82f6; --green: #10b981; --red: #ef4444; --gold: #fbbf24; --text: #f8fafc; --sub: #94a3b8; --border: #334155; }
        body { background-color: var(--bg); color: var(--text); margin: 0; font-family: sans-serif; text-align: center; padding-bottom: 100px; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .title { font-size: 26px; font-weight: 900; margin: 20px 0; color: #fff; cursor: pointer; user-select: none; }
        
        .install-btn { display: none; background: var(--green); color: #fff; padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(16,185,129,0.3); }

        .search { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; font-size: 16px; text-align: center; box-sizing: border-box; outline: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn.active { background: var(--blue); border-color: var(--blue); }
        .btn-red { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.5); color: var(--red); grid-column: span 2; }
        .chk-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--sub); display: flex; justify-content: center; align-items: center; gap: 5px; font-weight: bold; }
        
        .cat-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-item { background: var(--card); color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 30px; white-space: nowrap; font-weight: bold; cursor: pointer; }
        .cat-item.active { background: #475569; color: #fff; border-color: #fff; }

        .list-area { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
        .card-inner { padding: 20px 15px; cursor: pointer; }
        .zh { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .ja-box { background: rgba(59,130,246,0.15); padding: 8px 15px; border-radius: 10px; margin-bottom: 5px; display: inline-block; border: 1px solid rgba(59,130,246,0.2); }
        .ja { font-size: 18px; color: #93c5fd; font-weight: bold; }
        .ro { font-size: 13px; color: var(--sub); }
        .star { position: absolute; top: 12px; left: 12px; font-size: 26px; color: #334155; padding: 5px; cursor: pointer; }
        .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .zoom-btn { width: 100%; background: rgba(255,255,255,0.05); color: var(--sub); border: none; border-top: 1px solid var(--border); padding: 15px; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .m-box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: left; border: 1px solid var(--border); }
        .m-close { width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; margin-top: 20px; font-size: 16px; cursor: pointer; }

        #blocker { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="blocker">
        <h1 style="color:var(--red); font-size:60px; margin:0;">⚠️</h1>
        <h2>請切換瀏覽器</h2>
        <p style="color:var(--sub);">請點擊右上角「使用預設瀏覽器開啟」以確保發音正常。</p>
    </div>

    <div id="modal-tts" class="modal">
        <div class="m-box">
            <h2 style="color:var(--red); margin-top:0; text-align:center;">🔇 發音失敗</h2>
            <p style="color:var(--text); font-size:15px; line-height:1.6;">
                1. 檢查網址列旁邊鎖頭的<b>「聲音權限」</b>。<br><br>
                2. 確認手機未開啟<b>「靜音模式」</b>。<br><br>
                3. 前往手機設定下載<b>「日文語音包」</b>。
            </p>
            <label style="display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:14px; margin-top:15px; cursor:pointer;">
                <input type="checkbox" id="chk-ignore" style="width:18px; height:18px; margin-right:8px;">
                ✅ 我有聲音，請不要自動彈出
            </label>
            <button class="m-close" onclick="document.getElementById('modal-tts').style.display='none'">關閉提示</button>
        </div>
    </div>

    <div id="modal-zoom" class="modal">
        <div id="z-ja" style="font-size:12vw; font-weight:900; color:#fff; text-align:center;"></div>
        <div id="z-zh" style="font-size:22px; color:var(--sub); margin-top:30px; text-align:center;"></div>
        <button class="m-close" style="background:var(--border);" onclick="document.getElementById('modal-zoom').style.display='none'">✖ 關閉</button>
    </div>

    <div class="container">
        <div class="title" onclick="unlock()">🇯🇵 Japan Travel 浴火版</div>
        
        <div id="install-btn" class="install-btn" onclick="doInstall()">📲 點此將神器安裝到手機桌面</div>

        <input type="text" id="search" class="search" placeholder="🔍 搜尋想說的話 (中/日皆可)...">

        <div class="grid-2">
            <button class="btn" id="btn-rec" onclick="setCat('🕒 最近')">🕒 最近</button>
            <button class="btn" id="btn-fav" onclick="setCat('⭐ 最愛')">⭐ 最愛</button>
            <div class="chk-box"><label>🔊 大音量 <input type="checkbox" id="vol" checked></label></div>
            <div class="chk-box"><label>🐢 龜速 <input type="checkbox" id="spd"></label></div>
            <button class="btn btn-red" onclick="document.getElementById('modal-tts').style.display='flex'">🚑 沒聲音看這裡</button>
        </div>

        <div class="cat-scroll" id="cat-box"></div>
        
        <div class="list-area" id="list-box">
            <h3 style="color:var(--gold);">☁️ 正在連線 Google 試算表...</h3>
        </div>
    </div>

    <script>
        // 變數宣告
        var DB = [];
        var HDN = [];
        var cats = ["🌟 全部"];
        var curCat = "🌟 全部";
        var favs = [];
        var hist = [];
        var clickCnt = 0;
        var lastTxt = "";
        var lastTime = 0;

        // 讀取本地暫存
        try {
            var f = localStorage.getItem('v7_fav'); if(f) favs = JSON.parse(f);
            var h = localStorage.getItem('v7_hist'); if(h) hist = JSON.parse(h);
        } catch(e) {}

        // PWA 安裝邏輯
        var promptEvent;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            promptEvent = e;
            document.getElementById('install-btn').style.display = 'block';
        });

        function doInstall() {
            if (promptEvent) {
                promptEvent.prompt();
                promptEvent.userChoice.then(function(res) {
                    if (res.outcome === 'accepted') document.getElementById('install-btn').style.display = 'none';
                    promptEvent = null;
                });
            } else {
                alert("請點擊瀏覽器選單的「加到主畫面」來安裝喔！");
            }
        }

        // 發音與防焦慮
        function spk(txt, zh, ro) {
            var ign = false;
            var chk = document.getElementById('chk-ignore');
            if (chk && chk.checked) ign = true;

            var now = new Date().getTime();
            if (txt === lastTxt && (now - lastTime) < 3000 && !ign) {
                document.getElementById('modal-tts').style.display = 'flex';
            }
            lastTxt = txt; lastTime = now;

            try {
                if (!window.speechSynthesis) { document.getElementById('modal-tts').style.display = 'flex'; return; }
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(txt);
                u.lang = 'ja-JP';
                var spd = document.getElementById('spd');
                var vol = document.getElementById('vol');
                u.rate = (spd && spd.checked) ? 0.45 : 0.85;
                u.volume = (vol && vol.checked) ? 1.0 : 0.8;
                u.onerror = function() { if(!ign) document.getElementById('modal-tts').style.display = 'flex'; };
                window.speechSynthesis.speak(u);
            } catch(e) { if(!ign) document.getElementById('modal-tts').style.display = 'flex'; }

            // 紀錄最近使用
            if (zh) {
                var temp = [];
                for (var i = 0; i < hist.length; i++) {
                    if (hist[i].j !== txt) temp.push(hist[i]);
                }
                temp.unshift({c: "🕒 最近", z: zh, j: txt, r: ro});
                if (temp.length > 20) temp.pop();
                hist = temp;
                try { localStorage.setItem('v7_hist', JSON.stringify(hist)); } catch(e) {}
            }
        }

        function tglFav(e, ja) {
            e.stopPropagation();
            var idx = favs.indexOf(ja);
            if (idx > -1) favs.splice(idx, 1);
            else favs.push(ja);
            try { localStorage.setItem('v7_fav', JSON.stringify(favs)); } catch(err) {}
            renderList(curCat, document.getElementById('search').value);
        }

        function zoom(e, ja, zh) {
            e.stopPropagation();
            document.getElementById('z-ja').innerText = ja;
            document.getElementById('z-zh').innerText = zh;
            document.getElementById('modal-zoom').style.display = 'flex';
        }

        function renderList(cat, q) {
            var box = document.getElementById('list-box');
            box.innerHTML = '';

            var arr = [];
            if (cat === "🌟 全部") {
                arr = DB;
            } else if (cat === "⭐ 最愛") {
                for (var i=0; i<DB.length; i++) { if (favs.indexOf(DB[i].j) > -1) arr.push(DB[i]); }
            } else if (cat === "🕒 最近") {
                arr = hist;
            } else if (cat === "🔞 隱藏") {
                arr = HDN;
            } else {
                for (var j=0; j<DB.length; j++) { if (DB[j].c === cat) arr.push(DB[j]); }
            }

            // 搜尋
            if (q) {
                q = q.toLowerCase();
                var tmp = [];
                for (var k=0; k<arr.length; k++) {
                    var item = arr[k];
                    if (item.z.indexOf(q) > -1 || item.j.indexOf(q) > -1 || (item.r && item.r.toLowerCase().indexOf(q) > -1)) {
                        tmp.push(item);
                    }
                }
                arr = tmp;
            }

            // 去重複
            var finalArr = [];
            var seen = {};
            for (var m=0; m<arr.length; m++) {
                if (!seen[arr[m].j]) {
                    seen[arr[m].j] = true;
                    finalArr.push(arr[m]);
                }
            }

            if (finalArr.length === 0) {
                box.innerHTML = '<h3 style="color:var(--sub); text-align:center;">查無資料</h3>';
                return;
            }

            var html = "";
            for (var n=0; n<finalArr.length; n++) {
                var o = finalArr[n];
                var sFav = (favs.indexOf(o.j) > -1) ? "active" : "";
                var sJ = o.j.replace(/'/g, "\\'");
                var sZ = o.z.replace(/'/g, "\\'");
                var sR = o.r ? o.r.replace(/'/g, "\\'") : "";

                html += '<div class="card">' +
                            '<div class="star '+sFav+'" onclick="tglFav(event, \''+sJ+'\')">★</div>' +
                            '<div class="card-inner" onclick="spk(\''+sJ+'\', \''+sZ+'\', \''+sR+'\')">' +
                                '<div class="zh">'+o.z+'</div>' +
                                '<div class="ja-box"><span class="ja">🔊 '+o.j+'</span></div>' +
                                '<div class="ro">'+(o.r||'')+'</div>' +
                            '</div>' +
                            '<button class="zoom-btn" onclick="zoom(event, \''+sJ+'\', \''+sZ+'\')">🪧 放大顯示</button>' +
                        '</div>';
            }
            box.innerHTML = html;
        }

        function setCat(cName) {
            curCat = cName;
            var bRec = document.getElementById('btn-rec');
            var bFav = document.getElementById('btn-fav');
            bRec.className = (cName === '🕒 最近') ? 'btn active' : 'btn';
            bFav.className = (cName === '⭐ 最愛') ? 'btn active' : 'btn';

            var btns = document.getElementsByClassName('cat-item');
            for (var i=0; i<btns.length; i++) {
                btns[i].className = (btns[i].innerText === cName) ? 'cat-item active' : 'cat-item';
            }
            renderList(curCat, document.getElementById('search').value);
        }

        function unlock() {
            clickCnt++;
            if (clickCnt === 10) {
                if(HDN.length === 0) { alert('試算表裡還沒有 🔞 隱藏 分類喔！'); return; }
                var cBox = document.getElementById('cat-box');
                var html = '<button class="cat-item" style="color:var(--red);border-color:var(--red);" onclick="document.getElementById(\'search\').value=\'\'; setCat(\'🔞 隱藏\')">🔞 隱藏</button>';
                cBox.innerHTML = html + cBox.innerHTML;
                setCat('🔞 隱藏');
                alert('😈 成功解鎖隱藏模式！');
            }
        }

        // 搜尋監聽
        document.getElementById('search').oninput = function(e) {
            renderList(curCat, e.target.value);
        };

        // 🚀 CSV 抓取與初始化核心 (加上防舊手機報錯機制)
        function initApp() {
            var url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRHq-l6EXN9TgJN023pKVvrVHYQOb2-1rczW8Zzbq6jE3tfZS4x7HOFMdBicA0zs6LDYc2BjA6CMAfw/pub?output=csv";
            
            if (!window.fetch) {
                document.getElementById('list-box').innerHTML = '<h3 style="color:var(--red);">❌ 您的瀏覽器版本過舊，不支援雲端讀取功能。請更新 Chrome 瀏覽器。</h3>';
                return;
            }

            fetch(url)
            .then(function(res) {
                if (!res.ok) throw new Error("網路連線異常 (" + res.status + ")");
                return res.text();
            })
            .then(function(text) {
                var lines = text.split('\n');
                var tempCats = [];
                
                for (var i=1; i<lines.length; i++) {
                    var line = lines[i].replace(/\r/g, ''); // 清理換行符號
                    if (!line) continue;
                    
                    var cols = line.split(',');
                    if (cols.length >= 3) {
                        var c = cols[0].trim();
                        var z = cols[1].trim();
                        var j = cols[2].trim();
                        var r = (cols.length > 3) ? cols[3].trim() : "";
                        
                        if (!c || !z || !j) continue;
                        
                        if (c === "🔞 隱藏") {
                            HDN.push({c:c, z:z, j:j, r:r});
                        } else {
                            DB.push({c:c, z:z, j:j, r:r});
                            if (tempCats.indexOf(c) === -1) tempCats.push(c);
                        }
                    }
                }

                // 建立分類按鈕
                cats = cats.concat(tempCats);
                var cHtml = "";
                for (var x=0; x<cats.length; x++) {
                    var act = (cats[x] === '🌟 全部') ? 'active' : '';
                    cHtml += '<button class="cat-item '+act+'" onclick="document.getElementById(\'search\').value=\'\'; setCat(\''+cats[x]+'\')">'+cats[x]+'</button>';
                }
                document.getElementById('cat-box').innerHTML = cHtml;

                // 畫出列表
                renderList('🌟 全部', '');
            })
            .catch(function(err) {
                document.getElementById('list-box').innerHTML = '<h3 style="color:var(--red);">❌ 無法取得試算表資料<br><br><span style="font-size:14px;color:var(--sub);">錯誤原因: ' + err.message + '</span></h3>';
            });
        }

        // 啟動！
        initApp();

    </script>
</body>
</html>
